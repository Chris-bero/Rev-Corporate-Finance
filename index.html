      ar:["حساب العائد المتوقع من الاحتمالات وعوائد الحالات","حساب التباين والانحراف المعياري","تفسير σ كمخاطر كلية وتحديد مفهوم المعدل الخالي من المخاطر"]},
 blocks:[
  {h:{en:"Expected return",ar:"العائد المتوقع"},p:[
   {en:"Expected return is passed on the probabilities of possible outcomes: E(R) = Σ Pi × Ri across the states of nature (recession, normal, boom). The probabilities must sum to 1.",ar:"العائد المتوقع مبني على احتمالات النتائج الممكنة: E(R) = Σ Pi × Ri عبر حالات الطبيعة (ركود، طبيعي، ازدهار). ويجب أن تجمع الاحتمالات إلى 1."},{en:"Returns respond to announcements (such as annual reports) and to surprises beyond expectations — good or bad — which is why outcomes differ across states of nature.",ar:"تستجيب العوائد للإعلانات (مثل التقارير السنوية) وللمفاجآت خارج التوقعات — جيدة أو سيئة — ولهذا تختلف النتائج عبر حالات الطبيعة."}]},
  {h:{en:"Variance and standard deviation",ar:"التباين والانحراف المعياري"},p:[
   {en:"Variance σ² = Σ Pi (Ri − E(R))² weights each squared deviation by its probability; σ = √σ² is the most common measure of total risk. Higher σ → higher risk.",ar:"التباين σ² = Σ Pi (Ri − E(R))² يرجّح كل انحراف مربع باحتماله؛ وσ = √σ² هو المقياس الأشيع للمخاطر الكلية. σ أعلى ← مخاطر أعلى."}]},
  {h:{en:"The risk-free rate",ar:"المعدل الخالي من المخاطر"},p:[
   {en:"The risk-free rate is the return on an investment with zero risk of financial loss — professionals use treasury bills. It is the rate at which expected return equals actual return, and it anchors every risk premium in the course.",ar:"المعدل الخالي من المخاطر هو عائد استثمار بلا أي مخاطر خسارة مالية — يستخدم المحترفون أذون الخزانة. هو المعدل الذي يتساوى عنده العائد المتوقع مع الفعلي، وهو مرساة كل علاوة مخاطرة في المقرر."}]},
  {co:"simple",c:{en:"Expected return is the probability-weighted average of tomorrow's possible outcomes. Standard deviation asks: how far can those outcomes stray from that average? Wide stray = risky asset.",ar:"العائد المتوقع متوسط نتائج الغد الممكنة مرجحًا بالاحتمالات. والانحراف المعياري يسأل: كم يمكن أن تشرد تلك النتائج عن متوسطها؟ الشرد الواسع = أصل خطِر."}}],
 concepts:[{n:{en:"Total risk = σ",ar:"المخاطر الكلية = σ"},d:{en:"Standard deviation captures all variability of returns, systematic and unsystematic together.",ar:"الانحراف المعياري يلتقط كل تقلب العوائد، النظامي وغير النظامي معًا."},w:{en:"Later, beta carves the systematic part out of it — keep the two measures distinct.",ar:"لاحقًا تستخرج بيتا الجزء النظامي منه — أبقِ المقياسين متمايزين."}}],
 terms:[{t:{en:"Expected return",ar:"العائد المتوقع"},d:{en:"Probability-weighted average of possible returns.",ar:"متوسط العوائد الممكنة مرجحًا بالاحتمالات."},s:{en:"The centre of gravity of tomorrow's outcomes.",ar:"مركز ثقل نتائج الغد."}},
  {t:{en:"Standard deviation (σ)",ar:"الانحراف المعياري (σ)"},d:{en:"Square root of variance; the common measure of an asset's total risk.",ar:"جذر التباين؛ المقياس الشائع للمخاطر الكلية للأصل."},s:{en:"How bumpy the ride of this asset is.",ar:"كم وعرة رحلة هذا الأصل."}},
  {t:{en:"Risk-free rate",ar:"المعدل الخالي من المخاطر"},d:{en:"Return with zero risk of loss (e.g. T-bills); expected = actual return.",ar:"عائد بلا مخاطر خسارة (مثل أذون الخزانة)؛ المتوقع = الفعلي."},s:{en:"The safe floor under every other return.",ar:"الأرضية الآمنة تحت كل عائد آخر."}}],
 formulas:["er_ind","var_sd"],
 examples:[{ti:{en:"Stocks C & T across three states",ar:"السهمان C وT عبر ثلاث حالات"},
  g:[{en:"Probabilities: normal 0.5, boom 0.3, recession unknown. Returns — C: 0.02 / 0.10 / 0.15; T: 0.01 / 0.20 / 0.25 (recession/normal/boom).",ar:"الاحتمالات: طبيعي 0.5، ازدهار 0.3، ركود مجهول. العوائد — C: 0.02 / 0.10 / 0.15؛ T: 0.01 / 0.20 / 0.25 (ركود/طبيعي/ازدهار)."}],
  rq:{en:"Find the missing probability, both expected returns, and σ for each stock.",ar:"أوجد الاحتمال الناقص والعائد المتوقع لكل سهم وσ لكل منهما."},f:"er_ind",
  st:[{en:"P(recession) = 1 − 0.5 − 0.3 = 0.2",ar:"P(ركود) = 1 − 0.5 − 0.3 = 0.2"},
      {en:"E(R)C = .2(.02)+.5(.10)+.3(.15) = .0024+.05+.045 = 0.0974 (9.7%)",ar:"E(R)C = .2(.02)+.5(.10)+.3(.15) = .0024+.05+.045 = 0.0974 (9.7%)"},
      {en:"E(R)T = .2(.01)+.5(.20)+.3(.25) = .002+.1+.075 = 0.177 (17.7%)",ar:"E(R)T = .2(.01)+.5(.20)+.3(.25) = .002+.1+.075 = 0.177 (17.7%)"},
      {en:"σ²C = .2(.02−.097)² + .5(.10−.097)² + .3(.15−.097)² = .001198+.00000264+.000828 = .002028 → σC = 0.045",ar:"σ²C = .2(.02−.097)² + .5(.10−.097)² + .3(.15−.097)² = .001198+.00000264+.000828 = .002028 ← σC = 0.045"},
      {en:"σ²T = .007441 → σT = 0.0863",ar:"σ²T = .007441 ← σT = 0.0863"}],
  an:{en:"E(R): C 9.7%, T 17.7% · σ: C 4.5%, T 8.63%",ar:"العائد المتوقع: C 9.7% وT 17.7% · σ: C 4.5% وT 8.63%"},
  ip:{en:"T offers almost double the expected return but also almost double the total risk — the risk–return trade-off in one table.",ar:"T يمنح ضعف العائد المتوقع تقريبًا لكن بضعف المخاطر الكلية تقريبًا أيضًا — مقايضة المخاطرة والعائد في جدول واحد."}}],
 mistakes:[{en:"Leaving probabilities that do not sum to 1 — the missing state's probability is 1 minus the rest.",ar:"ترك احتمالات لا تجمع إلى 1 — احتمال الحالة الناقصة هو 1 ناقص الباقي."},{en:"Forgetting to square the deviations, or to weight them by Pi.",ar:"نسيان تربيع الانحرافات أو ترجيحها بـ Pi."},{en:"Calling σ 'systematic risk' — σ is total risk; systematic risk is beta.",ar:"تسمية σ «مخاطر نظامية» — σ مخاطر كلية؛ والنظامية هي بيتا."}],
 dist:[],map:[{en:"States of nature & probabilities",ar:"حالات الطبيعة واحتمالاتها"},{en:"E(R) = Σ Pi·Ri",ar:"E(R) = Σ Pi·Ri"},{en:"Deviations (Ri − E(R))",ar:"الانحرافات (Ri − E(R))"},{en:"σ² then σ = total risk",ar:"σ² ثم σ = المخاطر الكلية"}],
 sum:{ideas:[{en:"E(R) = Σ Pi Ri; probabilities sum to 1.",ar:"E(R) = Σ Pi Ri؛ والاحتمالات تجمع إلى 1."},{en:"σ² = Σ Pi (Ri − E(R))²; σ = √σ² = total risk.",ar:"σ² = Σ Pi (Ri − E(R))²؛ وσ = √σ² = المخاطر الكلية."},{en:"Risk-free: expected = actual (T-bills).",ar:"الخالي من المخاطر: المتوقع = الفعلي (أذون الخزانة)."}],
  terms:[{en:"Expected return",ar:"العائد المتوقع"},{en:"Variance",ar:"التباين"},{en:"Standard deviation",ar:"الانحراف المعياري"}],f:["er_ind","var_sd"],
  rem:[{en:"C: 9.7% & 4.5% · T: 17.7% & 8.63%.",ar:"C: 9.7% و4.5% · T: 17.7% و8.63%."}],
  exam:[{en:"State-table computations of E(R) and σ are standard quiz material.",ar:"حسابات جداول الحالات لـ E(R) وσ مادة اختبارات قياسية."}]}},
{id:"l12",ch:"c6",mins:15,title:{en:"Portfolios: Return, Risk & Beta",ar:"المحافظ: العائد والمخاطرة وبيتا"},
 desc:{en:"Portfolio weights and expected return, the two-asset standard deviation, diversification, and portfolio beta.",ar:"أوزان المحفظة وعائدها المتوقع، والانحراف المعياري لأصلين، والتنويع، وبيتا المحفظة."},
 obj:{en:["Compute portfolio weights and expected portfolio return","Apply the two-asset portfolio standard-deviation formula","Distinguish systematic, unsystematic and diversifiable risk","Compute a portfolio beta"],
      ar:["حساب أوزان المحفظة وعائدها المتوقع","تطبيق معادلة الانحراف المعياري لمحفظة أصلين","التمييز بين المخاطر النظامية وغير النظامية والقابلة للتنويع","حساب بيتا المحفظة"]},
 blocks:[
  {h:{en:"Weights and expected return",ar:"الأوزان والعائد المتوقع"},p:[
   {en:"A portfolio is a collection of assets. Each weight wi = amount invested in asset i ÷ total portfolio (weights sum to 1). The portfolio expected return is the weighted average of the individual expected returns: E(Rp) = Σ wi E(Ri).",ar:"المحفظة مجموعة أصول. كل وزن wi = المبلغ المستثمر في الأصل i ÷ إجمالي المحفظة (الأوزان تجمع إلى 1). والعائد المتوقع للمحفظة متوسط مرجح للعوائد المتوقعة الفردية: E(Rp) = Σ wi E(Ri)."}]},
  {h:{en:"Two-asset portfolio risk",ar:"مخاطر محفظة أصلين"},p:[
   {en:"σp = √(w1²σ1² + w2²σ2² + 2 w1 w2 ρ1,2 σ1 σ2). The correlation coefficient ρ drives the benefit: the less the two assets move together, the more risk vanishes.",ar:"σp = √(w1²σ1² + w2²σ2² + 2 w1 w2 ρ1,2 σ1 σ2). معامل الارتباط ρ هو محرك الفائدة: كلما قل تحرك الأصلين معًا تلاشى قدر أكبر من المخاطر."}]},
  {h:{en:"What diversification can and cannot kill",ar:"ما يقتله التنويع وما لا يقتله"},p:[
   {en:"Unsystematic (unique, asset-specific) risk — strikes, part shortages — can be eliminated by combining assets into a portfolio. Systematic (market, non-diversifiable) risk — GDP, inflation, interest rates — cannot. Holding one asset or one industry exposes you to risk you could have diversified away.",ar:"المخاطر غير النظامية (الفريدة الخاصة بأصل) — الإضرابات ونقص القطع — يمكن إزالتها بدمج الأصول في محفظة. أما النظامية (السوقية غير القابلة للتنويع) — الناتج المحلي والتضخم وأسعار الفائدة — فلا. حمل أصل واحد أو صناعة واحدة يعرضك لمخاطر كان يمكن تنويعها."}]},
  {h:{en:"Portfolio beta",ar:"بيتا المحفظة"},p:[
   {en:"Beta measures systematic risk; the portfolio beta is the weighted average of the individual betas: βp = Σ wi βi.",ar:"بيتا تقيس المخاطر النظامية؛ وبيتا المحفظة متوسط مرجح لبيتا الأفراد: βp = Σ wi βi."}]},
  {co:"simple",c:{en:"Mixing assets that do not dance to the same music smooths the ride: bad days of one are offset by good days of another. But no mix can hide the whole market from a storm — that part (beta) stays.",ar:"خلط أصول لا ترقص على الموسيقى نفسها ينعم الرحلة: يوم أحد السيئ يعادله يوم آخر الجيد. لكن لا خلطة تخفي السوق كلها من العاصفة — ذلك الجزء (بيتا) يبقى."}}],
 concepts:[{n:{en:"Diversification effect",ar:"أثر التنويع"},d:{en:"Combining imperfectly correlated assets reduces portfolio σ below the weighted average of individual σs.",ar:"دمج أصول غير مترابطة تمامًا يخفض σ للمحفظة تحت المتوسط المرجح لقيم σ الفردية."},w:{en:"It is the only 'free lunch' in finance: less risk without giving up expected return.",ar:"هو «الغداء المجاني» الوحيد في التمويل: مخاطر أقل دون التخلي عن العائد المتوقع."}},
  {n:{en:"Correlation coefficient ρ",ar:"معامل الارتباط ρ"},d:{en:"Measures how two assets move together; +1 perfect unison, 0 unrelated, −1 perfect opposite.",ar:"يقيس تحرك أصلين معًا؛ +1 تناغم تام، 0 لا علاقة، −1 تعاكس تام."},w:{en:"ρ = +0.75 in the course example means returns move together but not in perfect unison — so some risk still cancels.",ar:"ρ = +0.75 في مثال المقرر يعني أن العوائد تتحرك معًا لكن بلا تناغم تام — لذا يُلغى بعض المخاطر."}}],
 terms:[{t:{en:"Portfolio",ar:"المحفظة"},d:{en:"A collection of assets held together.",ar:"مجموعة أصول تُحمل معًا."},s:{en:"Not one basket of eggs — several.",ar:"لا سلة بيض واحدة — بل عدة سلال."}},
  {t:{en:"Systematic risk",ar:"المخاطر النظامية"},d:{en:"Market-wide risk affecting many assets; non-diversifiable; measured by beta.",ar:"مخاطر سوقية واسعة تصيب أصولًا كثيرة؛ غير قابلة للتنويع؛ تُقاس ببيتا."},s:{en:"The storm that hits every boat.",ar:"العاصفة التي تصيب كل القوارب."}},
  {t:{en:"Unsystematic risk",ar:"المخاطر غير النظامية"},d:{en:"Risk specific to one firm or industry; eliminated by diversification.",ar:"مخاطر خاصة بمنشأة أو صناعة واحدة؛ تُزال بالتنويع."},s:{en:"The leak in one boat only.",ar:"التسريب في قارب واحد فقط."}}],
 formulas:["weights","erp","sdp","betap"],
 examples:[{ti:{en:"Weights, return and beta",ar:"الأوزان والعائد وبيتا"},
  g:[{en:"$15,000 portfolio: IREX 2,000 (E(R) 19.65%), AIND 3,000 (8.96%), EFID 4,000 (9.67%), EKHO 6,000 (8.13%). Betas example: DCLK .133/3.69, KO .2/0.64, INTC .167/1.64, KEI .4/1.79.",ar:"محفظة 15,000$: IREX 2,000 (عائد 19.65%)، AIND 3,000 (8.96%)، EFID 4,000 (9.67%)، EKHO 6,000 (8.13%). مثال بيتا: DCLK .133/3.69، KO .2/0.64، INTC .167/1.64، KEI .4/1.79."}],
  rq:{en:"Compute weights, E(Rp) and βp.",ar:"احسب الأوزان وE(Rp) وβp."},f:"erp",
  st:[{en:"Weights: .1333 / .2 / .266 / .4",ar:"الأوزان: .1333 / .2 / .266 / .4"},
      {en:"wi·E(Ri): .02619 + .01792 + .0257 + .03252 = 0.10233 ≈ 10%",ar:"wi·E(Ri): .02619 + .01792 + .0257 + .03252 = 0.10233 ≈ 10%"},
      {en:"βp = .133(3.69) + .2(.64) + .167(1.64) + .4(1.79)",ar:"βp = .133(3.69) + .2(.64) + .167(1.64) + .4(1.79)"}],
  an:{en:"E(Rp) ≈ 10% · βp = 1.61",ar:"E(Rp) ≈ 10% · βp = 1.61"},

  {ti:{en:"Two-asset σp",ar:"σp لأصلين"},
  g:[{en:"AbuAuf & VCola: weights .5/.5, σ .2/.2, correlation ρ = +0.75.",ar:"AbuAuf وVCola: الأوزان .5/.5، وσ .2/.2، والارتباط ρ = +0.75."}],
  rq:{en:"Calculate the portfolio standard deviation.",ar:"احسب الانحراف المعياري للمحفظة."},f:"sdp",
  st:[{en:"σp = √(.5²·.2² + .5²·.2² + 2·.5·.5·.75·.2·.2) = √.035",ar:"σp = √(.5²·.2² + .5²·.2² + 2·.5·.5·.75·.2·.2) = √.035"}],
  an:{en:"σp = 0.187 (18.7%)",ar:"σp = 0.187 (18.7%)"},
  ip:{en:"Below the 20% of either single asset: imperfect correlation already shaved risk off.",ar:"أقل من 20% لأي أصل منفرد: الارتباط غير التام حلق جزءًا من المخاطر."}},
  {ti:{en:"AbuAuf & VCola — equal weights",ar:"AbuAuf وVCola — أوزان متساوية"},g:[{en:"$10,000 in each (weights .5/.5); expected return 14% each.",ar:"10,000$ في كل منهما (أوزان .5/.5)؛ والعائد المتوقع 14% لكل منهما."}],rq:{en:"Compute the portfolio expected return.",ar:"احسب العائد المتوقع للمحفظة."},f:"erp",st:[{en:".5(14%) + .5(14%) = .07 + .07",ar:".5(14%) + .5(14%) = .07 + .07"}],an:{en:"E(Rp) = 14%",ar:"E(Rp) = 14%"},ip:{en:"With identical returns the weighted average equals them.",ar:"مع تطابق العائدين يساويهما المتوسط المرجح."}},
  {ti:{en:"Total vs systematic risk — C & K",ar:"المخاطر الكلية مقابل النظامية — C وK"},g:[{en:"Security C: σ 20%, β 1.25 · Security K: σ 30%, β 0.95.",ar:"الورقة C: σ 20% وβ 1.25 · الورقة K: σ 30% وβ 0.95."}],rq:{en:"Which has more total risk? More systematic risk? Which should earn more?",ar:"أيهما أعلى مخاطرة كلية؟ وأعلى نظامية؟ وأيهما ينبغي أن تكسب أكثر؟"},f:"",st:[{en:"Total risk = σ → K (30%). Systematic risk = β → C (1.25). Higher β ⇒ higher risk premium ⇒ higher expected return for C.",ar:"المخاطر الكلية = σ ← K (30%). والمخاطر النظامية = β ← C (1.25). بيتا الأعلى ← علاوة مخاطرة أعلى ← عائد متوقع أعلى لـ C."}],an:{en:"K: more total risk · C: more systematic risk & higher expected return.",ar:"K: أعلى مخاطرة كلية · C: أعلى مخاطرة نظامية وعائد متوقع."},ip:{en:"σ and β can rank the same two assets differently — read the question carefully.",ar:"قد ترتب σ وβ الورقتين نفسيهما بشكل مختلف — اقرأ السؤال بانتباه."}}],

  rows:[[{en:"Market-wide (GDP, inflation, rates)",ar:"سوقية (ناتج محلي، تضخم، فوائد)"},{en:"Firm-specific (strikes, parts)",ar:"خاصة بالمنشأة (إضرابات، قطع)"}],

{id:"l13",ch:"c6",mins:12,title:{en:"CAPM: Pricing Risk",ar:"نموذج تسعير الأصول الرأسمالية CAPM"},
 desc:{en:"The risk premium, the CAPM equation, and the accept/reject rule comparing expected return with required return.",ar:"علاوة المخاطرة ومعادلة CAPM وقاعدة القبول/الرفض بمقارنة العائد المتوقع بالمطلوب."},
 obj:{en:["State the CAPM equation and its components","Compute the cost of equity with CAPM","Apply the accept/reject decision rule"],
      ar:["ذكر معادلة CAPM ومكوناتها","حساب تكلفة الملكية بـ CAPM","تطبيق قاعدة القرار بالقبول أو الرفض"]},
 blocks:[
  {h:{en:"From beta to required return",ar:"من بيتا إلى العائد المطلوب"},p:[
   {en:"The risk premium is expected return minus the risk-free rate; the higher the beta, the greater the premium investors demand. CAPM makes this precise: Re = Rf + β(Rm − Rf), where Rm − Rf is the market risk premium. Graphically, expected return rises linearly with beta (the security market line).",ar:"علاوة المخاطرة هي العائد المتوقع ناقص المعدل الخالي من المخاطر؛ وكلما ارتفعت بيتا عظمت العلاوة التي يطلبها المستثمرون. وCAPM يجعل هذا دقيقًا: Re = Rf + β(Rm − Rf)، حيث Rm − Rf علاوة مخاطر السوق. وبيانيًا يرتفع العائد المتوقع خطيًا مع بيتا (خط سوق الأوراق المالية)."}]},
  {co:"note",c:{en:"Decision rule — Accept when Expected Return ≥ CAPM return: the asset offers more than the required compensation for its risk (good investment). Reject when Expected Return &lt; CAPM return: not enough return to compensate investors for the risk (avoid it).",ar:"قاعدة القرار — اقبل عندما يكون العائد المتوقع ≥ عائد CAPM: الأصل يعرض أكثر من التعويض المطلوب عن مخاطره (استثمار جيد). ارفض عندما يكون العائد المتوقع &lt; عائد CAPM: لا عائد كافياً لتعويض المستثمرين عن المخاطرة (تجنبه)."}},
  {co:"simple",c:{en:"CAPM is a price tag for risk: start from the safe rate (what you earn with zero risk), then add extra return scaled by how strongly the stock moves with the market (beta).",ar:"CAPM بطاقة سعر للمخاطرة: ابدأ من المعدل الآمن (ما تكسبه بلا أي مخاطرة)، ثم أضف عائدًا إضافيًا بمقدار قوة تحرك السهم مع السوق (بيتا)."}}],
 concepts:[{n:{en:"Risk premium",ar:"علاوة المخاطرة"},d:{en:"Extra return over the risk-free rate paid for bearing risk.",ar:"عائد إضافي فوق المعدل الخالي من المخاطر يُدفع مقابل تحمل المخاطرة."},w:{en:"It is the price tag of risk in every valuation in this course.",ar:"هي سعر المخاطرة في كل تقييم في هذا المقرر."}}],
 terms:[{t:{en:"CAPM",ar:"CAPM"},d:{en:"Capital Asset Pricing Model: Re = Rf + β(Rm − Rf).",ar:"نموذج تسعير الأصول الرأسمالية: Re = Rf + β(Rm − Rf)."},s:{en:"A formula that prices risk into a required return.",ar:"معادلة تسعّر المخاطرة داخل العائد المطلوب."}},
  {t:{en:"Market risk premium",ar:"علاوة مخاطر السوق"},d:{en:"Rm − Rf: the extra return of the whole market over the risk-free rate.",ar:"Rm − Rf: العائد الإضافي للسوق كله فوق المعدل الخالي من المخاطر."},s:{en:"What the market pays you just for showing up to risk.",ar:"ما يدفعه السوق لك مجرد قبولك المخاطرة."}}],
 formulas:["capm"],
 examples:[{ti:{en:"Cost of equity & investment decisions",ar:"تكلفة الملكية وقرارات الاستثمار"},
  g:[{en:"Case 1: Rf 4%, Rm 10%, β 1.5. Case 2: Rf 3%, Rm 11%; stocks A(β .8, exp 8%), B(β 1.2, exp 14%), C(β 1.5, exp 16%). Case 3: Rf 5%, Rm 12%; X(.5, 7%), Y(1.0, 12%), Z(1.8, 18%).",ar:"حالة ١: Rf 4%، Rm 10%، β 1.5. حالة ٢: Rf 3%، Rm 11%؛ الأسهم A(β .8، متوقع 8%)، B(β 1.2، متوقع 14%)، C(β 1.5، متوقع 16%). حالة ٣: Rf 5%، Rm 12%؛ X(.5، 7%)، Y(1.0، 12%)، Z(1.8، 18%)."}],
  rq:{en:"Compute the CAPM returns and decide accept/reject.",ar:"احسب عوائد CAPM وقرر القبول أو الرفض."},f:"capm",
  st:[{en:"Case 1: Re = 4% + 1.5(10% − 4%) = 4% + 9% = 13%",ar:"حالة ١: Re = 4% + 1.5(10% − 4%) = 4% + 9% = 13%"},
      {en:"Case 2 premium = 8%: A 9.4% vs 8% → No · B 12.6% vs 14% → Yes · C 15% vs 16% → Yes",ar:"حالة ٢ العلاوة = 8%: A 9.4% مقابل 8% ← لا · B 12.6% مقابل 14% ← نعم · C 15% مقابل 16% ← نعم"},
      {en:"Case 3 premium = 7%: X 8.5% vs 7% → No · Y 12% vs 12% → Yes · Z 17.6% vs 18% → Yes",ar:"حالة ٣ العلاوة = 7%: X 8.5% مقابل 7% ← لا · Y 12% مقابل 12% ← نعم · Z 17.6% مقابل 18% ← نعم"}],
  an:{en:"Case 1: 13%. Cases 2–3 decisions: No/Yes/Yes and No/Yes/Yes.",ar:"حالة ١: 13%. قرارات الحالتين ٢ و٣: لا/نعم/نعم ولا/نعم/نعم."},
  ip:{en:"A stock is worth buying only when its own expected return clears the bar CAPM sets for its beta.",ar:"السهم يستحق الشراء فقط إذا تجاوز عائده المتوقع العارضة التي تضعها CAPM لبيتا الخاصة به."}}],

{id:"l14",ch:"c7",mins:15,title:{en:"Time Value of Money",ar:"القيمة الزمنية للنقد"},
 desc:{en:"Simple and compound interest, future and present value, and ordinary annuities — the engine under every valuation.",ar:"الفائدة البسيطة والمركبة، القيمة المستقبلية والحالية، والدفعات السنوية العادية — المحرك تحت كل تقييم."},
 obj:{en:["Compute FV and PV with simple interest","Compute FV and PV with compound interest","Compute FV and PV of an ordinary annuity"],
      ar:["حساب القيمة المستقبلية والحالية بالفائدة البسيطة","حسابهما بالفائدة المركبة","حساب القيمة المستقبلية والحالية لدفعات سنوية عادية"]},
 blocks:[
  {h:{en:"Simple interest",ar:"الفائدة البسيطة"},p:[
   {en:"Interest earns on the original principal only: FV = PV × (1 + r·n) and PV = FV ÷ (1 + r·n).",ar:"الفائدة تكسب على أصل المبلغ فقط: FV = PV × (1 + r·n) وPV = FV ÷ (1 + r·n)."}]},
  {h:{en:"Compound interest",ar:"الفائدة المركبة"},p:[
   {en:"Interest earns on interest: FV = PV × (1 + r)^n and PV = FV ÷ (1 + r)^n. This is the default logic of finance.",ar:"الفائدة تكسب على الفائدة: FV = PV × (1 + r)^n وPV = FV ÷ (1 + r)^n. وهذا هو المنطق الافتراضي للتمويل."}]},
  {h:{en:"Annuities",ar:"الدفعات السنوية"},p:[
   {en:"A fixed payment PMT at the end of each year for n years: FV = PMT × [((1 + r)^n − 1) ÷ r] and PV = PMT × [(1 − (1 + r)^−n) ÷ r].",ar:"دفعة ثابتة PMT في نهاية كل سنة لعدد n من السنين: FV = PMT × [((1 + r)^n − 1) ÷ r] وPV = PMT × [(1 − (1 + r)^−n) ÷ r]."}]},
  {co:"simple",c:{en:"Money breeds. Simple interest pays you only on the seed; compound interest pays you on the seed and on every harvest before it. An annuity is just a row of identical seeds planted one year apart.",ar:"النقد يتكاثر. الفائدة البسيطة تدفع لك على البذرة فقط؛ والمركبة تدفع لك على البذرة وكل حصاد قبلها. والدفعات السنوية مجرد صف بذور متطابقة تُزرع بفارق سنة بين كل وأخرى."}}],
 concepts:[{n:{en:"Discounting",ar:"الخصم"},d:{en:"Moving a future amount back to today by dividing by (1 + r)^n.",ar:"نقل مبلغ مستقبلي إلى اليوم بالقسمة على (1 + r)^n."},w:{en:"Every valuation model in the course — stocks, bonds, projects — is discounting in disguise.",ar:"كل نماذج التقييم في المقرر — أسهم وسندات ومشروعات — خصمٌ في هيئة مختلفة."}}],
 terms:[{t:{en:"Present value (PV)",ar:"القيمة الحالية"},d:{en:"Today's worth of a future amount at rate r.",ar:"قيمة مبلغ مستقبلي اليوم بمعدل r."},s:{en:"What tomorrow's money buys if you had it now.",ar:"ما تشتريه أموال الغد لو كانت بين يديك الآن."}},
  {t:{en:"Annuity",ar:"الدفعة السنوية"},d:{en:"A series of equal end-of-year payments for n years.",ar:"سلسلة دفعات متساوية في نهاية كل سنة لعدد n من السنين."},s:{en:"The same paycheck, every year, on schedule.",ar:"الراتب نفسه، كل سنة، في موعده."}}],
 formulas:["fv_simple","pv_simple","fv_comp","pv_comp","fv_ann","pv_ann"],
 examples:[{ti:{en:"Drill tables from the slides",ar:"جداول التدريب من الشرائح"},

  rq:{en:"Compute each value.",ar:"احسب كل قيمة."},f:"fv_comp",
  st:[{en:"Simple FV: 11,500 / 32,000 / 5,450 · Simple PV: 10,434.78 / 16,129.03 / 6,779.66",ar:"بسيط FV: 11,500 / 32,000 / 5,450 · بسيط PV: 10,434.78 / 16,129.03 / 6,779.66"},
      {en:"Compound FV: 11,576.25 / 22,039.92 / 89,542.4 · Compound PV: 12,340 / 25,188 / 4,631.93",ar:"مركب FV: 11,576.25 / 22,039.92 / 89,542.4 · مركب PV: 12,340 / 25,188 / 4,631.93"},

  rows:[[{en:"Interest on principal only",ar:"فائدة على الأصل فقط"},{en:"Interest on principal + accumulated interest",ar:"فائدة على الأصل + الفائدة المتراكمة"}],

{id:"l15",ch:"c7",mins:18,title:{en:"Bond Valuation",ar:"تقييم السندات"},
 desc:{en:"Bond vocabulary, current yield and accrued interest, floating-rate loans, and the bond valuation model with its premium/discount logic.",ar:"مصطلحات السندات، والعائد الجاري والفائدة المستحقة، والقروض عائمة السعر، ونموذج تقييم السندات بمنطق العلاوة والخصم."},
 obj:{en:["Define bond terms: indenture, par, maturity, coupon, call, conversion","Compute current yield and accrued interest","Value a bond as PV of coupons plus PV of par","Explain discount, par and premium pricing and the accept/reject rule"],
      ar:["تعريف مصطلحات السند: العقد والقيمة الاسمية والاستحقاق والكوبون والاستدعاء والتحويل","حساب العائد الجاري والفائدة المستحقة","تقييم السند كقيمة حالية للكوبونات زائد القيمة الحالية للاسمي","تفسير التسعير بخصم أو اسمي أو علاوة وقاعدة القبول/الرفض"]},
 blocks:[
  {h:{en:"Loans vs bonds",ar:"القروض مقابل السندات"},p:[
   {en:"Loans are private debts between two parties (advantages: speed, reduced costs, financing flexibility; disadvantages: interest costs higher than bonds, restrictive covenants that may affect dividend policy, and possible future SEC registration). Bonds are public debt traded in bond markets: corporate bonds carry promised future payments and a maturity date; the indenture is the legal agreement with the trustee; bondholders' claims rank before common stockholders.",ar:"القروض ديون خاصة بين طرفين (مزايا: السرعة وتكلفة أقل ومرونة التمويل؛ وعيوب: تكلفة فوائد أعلى من السندات، وشروط مقيدة قد تؤثر على سياسة التوزيعات، واحتمال تسجيل مستقبلي لدى هيئة الأوراق المالية SEC). السندات دين عام يُتداول في أسواق السندات: سندات الشركات تحمل مدفوعات مستقبلية موعودة وتاريخ استحقاق؛ وعقد السند هو الاتفاق القانوني مع الأمين؛ ومطالب حملة السندات أسبق من مطالب المساهمين العاديين."}]},
  {h:{en:"Yield vocabulary",ar:"مصطلحات العائد"},p:[
   {en:"Coupon rate = % of par paid each year. Current yield = annual interest payment ÷ current market price. Accrued interest = (months since last payment ÷ 12) × annual coupon. Call provision lets the issuer redeem early; conversion feature turns the bond into shares.",ar:"معدل الكوبون = % من القيمة الاسمية تُدفع سنويًا. العائد الجاري = مدفوعات الفوائد السنوية ÷ سعر السوق الحالي. الفائدة المستحقة = (الشهور منذ آخر دفعة ÷ 12) × الكوبون السنوي. شرط الاستدعاء يتيح للمصدر السداد المبكر؛ وخاصية التحويل تحول السند إلى أسهم."}]},
  {h:{en:"Floating-rate loans",ar:"القروض عائمة السعر"},p:[
   {en:"Rate of period t = index of period (t−1) + spread, subject to a cap and a floor. In the Slinger Metal example the spread is 0.25% over weekly LIBOR with a 2.5% cap and 1.75% floor.",ar:"معدل الفترة ت = مؤشر الفترة (ت−1) + الهامش، خاضعًا لسقف وأرضية. في مثال سلينجر ميتال الهامش 0.25% فوق LIBOR أسبوعيًا مع سقف 2.5% وأرضية 1.75%."}]},
  {h:{en:"The bond valuation model",ar:"نموذج تقييم السندات"},p:[
   {en:"Bond value = PV of the interest payments (an annuity) + PV of the principal (par): B0 = C × [(1 − (1 + r)^−n) ÷ r] + Par ÷ (1 + r)^n, where r is the market's required yield.",ar:"قيمة السند = القيمة الحالية لمدفوعات الفوائد (دفعة سنوية) + القيمة الحالية للأصل (الاسمي): B0 = C × [(1 − (1 + r)^−n) ÷ r] + الاسمي ÷ (1 + r)^n، حيث r العائد المطلوب سوقيًا."},
   {en:"When required yield equals the coupon rate the bond sells at par; above it, at a discount; below it, at a premium.",ar:"حين يساوي العائد المطلوب معدل الكوبون يُباع السند بالاسمي؛ وفوقه بخصم؛ وتحته بعلاوة."}]},
  {co:"note",c:{en:"Decision rule: if the discounted cash-flow value exceeds the market price the bond is undervalued — accept/buy. If DCF &lt; market price it is overvalued — reject.",ar:"قاعدة القرار: إذا تجاوزت القيمة المخصومة للتدفقات سعر السوق فالسند مقوّم بأقل من قيمته — اقبل/اشترِ. وإن قلت القيمة عن السعر فهو مقوّم بأعلى من قيمته — ارفض."}},
  {co:"simple",c:{en:"A bond is just two things glued together: a stream of coupon payments (an ordinary annuity) and one big par repayment at maturity. Discount both at the required yield and add them.",ar:"السند شيئان ملصوقان معًا: سلسلة مدفوعات كوبون (دفعة سنوية عادية) وسداد اسمي كبير عند الاستحقاق. خصم الاثنين بالعائد المطلوب واجمعهما."}}],
 concepts:[{n:{en:"Bond = annuity + lump sum",ar:"السند = دفعة سنوية + مبلغ مقطوع"},d:{en:"A bond is exactly a coupon annuity plus a single par repayment at maturity, both discounted at the required yield.",ar:"السند بالضبط دفعة كوبونات سنوية زائد سداد اسمي مقطوع عند الاستحقاق، كلاهما مخصومًا بالعائد المطلوب."},w:{en:"Recognizing this lets you value any bond with the two TVM formulas you already own.",ar:"إدراك هذا يتيح لك تقييم أي سند بمعادلتي القيمة الزمنية اللتين تملكهما بالفعل."}}],
 terms:[{t:{en:"Bond indenture",ar:"عقد السند"},d:{en:"The legal agreement between the issuing firm and the bond trustee representing holders.",ar:"الاتفاق القانوني بين المنشأة المصدرة وأمين السند ممثلًا لحملة السندات."},s:{en:"The rulebook of the loan.",ar:"كتاب قواعد القرض."}},
  {t:{en:"Coupon interest rate",ar:"معدل كوبون الفائدة"},d:{en:"Percentage of par value paid to the holder each year.",ar:"نسبة من القيمة الاسمية تُدفع للحامل كل سنة."},s:{en:"The yearly interest tag on the bond.",ar:"بطاقة الفائدة السنوية على السند."}},
  {t:{en:"Current yield",ar:"العائد الجاري"},d:{en:"Annual interest ÷ current market price.",ar:"الفوائد السنوية ÷ سعر السوق الحالي."},s:{en:"What today's buyer earns from coupons alone.",ar:"ما يكسبه مشتري اليوم من الكوبونات وحدها."}},

{id:"l16",ch:"c8",mins:14,title:{en:"Capital Budgeting Techniques",ar:"أساليب الموازنة الرأسمالية"},
 desc:{en:"Why capital budgeting matters, the techniques map, payback period (constant & variable inflows) and average rate of return.",ar:"لماذا تهم الموازنة الرأسمالية، وخريطة الأساليب، وفترة الاسترداد (تدفقات ثابتة ومتغيرة) ومعدل العائد المتوسط."},
 obj:{en:["Explain the importance and uses of capital budgeting","Classify techniques into discounted and non-discounted","Compute payback period for constant and variable cash inflows","Compute the average rate of return"],
      ar:["شرح أهمية الموازنة الرأسمالية واستخداماتها","تصنيف الأساليب إلى مخصومة وغير مخصومة","حساب فترة الاسترداد لتدفقات ثابتة ومتغيرة","حساب معدل العائد المتوسط"]},
 blocks:[
  {h:{en:"Why it matters",ar:"لماذا تهم"},p:[
   {en:"Capital budgeting analyzes potential investments in fixed assets. It matters because of growth, large amounts, irreversibility, complexity, risk and long-term implications. Uses: new product or service, replacement, expansion, R&D projects, long-term contracts, safety/environmental projects.",ar:"تحلل الموازنة الرأسمالية الاستثمارات المحتملة في الأصول الثابتة. وتهم بسبب النمو والمبالغ الكبيرة وصعوبة التراجع والتعقيد والمخاطرة والآثار طويلة الأجل. استخداماتها: منتج أو خدمة جديدة، إحلال، توسع، مشروعات بحث وتطوير، عقود طويلة الأجل، مشروعات سلامة/بيئة."}]},
  {h:{en:"The techniques map",ar:"خريطة الأساليب"},p:[
   {en:"Non-discounted techniques: payback period and average rate of return (ARR). Discounted techniques: discounted payback, NPV, IRR and profitability index.",ar:"الأساليب غير المخصومة: فترة الاسترداد ومعدل العائد المتوسط (ARR). والمخصومة: الاسترداد المخصوم وصافي القيمة الحالية IRR ومؤشر الربحية."}]},
  {h:{en:"Payback period (PBP)",ar:"فترة الاسترداد (PBP)"},p:[
   {en:"The number of years required to recover the original cost invested. Constant inflow: PBP = initial investment ÷ annual fixed cash inflow. Variable inflow: PBP = completed years + remaining outflow ÷ cash inflow of year t.",ar:"عدد السنين اللازمة لاسترداد التكلفة الأصلية المستثمرة. تدفق ثابت: PBP = الاستثمار الأولي ÷ التدفق النقدي الثابت السنوي. تدفق متغير: PBP = السنين المكتملة + المتبقي من التدفق الخارج ÷ التدفق الداخل في السنة ت."}]},
  {h:{en:"Average rate of return (ARR)",ar:"معدل العائد المتوسط (ARR)"},p:[
   {en:"ARR determines the average annual earning of a project: average profit after tax ÷ average investment, or ÷ initial investment.",ar:"يحدد ARR متوسط الكسب السنوي للمشروع: متوسط الربح بعد الضريبة ÷ متوسط الاستثمار، أو ÷ الاستثمار الأولي."}]},
  {co:"simple",c:{en:"Payback asks one blunt question: how long until the machine pays for itself? Shorter is better — but remember the method is blind to everything after the payback year and to the time value of money (that is what the discounted family fixes).",ar:"الاسترداد يسأل سؤالًا فجًا: كم من الوقت حتى تسدد الآلة ثمن نفسها؟ الأقصر أفضل — لكن تذكر أن الطريقة عمياء عما بعد سنة الاسترداد وعن القيمة الزمنية للنقد (وهذا ما تصلحه عائلة المخصوم)."}}],
 concepts:[{n:{en:"Recovery of the outlay",ar:"استرداد الإنفاق"},d:{en:"Payback measures speed of recovering the initial investment, not profitability.",ar:"الاسترداد يقيس سرعة استرجاع الاستثمار الأولي لا الربحية."},w:{en:"Fast recovery lowers exposure — useful screen, never the final judge.",ar:"الاسترجاع السريع يخفض التعرض للمخاطر — غربال مفيد لكنه ليس الحكم الأخير."}}],
 terms:[{t:{en:"Payback period",ar:"فترة الاسترداد"},d:{en:"Years required to recover the original invested cost.",ar:"السنون اللازمة لاسترداد التكلفة المستثمرة الأصلية."},s:{en:"When does the project give my money back?",ar:"متى يعيد المشروع أموالي؟"}},
  {t:{en:"Average rate of return (ARR)",ar:"معدل العائد المتوسط"},d:{en:"Average profit after tax over average (or initial) investment.",ar:"متوسط الربح بعد الضريبة على متوسط الاستثمار (أو الأولي)."},s:{en:"Accounting profit per dollar invested, averaged.",ar:"الربح المحاسبي لكل دولار مستثمر، بالمتوسط."}}],

      {en:"B cumulative: 20/40/50/56/62 → 4 + 4/6 = 4.66 yr",ar:"ب تراكمي: 20/40/50/56/62 ← 4 + 4÷6 = 4.66 سنة"},
      {en:"C cumulative: 12/24/36/42/46 → 4 + 3/4 = 4.75 yr",ar:"ج تراكمي: 12/24/36/42/46 ← 4 + 3÷4 = 4.75 سنة"}],

  rows:[[{en:"Ignore the time value of money",ar:"تتجاهل القيمة الزمنية للنقد"},{en:"Discount cash flows at the required return",ar:"تخصم التدفقات بالعائد المطلوب"}],
        [{en:"Simple screens",ar:"غربلة بسيطة"},{en:"Value-based decisions",ar:"قرارات مبنية على القيمة"}]],

{id:"l17",ch:"c9",mins:12,title:{en:"MNCs & the Global Financial Environment",ar:"الشركات متعددة الجنسيات والبيئة المالية العالمية"},
 desc:{en:"Multinational corporations: definition, structures, motives and risks — plus exchange-rate regimes and quotations.",ar:"الشركات متعددة الجنسيات: التعريف والبنى والدوافع والمخاطر — إضافة لأنظمة أسعار الصرف وطرق الاقتباس."},
 obj:{en:["Define an MNC and describe its typical structure","Classify MNCs by production/marketing and by motive","List the difficulties facing MNCs","Explain exchange-rate regimes and direct vs indirect quotations"],
      ar:["تعريف الشركة متعددة الجنسيات ووصف بنيتها النموذجية","تصنيف الشركات متعددة الجنسيات حسب الإنتاج/التسويق وحسب الدافع","ذكر الصعوبات التي تواجه الشركات متعددة الجنسيات","شرح أنظمة أسعار الصرف والاقتباس المباشر مقابل غير المباشر"]},
 blocks:[
  {h:{en:"What is an MNC?",ar:"ما هي الشركة متعددة الجنسيات؟"},p:[
   {en:"An MNC is a corporation engaged in producing and selling goods and services in more than one country. It ordinarily consists of a parent company in the home country and at least five or six foreign subsidiaries, with a high degree of strategic interaction among the units. Companies are classified as international, multinational or transnational corporations.",ar:"الشركة متعددة الجنسيات منشأة تنتج وتبيع السلع والخدمات في أكثر من دولة. وتتكون عادة من شركة أم في بلد الأصل وخمس أو ست شركات تابعة أجنبية على الأقل، بدرجة عالية من التفاعل الاستراتيجي بين الوحدات. وتُصنف الشركات إلى دولية ومتعددة الجنسيات وعابرة للجنسيات."}]},
  {h:{en:"Formation and motives",ar:"التكوين والدوافع"},p:[
   {en:"MNCs form through foreign direct investment: buying an entire company, or partial ownership of 10% or more of its stocks. By motive: raw-material seekers (BP, Exxon Mobil, Total), market seekers (new markets measured per capita), and cost minimizers (seeking cost-competitive countries, e.g. Microsoft).",ar:"تتكون الشركات متعددة الجنسيات عبر الاستثمار الأجنبي المباشر: شراء شركة كاملة، أو ملكية جزئية 10% فأكثر من أسهمها. وحسب الدافع: باحثون عن المواد الخام (بريتيش بتروليوم وإكسون موبيل وتوتال)، وباحثون عن الأسواق (أسواق جديدة تقاس بنصيب الفرد)، ومقللو تكلفة (باحثون عن دول تنافسية التكلفة مثل مايكروسوفت)."}]},
  {h:{en:"Goal and difficulties",ar:"الهدف والصعوبات"},p:[
   {en:"The MNC's objective is to maximize shareholder wealth as measured by share price and coupon — management must effectively manage the assets under its control. Difficulties: exchange-rate risks, inflation risks, differences in tax rates, multiple financial markets, and political risks.",ar:"هدف الشركة متعددة الجنسيات تعظيم ثروة المساهمين مقيسة بسعر السهم والكوبون — على الإدارة إدارة الأصول تحت سيطرتها بفعالية. الصعوبات: مخاطر سعر الصرف، ومخاطر التضخم، واختلاف معدلات الضرائب، وتعدد الأسواق المالية، والمخاطر السياسية."},{en:"Behaviorally, an MNC's marketing seeks global market segments to penetrate while its financial management raises capital in the international capital markets — integrating manufacturing, marketing, R&D and financing on a global basis. Its managers act as global managers (adjusting to change and volatility at an ever-faster rate) and as a politician & labor-union face, since investing abroad deprives the home country of jobs and exports while creating them abroad. Maximizing shareholder wealth also defends against hostile takeovers, eases attracting equity capital for expansion, and leaves more to distribute to all stakeholders.",ar:"سلوكيًا، يسعى تسويق الشركة متعددة الجنسيات إلى شرائح سوق عالمية يخترقها، بينما تجمع إدارتها المالية رأس المال من أسواق المال الدولية — دامجةً التصنيع والتسويق والبحث والتطوير والتمويل على أساس عالمي. ويعمل مديروها كمديرين عالميين (يتكيفون مع التغير والتقلب بوتيرة متسارعة) وكوجه سياسي ونقابي، لأن الاستثمار في الخارج يحرم البلد الأم من وظائف وصادرات ويخلقها في الخارج. وتعظيم ثروة المساهمين يحمي أيضًا من الاستحواذ المعادي، ويسهل جذب رأس مال ملكي للتوسع، ويترك المزيد لتوزيعه على كل أصحاب المصلحة."}]},
  {h:{en:"The foreign-exchange market",ar:"سوق الصرف الأجنبي"},p:[
   {en:"Participants: bank and non-bank dealers, individuals and firms conducting commercial and investment transactions, speculators and arbitragers, central banks and treasuries, and brokers. The international monetary system is the agreed framework of rules and institutions that makes exchange rates possible: the price of one currency in terms of another (on Jan 22, 2020: $1 = EGP 15.80 = 0.90 euros = 2.82 Tunisian dinars).",ar:"المشاركون: متعاملون بنكيون وغير بنكيين، وأفراد وشركات ينفذون معاملات تجارية واستثمارية، ومضاربون ومحققو فرص ربح (أربيتراج)، وبنوك مركزية وخزانات، ووسطاء. والنظام النقدي الدولي هو الإطار المتفق عليه من قواعد ومؤسسات يجعل أسعار الصرف ممكنة: سعر عملة بدلالة أخرى (في 22 يناير 2020: 1$ = 15.80 جنيهًا مصريًا = 0.90 يورو = 2.82 دينارًا تونسيًا)."}]},
  {h:{en:"Exchange-rate regimes & quotations",ar:"أنظمة سعر الصرف وطرق الاقتباس"},p:[
   {en:"Four groups: hard pegs (gave up monetary sovereignty or use a currency board), soft pegs (fixed rates), floating arrangements (market-driven: freely floating with occasional intervention, or managed floating with secret targets), and residual. Quotations: direct = home-currency price of one unit of foreign currency; indirect = foreign-currency price of one unit of home currency. European terms are indirect quotations to Americans; American terms are direct.",ar:"أربع مجموعات: ربط صارم (تخلٍ عن السيادة النقدية أو مجلس نقد)، وربط مرن (أسعار ثابتة)، وترتيبات تعويم (يقودها السوق: تعويم حر بتدخل عرضي، أو تعويم مُدار بأهداف سرية)، ومتبقية. الاقتباس: مباشر = سعر العملة المحلية لوحدة واحدة من العملة الأجنبية؛ غير مباشر = سعر العملة الأجنبية لوحدة من العملة المحلية. والشروط الأوروبية اقتباس غير مباشر للأمريكيين؛ والشروط الأمريكية مباشر."}]},
  {co:"simple",c:{en:"An MNC is one head with many bodies: a parent company at home and subsidiaries abroad — so its cash flows speak several currencies and feel several governments, taxes and politics.",ar:"الشركة متعددة الجنسيات رأس واحد بأجساد كثيرة: شركة أم في الوطن وتابعات في الخارج — لذا تتحدث تدفقاتها عملات عدة وتشعر بحكومات وضرائب وسياسات عدة."}}],
 concepts:[{n:{en:"Exchange rate as a price",ar:"سعر الصرف كسعر"},d:{en:"An exchange rate identifies the price of one country's currency in terms of another's.",ar:"سعر الصرف يحدد سعر عملة دولة بدلالة عملة دولة أخرى."},w:{en:"It is the PV-style 'conversion rate' that makes cross-border valuation possible.",ar:"هو «معدل التحويل» الذي يجعل التقييم عابر الحدود ممكنًا."}}],
 terms:[{t:{en:"MNC",ar:"شركة متعددة الجنسيات"},d:{en:"A corporation producing and selling in more than one country; parent + typically 5–6 subsidiaries.",ar:"منشأة تنتج وتبيع في أكثر من دولة؛ أم + عادة ٥–٦ تابعات."},s:{en:"One head, many national bodies.",ar:"رأس واحد وأجساد وطنية كثيرة."}},
  {t:{en:"Foreign direct investment (FDI)",ar:"الاستثمار الأجنبي المباشر"},d:{en:"Buying an entire foreign company or ≥10% of its stocks.",ar:"شراء شركة أجنبية كاملة أو 10% فأكثر من أسهمها."},s:{en:"Owning, not just lending, abroad.",ar:"تملك في الخارج لا إقراض فقط."}},
  {t:{en:"Direct quotation",ar:"الاقتباس المباشر"},d:{en:"Home-currency price of one unit of foreign currency.",ar:"سعر العملة المحلية لوحدة من العملة الأجنبية."},s:{en:"How many of my coins for one of theirs?",ar:"كم من عملاتي مقابل واحدة من عملاتهم؟"}},
  {t:{en:"Managed floating",ar:"التعويم المُدار"},d:{en:"Significant government intervention manages the rate by manipulating currency supply and demand; targets kept secret.",ar:"تدخل حكومي كبير يدير السعر بالتلاعب في عرض العملة وطلبها؛ والأهداف تُبقى سرية."},s:{en:"The market steers, but the state holds a hidden hand on the wheel.",ar:"السوق يقود، لكن للدولة يدًا خفية على المقود."}}],

{id:"roa",ch:"c4",name:{en:"Return on assets (ROA)",ar:"العائد على الأصول"},disp:'ROA = <span class="fr"><span class="top">Net income</span><span class="bot">Average total assets</span></span>',vars:[],when:{en:"Return earned on the asset base.",ar:"للعائد المكتسب على قاعدة الأصول."},tells:{en:"Net income per dollar invested in assets.",ar:"صافي الدخل لكل دولار مستثمر في الأصول."},ex:"l8"},
{id:"roe",ch:"c4",name:{en:"Return on equity (ROE)",ar:"العائد على الحقوق"},disp:'ROE = <span class="fr"><span class="top">Net income</span><span class="bot">Average equity</span></span>',vars:[],when:{en:"Return to the owners' capital.",ar:"للعائد على رأس مال الملاك."},tells:{en:"Net income per equity dollar.",ar:"صافي الدخل لكل دولار حقوق."},ex:"l8"},
{id:"pe",ch:"c4",name:{en:"Price-earnings ratio",ar:"نسبة السعر إلى الربح"},disp:'P/E = <span class="fr"><span class="top">Market price per share</span><span class="bot">EPS</span></span>',vars:[],when:{en:"Market valuation of earnings.",ar:"لتقييم السوق للأرباح."},tells:{en:"What investors pay per dollar of earnings.",ar:"ما يدفعه المستثمرون لكل دولار أرباح."},ex:"l8"},
{id:"er_stock",ch:"c5",name:{en:"Expected stock return",ar:"العائد المتوقع للسهم"},disp:'E(r) = <span class="fr"><span class="top">D</span><span class="bot">P</span></span> + g',vars:[{s:"D",en:"Dividend",ar:"التوزيع"},{s:"P",en:"Price",ar:"السعر"},{s:"g",en:"Growth",ar:"النمو"}],when:{en:"Decomposing a stock's expected return.",ar:"لتفكيك العائد المتوقع للسهم."},tells:{en:"Dividend yield plus growth.",ar:"عائد التوزيع زائد النمو."},ex:"l10"},
{id:"zgm",ch:"c5",name:{en:"Zero-growth model",ar:"نموذج صفر النمو"},disp:'P<sub>0</sub> = <span class="fr"><span class="top">D<sub>1</sub></span><span class="bot">r<sub>s</sub></span></span>',vars:[{s:"r<sub>s</sub>",en:"Required return",ar:"العائد المطلوب"}],when:{en:"Constant dividend forever (preferred-like).",ar:"لتوزيع ثابت للأبد (شبيه بالممتاز)."},tells:{en:"Value of a frozen dividend stream.",ar:"قيمة سلسلة توزيعات مجمدة."},ex:"l10"},
{id:"cgm",ch:"c5",name:{en:"Constant-growth model (Gordon) ★",ar:"نموذج النمو الثابت (غوردون) ★"},disp:'P<sub>0</sub> = <span class="fr"><span class="top">D<sub>1</sub></span><span class="bot">r<sub>s</sub> − g</span></span>,  D<sub>1</sub> = D<sub>0</sub>(1+g)',vars:[],when:{en:"Mature firm with steady dividend growth; needs rs &gt; g.",ar:"لنشأة ناضجة بنمو توزيعات مطرد؛ يشترط rs &gt; g."},tells:{en:"Present value of a growing perpetuity of dividends.",ar:"القيمة الحالية لدخل دائم متنامٍ من التوزيعات."},ex:"l10"},
{id:"er_ind",ch:"c6",name:{en:"Expected return (individual asset)",ar:"العائد المتوقع (أصل منفرد)"},disp:'E(R) = Σ P<sub>i</sub> × R<sub>i</sub>',vars:[{s:"P<sub>i</sub>",en:"Probability of state i",ar:"احتمال الحالة i"},{s:"R<sub>i</sub>",en:"Return in state i",ar:"العائد في الحالة i"}],when:{en:"Returns differ across states of nature.",ar:"عند اختلاف العوائد عبر حالات الطبيعة."},tells:{en:"Probability-weighted average outcome.",ar:"متوسط النتائج المرجح بالاحتمالات."},ex:"l11"},
{id:"var_sd",ch:"c6",name:{en:"Variance & standard deviation",ar:"التباين والانحراف المعياري"},disp:'σ² = Σ P<sub>i</sub>(R<sub>i</sub> − E(R))² ,  σ = √σ²',vars:[],when:{en:"Measuring total risk of one asset.",ar:"لقياس المخاطر الكلية لأصل واحد."},tells:{en:"Dispersion of outcomes = total risk.",ar:"تشتت النتائج = المخاطر الكلية."},ex:"l11"},
{id:"weights",ch:"c6",name:{en:"Portfolio weights",ar:"أوزان المحفظة"},disp:'w<sub>i</sub> = <span class="fr"><span class="top">Amount in asset i</span><span class="bot">Total portfolio</span></span>,  Σw = 1',vars:[],when:{en:"Before any portfolio computation.",ar:"قبل أي حساب للمحفظة."},tells:{en:"Each asset's share of your money.",ar:"حصة كل أصل من أموالك."},ex:"l12"},
{id:"erp",ch:"c6",name:{en:"Portfolio expected return",ar:"العائد المتوقع للمحفظة"},disp:'E(R<sub>p</sub>) = Σ w<sub>i</sub> × E(R<sub>i</sub>)',vars:[],when:{en:"Return of a group of assets.",ar:"لعائد مجموعة أصول."},tells:{en:"Weighted average of individual returns.",ar:"متوسط مرجح للعوائد الفردية."},ex:"l12"},
{id:"sdp",ch:"c6",name:{en:"Two-asset portfolio σ ★",ar:"σ لمحفظة أصلين ★"},disp:'σ<sub>p</sub> = √(w<sub>1</sub>²σ<sub>1</sub>² + w<sub>2</sub>²σ<sub>2</sub>² + 2w<sub>1</sub>w<sub>2</sub>ρ<sub>1,2</sub>σ<sub>1</sub>σ<sub>2</sub>)',vars:[{s:"ρ",en:"Correlation coefficient",ar:"معامل الارتباط"}],when:{en:"Risk of a two-asset portfolio.",ar:"لمخاطر محفظة من أصلين."},tells:{en:"How correlation shrinks combined risk.",ar:"كيف يقلص الارتباط المخاطر المجمعة."},ex:"l12"},
{id:"betap",ch:"c6",name:{en:"Portfolio beta",ar:"بيتا المحفظة"},disp:'β<sub>p</sub> = Σ w<sub>i</sub> × β<sub>i</sub>',vars:[],when:{en:"Systematic risk of a portfolio.",ar:"للمخاطر النظامية لمحفظة."},tells:{en:"Market sensitivity of the bundle.",ar:"حساسية الحزمة للسوق."},ex:"l12"},
{id:"capm",ch:"c6",name:{en:"CAPM ★",ar:"CAPM ★"},disp:'R<sub>e</sub> = R<sub>f</sub> + β (R<sub>m</sub> − R<sub>f</sub>)',vars:[{s:"R<sub>f</sub>",en:"Risk-free rate",ar:"المعدل الخالي من المخاطر"},{s:"R<sub>m</sub>",en:"Expected market return",ar:"العائد المتوقع للسوق"}],when:{en:"Required return / cost of equity from beta.",ar:"للعائد المطلوب/تكلفة الملكية من بيتا."},tells:{en:"The price of systematic risk.",ar:"سعر المخاطرة النظامية."},ex:"l13"},
{id:"fv_simple",ch:"c7",name:{en:"Future value — simple interest",ar:"القيمة المستقبلية — فائدة بسيطة"},disp:'FV = PV × (1 + r·n)',vars:[],when:{en:"Interest on principal only.",ar:"عندما تكون الفائدة على الأصل فقط."},tells:{en:"Value after n years without compounding.",ar:"القيمة بعد n سنين دون تركيب."},ex:"l14"},
{id:"pv_simple",ch:"c7",name:{en:"Present value — simple interest",ar:"القيمة الحالية — فائدة بسيطة"},disp:'PV = <span class="fr"><span class="top">FV</span><span class="bot">1 + r·n</span></span>',vars:[],when:{en:"Discounting under simple interest.",ar:"للخصم بفائدة بسيطة."},tells:{en:"Today's worth of a simple-interest future amount.",ar:"قيمة اليوم لمبلغ مستقبلي بفائدة بسيطة."},ex:"l14"},
{id:"fv_comp",ch:"c7",name:{en:"Future value — compound",ar:"القيمة المستقبلية — مركبة"},disp:'FV = PV × (1 + r)<sup>n</sup>',vars:[],when:{en:"Interest earns interest.",ar:"عندما تكسب الفائدة فائدة."},tells:{en:"Growth of money under compounding.",ar:"نمو المال تحت التركيب."},ex:"l14"},
{id:"pv_comp",ch:"c7",name:{en:"Present value — compound",ar:"القيمة الحالية — مركبة"},disp:'PV = <span class="fr"><span class="top">FV</span><span class="bot">(1 + r)<sup>n</sup></span></span>',vars:[],when:{en:"Core discounting operation.",ar:"عملية الخصم الأساسية."},tells:{en:"What a future sum is worth today.",ar:"قيمة مبلغ مستقبلي اليوم."},ex:"l14"},
{id:"fv_ann",ch:"c7",name:{en:"FV of ordinary annuity",ar:"القيمة المستقبلية لدفعات عادية"},disp:'FV = PMT × <span class="fr"><span class="top">(1 + r)<sup>n</sup> − 1</span><span class="bot">r</span></span>',vars:[{s:"PMT",en:"End-of-year payment",ar:"دفعة نهاية السنة"}],when:{en:"Saving equal amounts each year.",ar:"عند ادخار مبالغ متساوية سنويًا."},tells:{en:"Accumulated value of the payment stream.",ar:"القيمة المتراكمة لسلسلة الدفعات."},ex:"l14"},
{id:"pv_ann",ch:"c7",name:{en:"PV of ordinary annuity",ar:"القيمة الحالية لدفعات عادية"},disp:'PV = PMT × <span class="fr"><span class="top">1 − (1 + r)<sup>−n</sup></span><span class="bot">r</span></span>',vars:[],when:{en:"Valuing equal future payments today.",ar:"لتقييم دفعات مستقبلية متساوية اليوم."},tells:{en:"Today's worth of the payment stream.",ar:"قيمة سلسلة الدفعات اليوم."},ex:"l14"},
{id:"cur_yield",ch:"c7",name:{en:"Current yield (bond)",ar:"العائد الجاري (السند)"},disp:'CY = <span class="fr"><span class="top">Annual interest payment</span><span class="bot">Current market price</span></span>',vars:[],when:{en:"Coupon return at today's price.",ar:"لعائد الكوبون بسعر اليوم."},tells:{en:"Income yield ignoring principal repayment.",ar:"عائد الدخل متجاهلًا سداد الأصل."},ex:"l15"},
{id:"accrued",ch:"c7",name:{en:"Accrued interest",ar:"الفائدة المستحقة"},disp:'AI = <span class="fr"><span class="top">Months since payment</span><span class="bot">12</span></span> × Annual coupon',vars:[],when:{en:"Trading a bond between coupon dates.",ar:"عند تداول السند بين مواعيد الكوبون."},tells:{en:"Interest earned by the seller so far.",ar:"الفائدة المكتسبة للبائع حتى الآن."},ex:"l15"},
{id:"float_rate",ch:"c7",name:{en:"Floating loan rate",ar:"معدل القرض العائم"},disp:'Rate<sub>t</sub> = Index<sub>t−1</sub> + spread  (cap / floor)',vars:[],when:{en:"Indexed loans (e.g. LIBOR + basis points).",ar:"للقروض المفهرسة (مثل LIBOR + نقاط أساس)."},tells:{en:"This period's rate from last period's index.",ar:"معدل هذه الفترة من مؤشر الفترة السابقة."},ex:"l15"},
{id:"bond_val",ch:"c7",name:{en:"Bond value ★",ar:"قيمة السند ★"},disp:'B<sub>0</sub> = C × <span class="fr"><span class="top">1 − (1 + r)<sup>−n</sup></span><span class="bot">r</span></span> + <span class="fr"><span class="top">Par</span><span class="bot">(1 + r)<sup>n</sup></span></span>',vars:[{s:"C",en:"Annual coupon = rate × par",ar:"الكوبون السنوي = المعدل × الاسمي"},{s:"r",en:"Market required yield",ar:"العائد المطلوب سوقيًا"}],when:{en:"Valuing any coupon bond.",ar:"لتقييم أي سند كوبون."},tells:{en:"PV of coupons + PV of par.",ar:"القيمة الحالية للكوبونات + القيمة الحالية للاسمي."},ex:"l15"},
{id:"pbp_c",ch:"c8",name:{en:"Payback — constant inflow",ar:"الاسترداد — تدفق ثابت"},disp:'PBP = <span class="fr"><span class="top">Initial investment</span><span class="bot">Annual fixed cash inflow</span></span>',vars:[],when:{en:"Equal yearly inflows.",ar:"لتدفقات سنوية متساوية."},tells:{en:"Years to recover the outlay.",ar:"سنون استرداد الإنفاق."},ex:"l16"},
{id:"pbp_v",ch:"c8",name:{en:"Payback — variable inflow",ar:"الاسترداد — تدفق متغير"},disp:'PBP = Completed years + <span class="fr"><span class="top">Remaining outflow</span><span class="bot">Cash inflow of year t</span></span>',vars:[],when:{en:"Uneven yearly inflows.",ar:"لتدفقات سنوية غير منتظمة."},tells:{en:"Exact recovery time with a fractional year.",ar:"زمن الاسترداد الدقيق بكسر سنة."},ex:"l16"},
{id:"arr",ch:"c8",name:{en:"Average rate of return",ar:"معدل العائد المتوسط"},disp:'ARR = <span class="fr"><span class="top">Average profit after tax</span><span class="bot">Average investment</span></span>  or  ÷ Initial investment',vars:[],when:{en:"Accounting-based project screen.",ar:"لغربلة المشروعات على أساس محاسبي."},tells:{en:"Average annual earning of the project.",ar:"متوسط الكسب السنوي للمشروع."},ex:"l16"}

concepts:[
{id:"k1",name:{en:"Shareholder-wealth maximization",ar:"تعظيم ثروة المساهمين"},def:{en:"The corporate goal: decisions are judged by their effect on the owners' value (share price).",ar:"هدف المنشأة: تُقاس القرارات بأثرها على قيمة الملاك (سعر السهم)."},why:{en:"It disciplines every budgeting, financing and payout decision in the course.",ar:"يضبط كل قرارات الموازنة والتمويل والتوزيع في المقرر."},lesson:"l1"},
{id:"k2",name:{en:"Time value of money",ar:"القيمة الزمنية للنقد"},def:{en:"A dollar today is worth more than a dollar tomorrow; money compounds.",ar:"جنيه اليوم أثمن من جنيه الغد؛ والمال يتراكم."},why:{en:"It is the discounting engine behind stocks, bonds and projects.",ar:"محرك الخصم وراء الأسهم والسندات والمشروعات."},lesson:"l14"},
{id:"k3",name:{en:"Risk–return trade-off",ar:"مقايضة المخاطرة والعائد"},def:{en:"Higher risk must be compensated by higher expected return.",ar:"المخاطرة الأعلى يجب تعويضها بعائد متوقع أعلى."},why:{en:"Explains why T yields 17.7% vs C's 9.7%, and why beta prices risk.",ar:"يشرح لماذا يعطي T 17.7% مقابل 9.7% لـ C، ولماذا تسعر بيتا المخاطرة."},lesson:"l11"},
{id:"k4",name:{en:"Cash flows are the source of value",ar:"التدفقات النقدية مصدر القيمة"},def:{en:"Value comes from cash extractable from the business, not accounting profit.",ar:"القيمة من النقد القابل للسحب من النشاط لا الربح المحاسبي."},why:{en:"Motivates OCF/FCF/FCFF and the cash basis of finance.",ar:"يدفع OCF/FCF/FCFF والأساس النقدي للتمويل."},lesson:"l4"},
{id:"k5",name:{en:"Depreciation tax shield",ar:"الدرع الضريبي للإهلاك"},def:{en:"A non-cash charge that cuts taxable income and therefore cash tax.",ar:"مصروف غير نقدي يخفض الوعاء الضريبي وبالتالي الضريبة النقدية."},why:{en:"Why depreciation is added back in every cash-flow formula.",ar:"لماذا يُضاف الإهلاك في كل معادلات التدفق النقدي."},lesson:"l3"},
{id:"k6",name:{en:"Diversification",ar:"التنويع"},def:{en:"Combining imperfectly correlated assets cancels unsystematic risk.",ar:"دمج أصول غير مترابطة تمامًا يلغي المخاطر غير النظامية."},why:{en:"The cross-term in σp is exactly where this benefit appears.",ar:"الحد التبادلي في σp هو موضع ظهور هذه الفائدة بالضبط."},lesson:"l12"},
{id:"k7",name:{en:"Systematic vs unsystematic risk",ar:"المخاطر النظامية مقابل غير النظامية"},def:{en:"Market-wide risk (beta) cannot be diversified; firm-specific risk can.",ar:"مخاطر السوق (بيتا) لا تُنوَّع؛ ومخاطر المنشأة الخاصة تُنوَّع."},why:{en:"Decides which risk the market pays you for (CAPM).",ar:"يحدد أي مخاطرة يدفع لك السوق مقابلها (CAPM)."},lesson:"l12"},
{id:"k8",name:{en:"Beta & the risk premium",ar:"بيتا وعلاوة المخاطرة"},def:{en:"Beta scales the market risk premium into an asset's required return.",ar:"بيتا تحجم علاوة مخاطر السوق إلى العائد المطلوب للأصل."},why:{en:"The slope of the security market line in CAPM.",ar:"ميل خط سوق الأوراق المالية في CAPM."},lesson:"l13"},
{id:"k9",name:{en:"Valuation = PV of future cash flows",ar:"التقييم = القيمة الحالية للتدفقات المستقبلية"},def:{en:"Stocks, bonds and projects are all valued by discounting their future flows.",ar:"الأسهم والسندات والمشروعات كلها تُقيَّم بخصم تدفقاتها المستقبلية."},why:{en:"One principle unifies ZGM, CGM, bond value and NPV-family thinking.",ar:"مبدأ واحد يوحد صفر النمو والنمو الثابت وقيمة السند وتفكير NPV."},lesson:"l10"},
{id:"k10",name:{en:"Over/undervaluation rule",ar:"قاعدة الإفراط/الانخفاض في التقييم"},def:{en:"Buy when model value &gt; market price; avoid when value &lt; price.",ar:"اشترِ عندما تتجاوز قيمة النموذج سعر السوق؛ وتجنب عندما تقل."},why:{en:"The decision step that turns a valuation number into an action.",ar:"خطوة القرار التي تحول رقم التقييم إلى فعل."},lesson:"l15"},
{id:"k11",name:{en:"Liquidity vs solvency",ar:"السيولة مقابل الملاءة"},def:{en:"Paying this year's bills vs surviving the long run.",ar:"سداد فواتير هذا العام مقابل النجاة على المدى الطويل."},why:{en:"Two ratio families diagnose two different diseases.",ar:"عائلتا نسب تشخصان مرضين مختلفين."},lesson:"l8"},
{id:"k12",name:{en:"Leverage: risk vs EPS",ar:"الرافعة: المخاطرة مقابل EPS"},def:{en:"Too much debt raises default risk; too much equity dilutes EPS.",ar:"كثرة الديون ترفع مخاطر التعثر؛ وكثرة الحقوق تخفف EPS."},why:{en:"The capital-management balancing act from Lecture 1.",ar:"فعل التوازن في إدارة رأس المال من المحاضرة الأولى."},lesson:"l1"},
{id:"k13",name:{en:"Cash surplus vs deficit management",ar:"إدارة الفائض والعجز النقدي"},def:{en:"Excess cash goes to marketable securities; deficits are financed with notes payable.",ar:"الفائض يذهب للأوراق المالية؛ والعجز يُموَّل بأوراق الدفع."},why:{en:"The output of every cash budget.",ar:"مخرج كل موازنة نقدية."},lesson:"l6"},
{id:"k14",name:{en:"Correlation & portfolio risk",ar:"الارتباط ومخاطر المحفظة"},def:{en:"ρ = +0.75 means assets move together but not in perfect unison — some risk still cancels.",ar:"ρ = +0.75 يعني تحرك الأصلين معًا بلا تناغم تام — فيُلغى بعض المخاطر."},why:{en:"Determines the size of the diversification benefit in σp.",ar:"يحدد حجم فائدة التنويع في σp."},lesson:"l12"},
{id:"k15",name:{en:"Payback ignores TVM",ar:"الاسترداد يتجاهل القيمة الزمنية"},def:{en:"PBP counts years, not discounted value, and is blind beyond the payback year.",ar:"PBP يعد السنين لا القيمة المخصومة، وهو أعمى عما بعد سنة الاسترداد."},why:{en:"Why the discounted family (NPV, IRR, PI, DPBP) exists.",ar:"لماذا توجد عائلة المخصوم (NPV وIRR وPI وDPBP)."},lesson:"l16"},
{id:"k16",name:{en:"Exchange-rate exposure",ar:"التعرض لسعر الصرف"},def:{en:"MNC cash flows cross currencies, so rates, inflation and politics become financial variables.",ar:"تدفقات الشركات متعددة الجنسيات تعبر العملات، فتصير الأسعار والتضخم والسياسة متغيرات مالية."},why:{en:"The core difficulty list of international financial management.",ar:"جوهر قائمة صعوبات الإدارة المالية الدولية."},lesson:"l17"},
{id:"k17",name:{en:"Residual claim of common equity",ar:"المطالبة المتبقية للملكية العادية"},def:{en:"Common holders are paid last, so they demand the highest return.",ar:"العاديون يُدفعون آخرًا، لذا يطلبون أعلى عائد."},why:{en:"Roots the equity risk premium and the debt-vs-equity table.",ar:"يجذر علاوة مخاطر الملكية وجدول الدين مقابل الملكية."},lesson:"l9"},
{id:"k18",name:{en:"Compounding vs discounting",ar:"التركيب مقابل الخصم"},def:{en:"Moving money forward multiplies by (1+r)^n; moving it back divides.",ar:"نقل المال للأمام ضرب في (1+r)^n؛ وإرجاعه قسمة."},why:{en:"The two directions of the same TVM machine.",ar:"اتجاهان لآلة القيمة الزمنية نفسها."},lesson:"l14"}
],
glossary:[
{t:{en:"Corporate finance",ar:"المالية الإدارية"},ab:"—",d:{en:"Capital-structure decisions aimed at maximizing shareholders' wealth.",ar:"قرارات الهيكل الرأسمالي بهدف تعظيم ثروة المساهمين."},l:"l1"},
{t:{en:"Capital budgeting",ar:"الموازنة الرأسمالية"},ab:"—",d:{en:"Analyzing potential investments in fixed assets.",ar:"تحليل الاستثمارات المحتملة في الأصول الثابتة."},l:"l16"},
{t:{en:"Budgeting",ar:"إعداد الموازنات"},ab:"—",d:{en:"Creating a plan to manage money by estimating future income/expenses.",ar:"وضع خطة لإدارة المال بتقدير الدخل/المصروفات المستقبلية."},l:"l16"},
{t:{en:"Capital management",ar:"إدارة رأس المال"},ab:"—",d:{en:"Managing debt & equity sources to keep short-term liquidity.",ar:"إدارة مصادر الدين والملكية للحفاظ على سيولة قصيرة الأجل."},l:"l1"},
{t:{en:"Financial markets",ar:"الأسواق المالية"},ab:"—",d:{en:"Marketplaces where securities trade (stock, bond, forex, derivatives).",ar:"أماكن تداول الأوراق المالية (أسهم وسندات وصرف ومشتقات)."},l:"l2"},

<script>
"use strict";
(function(){
window.addEventListener("error", function(e){
  var v=document.getElementById("view");
  if(v && v.innerHTML.trim()===""){ v.innerHTML='<div class="card" style="margin:20px;color:var(--warn)">⚠ '+String(e.message||"error")+'<br><span class="muted small">Hard-refresh (Ctrl+Shift+R) or send a screenshot of this message. · حدّث الصفحة تحديثًا قويًا أو أرسل لقطة لهذه الرسالة.</span></div>'; }
});
var D = window.DATA;
/* ---------- safe storage (works even in sandboxed iframes) ---------- */
var mem = {};
function sget(k, d){ try{ var v = localStorage.getItem(k); return v===null? d : JSON.parse(v); }catch(e){ return (k in mem)? mem[k] : d; } }
function sset(k, v){ mem[k]=v; try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
var state = {
  lang: sget("cf_lang","en"),
  theme: sget("cf_theme","light"),
  done: {},
  marks: {},
  last: null,
  mode: "learn",
  user: null,
  authMode: "login"
};
/* ---------- student accounts: Google Sheets (Apps Script) + local fallback ---------- */
var DEFAULT_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzwQiabb3_nKMBSCOMlO92A3Pc0ahvD0XO1aWBrzbAHtbZOstRyirKmLiqSl6PSk6ZmqQ/exec";
var SYNC = { url: sget("cf_script_url", DEFAULT_SCRIPT_URL), ok: null };
function todayStr(){ return new Date().toISOString().slice(0,10); }
function hash(s){ var x=5381; for(var i=0;i<s.length;i++){ x=((x<<5)+x)^s.charCodeAt(i); } return (x>>>0).toString(36); }
function accounts(){ return sget("cf_accounts",{}); }
function saveAccounts(a){ sset("cf_accounts",a); }
function keyOf(name){ return String(name).trim().toLowerCase(); }
function apiUrl(params){ return SYNC.url + (SYNC.url.indexOf("?")>-1?"&":"?") + Object.keys(params).map(function(k){ return k+"="+encodeURIComponent(params[k]); }).join("&"); }
function cloudGet(params){ try{ return fetch(apiUrl(params)).then(function(r){ return r.json(); }); }catch(e){ return Promise.reject(e); } }
function cloudPost(obj){ try{ return fetch(SYNC.url, { method:"POST", headers:{ "Content-Type":"text/plain;charset=utf-8" }, body: JSON.stringify(obj) }).then(function(r){ return r.json(); }); }catch(e){ return Promise.reject(e); } }
function norm(u){ u.id=keyOf(u.name); if(typeof u.done==="string"){ try{ u.done=JSON.parse(u.done||"{}"); }catch(e){ u.done={}; } } if(typeof u.marks==="string"){ try{ u.marks=JSON.parse(u.marks||"{}"); }catch(e){ u.marks={}; } } u.done=u.done||{}; u.marks=u.marks||{}; u.visits=Number(u.visits)||0; return u; }
function mirror(u){ var a=accounts(); var m=a[u.id]||{}; m.name=u.name; m.created=u.created; m.visits=u.visits; m.lastVisit=u.lastVisit; m.done=u.done||{}; m.marks=u.marks||{}; m.last=u.last||null; a[u.id]=m; saveAccounts(a); }
function loadUser(u){ state.user=u; state.done=u.done||{}; state.marks=u.marks||{}; state.last=u.last||null; }
var saveTimer=null;
function saveUser(){
  if(!state.user) return;
  state.user.done=state.done; state.user.marks=state.marks; state.user.last=state.last;
  mirror(state.user);
  if(state.user.cloud && SYNC.url){
    clearTimeout(saveTimer);
    saveTimer=setTimeout(function(){
      cloudPost({ action:"save", name: state.user.name, done: state.done, marks: state.marks, last: state.last })
        .then(function(){ SYNC.ok=true; refreshChip(); })
        .catch(function(){ SYNC.ok=false; refreshChip(); });
    }, 700);
  }
}
function commitLogin(u){ sset("cf_session", u.id); mirror(u); loadUser(u); state.mode="learn"; render(); }
function localEnter(name){
  var a=accounts(); var k=keyOf(name); var u=a[k];
  if(!u){ u={ id:k, name:name.trim(), created:todayStr(), visits:0, done:{}, marks:{}, last:null }; }
  u.visits=(u.visits||0)+1; u.lastVisit=todayStr(); a[k]=u; saveAccounts(a);
  u.cloud=false; commitLogin(u);
}
function enterName(name){
  var err=document.getElementById("authErr"); if(err) err.textContent="";
  if(name.trim().length<2){ if(err) err.textContent=t("errName"); return; }
  if(SYNC.url){
    cloudPost({ action:"enter", name: name.trim() }).then(function(res){
      if(!res || !res.ok || !res.student) throw 0;
      SYNC.ok=true; var u=norm(res.student); u.cloud=true; commitLogin(u);
    }).catch(function(){ SYNC.ok=false; localEnter(name); });

    return '<details class="rev"><summary>'+L(l.title)+'</summary><div class="in">'+callout("warn","<ul>"+l.mistakes.map(function(m){return "<li>"+L(m)+"</li>";}).join("")+"</ul>")+'</div></details>';
  }).join("")+'</section>';
  h += '<section class="blk"><h2>'+t("allDist")+'</h2>'+D.lessons.filter(function(l){return l.dist.length;}).map(function(l){
    return '<details class="rev"><summary>'+L(l.title)+'</summary><div class="in">'+l.dist.map(distHTML).join("")+'</div></details>';
  }).join("")+'</section>';
  return h;
}

function abbrevList(q){
  var qq=q.toLowerCase();
  var rows=D.abbrev.filter(function(a){ return !qq || (a.a+" "+a.en+" "+a.ar).toLowerCase().indexOf(qq)>-1; });
  if(!rows.length) return '<p class="muted">'+t("noResults")+'</p>';
  var h1=state.lang==="ar"?"الاختصار":"Abbr.", h2=state.lang==="ar"?"الاسم الكامل":"Full name (English)", h3=state.lang==="ar"?"Full name (English)":"بالعربية";
  return '<div class="tblwrap"><table class="tbl"><tr><th>'+h1+'</th><th>'+h2+'</th><th>'+h3+'</th><th>'+t("lesson")+'</th></tr>'+
  rows.map(function(a){ return '<tr><td><b>'+hl(a.a,q)+'</b></td><td>'+hl(state.lang==="ar"?a.ar:a.en,q)+'</td><td>'+hl(state.lang==="ar"?a.en:a.ar,q)+'</td><td><a href="#/lesson/'+a.l+'">'+L(LMAP[a.l].title)+'</a></td></tr>'; }).join("")+
  '</table></div>';
}
function pageAbbrev(){
  return '<h2 class="sec">'+t("abbrevTitle")+'</h2><p class="muted">'+t("abbrevSub")+'</p>'+
  '<input id="aSearch" type="search" placeholder="'+t("searchA")+'" style="width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px 14px;font:inherit;background:var(--card);color:var(--ink);margin:10px 0">'+
  '<div id="aList">'+abbrevList("")+'</div>';
}
function pageCheat(){
  var note = state.lang==="ar" ? '<div class="callout c-note"><span class="ct">ملاحظة</span>الورقة داخل الإطار أدناه هي النسخة الإنجليزية الأصلية (طبق الأصل) كما جاءت من المحاضرات.</div>' : '';
  return note+'<iframe id="csFrame" title="'+t("cheatTitle")+'" style="width:100%;height:calc(100vh - 150px);min-height:560px;border:1px solid var(--line);border-radius:12px;background:#fff"></iframe>';
}
/* ---------- global search ---------- */
function doSearch(q){
  var res = document.getElementById("searchResults");
  var qq = q.trim().toLowerCase();
  if(!qq){ res.innerHTML = ""; return; }
  var out = "";
  var ls = D.lessons.filter(function(l){ return (l.title.en+" "+l.title.ar+" "+l.desc.en+" "+l.desc.ar+" "+l.terms.map(function(x){return x.t.en+" "+x.t.ar;}).join(" ")).toLowerCase().indexOf(qq)>-1; });
  var fs = D.formulas.filter(function(f){ return (f.name.en+" "+f.name.ar+" "+f.id+" "+f.when.en+" "+f.when.ar).toLowerCase().indexOf(qq)>-1; });
  var cs = D.concepts.filter(function(c){ return (c.name.en+" "+c.name.ar+" "+c.def.en+" "+c.def.ar).toLowerCase().indexOf(qq)>-1; });
  var gs = D.glossary.filter(function(g){ return (g.t.en+" "+g.t.ar+" "+g.ab+" "+g.d.en+" "+g.d.ar).toLowerCase().indexOf(qq)>-1; });
  if(ls.length){ out += '<div class="grp">'+t("lessons")+'</div>'+ls.map(function(l){ return '<a href="#/lesson/'+l.id+'">'+hl(L(l.title),q)+'<small>'+t("inLesson")+' '+L(CMAP[l.ch].title)+'</small></a>'; }).join(""); }
  if(fs.length){ out += '<div class="grp">'+t("inFormula")+'</div>'+fs.map(function(f){ return '<a href="#/formulas">'+hl(L(f.name),q)+'<small>'+f.disp.replace(/<[^>]+>/g,"")+'</small></a>'; }).join(""); }
  if(cs.length){ out += '<div class="grp">'+t("inConcept")+'</div>'+cs.map(function(c){ return '<a href="#/concepts">'+hl(L(c.name),q)+'<small>'+hl(L(c.def),q).slice(0,90)+'</small></a>'; }).join(""); }
  if(gs.length){ out += '<div class="grp">'+t("inGlossary")+'</div>'+gs.map(function(g){ return '<a href="#/glossary">'+hl(g.t.en,q)+' — '+hl(g.t.ar,q)+'<small>'+hl(L(g.d),q).slice(0,90)+'</small></a>'; }).join(""); }
  res.innerHTML = out || '<p class="muted">'+t("noResults")+'</p>';
}

var NAV = [["#/", "home"], ["#/chapters", "chapters"], ["#/formulas", "formulas"], ["#/concepts", "concepts"], ["#/glossary", "glossary"], ["#/abbrev", "abbrev"], ["#/cheatsheet", "cheat"], ["#/review", "review"]];
function renderNav(){

window.addEventListener("hashchange", render);
trySession(); applyLang(); applyTheme(); render();
})();

<!-- ================= 1 ================= -->
<section id="s1">
<h2>1 · Foundations &amp; Key Terms <span class="src">Lec 1 · Lec 2-P1</span><a class="top-link" href="#top">top</a></h2>
<dl class="defs cols">
  <dt>Finance</dt><dd>Management of money by individuals (personal), corporations (corporate), governments (public).</dd>
  <dt>Corporate finance</dt><dd>Deals with capital structure (debt + equity); maximizes shareholders' wealth via short- &amp; long-term financing plans.</dd>
  <dt>Corporate goal</dt><dd><span class="hl">Maximize shareholder wealth</span> (share price), not merely profit.</dd>
  <dt>Capital management</dt><dd>Provide short-term liquidity through debt &amp; equity. Too much debt → default risk; too much equity → lower EPS.</dd>
  <dt>Investment</dt><dd>Purchase of assets (stocks, bonds, real estate…) to earn dividends, interest, capital gains.</dd>
  <dt>Capital budgeting</dt><dd>Decision process for analyzing potential investments in fixed assets.</dd>
  <dt>Budgeting</dt><dd>Planning money by estimating future income/expenses over a period.</dd>
  <dt>Financial markets</dt><dd>Any marketplace where securities trade (stock, bond, forex, derivatives).</dd>
  <dt>Financial services</dt><dd>Design &amp; delivery of advice and financial products to individuals, firms, governments.</dd>
  <dt>Areas of corporate finance</dt><dd>Capital budgeting · capital financing · working-capital management.</dd>
</dl>
<h3>Five principles of finance</h3>
<ul class="cols">
  <li><b>Time value of money</b> — a dollar today &gt; a dollar tomorrow.</li>
  <li><b>Risk–return trade-off</b> — higher risk ⇒ higher return.</li>
  <li><b>Cash flows are the source of value</b> (cash that can be taken out of the business).</li>
  <li><b>Market prices reflect information</b> (buy &amp; sell ⇒ equilibrium).</li>
  <li><b>Individuals respond to incentives</b> (motivation).</li>
</ul>
<h3>Business forms</h3>
<table>
  <tr><th></th><th>Sole proprietorship</th><th>Partnership</th><th>LP / LLC</th><th>Corporation</th></tr>
  <tr><td>Owners</td><td>One</td><td>Two or more</td><td>≥1 GP + limited LPs</td><td>Shareholders</td></tr>
  <tr><td>Liability for debts</td><td>Unlimited</td><td>Unlimited (each)</td><td>GP unlimited, LP limited</td><td>Limited</td></tr>
  <tr><td>Owners manage?</td><td>Yes</td><td>Yes</td><td>GP yes, LP no</td><td>No (managers)</td></tr>
  <tr><td>Change of ownership dissolves?</td><td>Yes</td><td>Yes</td><td>GP yes, LP no</td><td>No</td></tr>
  <tr><td>Access to capital</td><td>Limited</td><td>Limited</td><td>Size-dependent</td><td>Very easy</td></tr>
  <tr><td>Taxation</td><td>Personal</td><td>Personal</td><td>Personal</td><td><b>Double</b> (earnings + dividends)</td></tr>
</table>
<h3>Debt vs Equity</h3>
<table>
  <tr><th></th><th>Debt</th><th>Equity</th></tr>
  <tr><td>Voting rights</td><td>No</td><td>Yes</td></tr>
  <tr><td>Claim on income/assets</td><td>Senior</td><td>Subordinate</td></tr>
  <tr><td>Maturity</td><td>Stated</td><td>None</td></tr>
  <tr><td>Tax treatment</td><td>Interest <b>deductible</b></td><td>No deduction</td></tr>
</table>
<h3>Accounting vs Finance</h3>
<ul>
  <li>Focus: accounting = past &amp; present · finance = <b>future-oriented</b> decisions.</li>
  <li>Basis: accounting = <b>accrual</b> (IFRS/GAAP) · finance = <b>cash</b> (risk, TVM, value).</li>
</ul>
<h3>Earnings per share</h3>
<div class="f"><b>EPS</b> = <span class="frac"><span class="top">Net income − Preferred dividends</span><span class="bot">Outstanding common shares</span></span></div>
<details><summary>Example — EPS</summary>
  NI 1,000,000; pref. div. 100,000; 450,000 shares → EPS = 900,000/450,000 = <b>$2.00</b>. Bakery: (20,000−2,000)/10,000 = <b>2.0</b>. More shares issued ⇒ lower EPS.
</details>
</section>

<!-- ================= 2 ================= -->
<section id="s2">
<h2>2 · Cash Flow, OCF, FCF &amp; FCFF <span class="src">Lec 2-P2 · Lec 3</span><a class="top-link" href="#top">top</a></h2>
<h3>Cash-flow categories</h3>
<ul class="cols">
  <li><b>Operating:</b> cash sales, collecting A/R, tax refunds | paying wages, payables, overhead, interest.</li>
  <li><b>Investing:</b> sale / purchase of fixed assets.</li>
  <li><b>Financing:</b> sale of stock, borrowing | buying back stock, dividends, debt repayment.</li>
</ul>
<h3>Depreciation (MACRS, 5-year recovery)</h3>
<div class="f">Rates: Yr1 <b>20%</b> · Yr2 <b>32%</b> · Yr3 <b>19%</b> · Yr4 <b>12%</b> · Yr5 <b>12%</b> · Yr6 <b>5%</b> &nbsp;→&nbsp; Dep<sub>t</sub> = Installed cost × rate<sub>t</sub></div>
<details><summary>Example — $100,000 machine</summary>
  Depreciation: 20,000 · 32,000 · 19,000 · 12,000 · 12,000 · 5,000 (total 100,000). Depreciation matters: non-cash charge + <b>tax shield</b>.
</details>
<h3>Operating cash flow</h3>
<div class="f">NOPAT = EBIT × (1 − T) &nbsp;&nbsp;|&nbsp;&nbsp; <b>OCF (unlevered)</b> = EBIT × (1 − T) + Depreciation</div>
<div class="f"><b>OCF (levered)</b> = Net income after tax + Depreciation</div>
<p class="where">Unlevered = cash to all capital providers before debt &amp; equity; levered = after interest/debt servicing.</p>
<details><summary>Example — Baker Corp.</summary>
  OCF = 370 × (1 − .40) + 100 = <b>$322</b> (thousands).
</details>
<h3>Free cash flow (FCF)</h3>
<div class="f"><b>FCF</b> = OCF − NFAI − NCAI</div>
<div class="f">NFAI = Δ Net fixed assets + Depreciation &nbsp;&nbsp;|&nbsp;&nbsp; NCAI = Δ Current assets − Δ (A/P + Accruals)</div>
<details><summary>Example — Baker Corp.</summary>
  NFAI = (1,200 − 1,000) + 100 = 300 · NCAI = (2,000 − 1,900) − (800 − 700) = 0 · FCF = 322 − 300 − 0 = <b>$22</b>.
</details>
<h3>Free cash flow to the firm (FCFF) ★</h3>
<div class="f"><b>FCFF</b> = NI + Depreciation + [Interest × (1 − T)] − Fixed-asset investment − Δ Working capital</div>
<p class="where">FCFF = cash available to debt holders, equity holders and re-investment.</p>
<details><summary>Example 1</summary>
  NI 500, D&amp;A 120, Int 100, T 30%, FA inv 200, WC inv 50 → FCFF = 500 + 120 + 100(0.70) − 200 − 50 = <b>440</b>.
</details>
<details><summary>Example 2 — ABC Co.</summary>
  NI 245,000 + Dep 100,000 + Int 50,000(0.70) − FA inv (850,000−600,000) − ΔWC [(440,000−180,000) − (350,000−150,000)] = 245,000 + 100,000 + 35,000 − 250,000 − 60,000 = <b>70,000</b>.
</details>
<h3>Cash-flow ratios</h3>
<div class="f">Cash-flow margin = <span class="frac"><span class="top">OCF</span><span class="bot">Sales revenue</span></span> &nbsp;&nbsp;|&nbsp;&nbsp; Cash-flow coverage = <span class="frac"><span class="top">OCF</span><span class="bot">Total debt</span></span></div>
<p class="where">Margin: high = strong cash conversion; negative = operations consume cash. Coverage: high = debt repaid quickly (&gt;1 ⇒ under one year); 0.1–0.3 acceptable; &lt;0.1 low; negative = financial risk. ABC: margin = 345,000/2,000,000 = 0.1725; coverage = 345,000/450,000 ≈ 0.77.</p>
</section>

<!-- ================= 3 ================= -->
<section id="s3">
<h2>3 · Cash Budgeting <span class="src">Lec 4-P1</span><a class="top-link" href="#top">top</a></h2>
<p>Financial planning = <b>cash planning</b> (cash budget) + <b>profit planning</b> (pro-forma statements). The cash budget shows expected cash <b>shortages / surpluses</b> month by month.</p>
<h3>The three steps</h3>
<ul>
  <li><b>Step 1 — Cash receipts:</b> cash sales (% of sales) + collections of A/R lagged 1 month and 2 months + other receipts.</li>
  <li><b>Step 2 — Cash disbursements:</b> purchases (% of sales) paid cash / lagged 1 mo / lagged 2 mo + rent, wages &amp; salaries, taxes, fixed-asset outlays, interest, dividends, principal.</li>
  <li><b>Step 3 — Financing position:</b></li>
</ul>
<div class="f">Net cash flow = Receipts − Disbursements &nbsp;→&nbsp; Ending cash = Net CF + Beginning cash</div>
<div class="f">Ending &lt; Minimum ⇒ <b>Required total financing</b> (notes payable) &nbsp;|&nbsp; Ending &gt; Minimum ⇒ <b>Excess cash</b> (marketable securities)</div>
<details><summary>Example — Halley Co. (Oct–Dec, $000; sales Aug 100, Sep 200, Oct 400, Nov 300, Dec 200; 20% cash, 50% +1mo, 30% +2mo; Dec dividend +30)</summary>
  <table>
    <tr><th></th><th class="num">Oct</th><th class="num">Nov</th><th class="num">Dec</th></tr>
    <tr><td>Total cash receipts</td><td class="num">210</td><td class="num">320</td><td class="num">340</td></tr>
    <tr><td>Less: disbursements (purchases = 70% of sales; 10% cash, 70% +1mo, 20% +2mo)</td><td class="num">213</td><td class="num">418</td><td class="num">305</td></tr>
    <tr><td>= Net cash flow</td><td class="num">(3)</td><td class="num">(98)</td><td class="num">35</td></tr>
    <tr><td>+ Beginning cash</td><td class="num">50</td><td class="num">47</td><td class="num">(51)</td></tr>
    <tr><td>= Ending cash</td><td class="num">47</td><td class="num">(51)</td><td class="num">(16)</td></tr>
    <tr><td>− Minimum cash balance</td><td class="num">25</td><td class="num">25</td><td class="num">25</td></tr>
    <tr><td>Required financing (notes payable)</td><td class="num">—</td><td class="num">76</td><td class="num">41</td></tr>
    <tr><td>Excess cash (marketable securities)</td><td class="num">22</td><td class="num">—</td><td class="num">—</td></tr>
  </table>
  Oct surplus 22 → invest in marketable securities; Nov &amp; Dec deficits → finance.
</details>
<details><summary>Example — Q1 2025 (beginning cash 50, minimum 25)</summary>
  <table>
    <tr><th></th><th class="num">Jan</th><th class="num">Feb</th><th class="num">Mar</th></tr>
    <tr><td>Receipts − Disbursements</td><td class="num">420−426</td><td class="num">640−836</td><td class="num">680−610</td></tr>
