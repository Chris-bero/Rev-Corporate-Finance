  </table>
</details>
</section>

<!-- ================= 4 ================= -->
<section id="s4">
<h2>4 · Financial Statement Analysis <span class="src">Lec 4-P2 · Lec 5</span><a class="top-link" href="#top">top</a></h2>
<h3>Common-size analysis</h3>
<div class="f">Common-size % = <span class="frac"><span class="top">Comparison amount</span><span class="bot">Base amount</span></span> × 100</div>
<p class="where">Base = total revenues (income statement) or total assets (balance sheet). E.g. COGS 98,432/218,739 = 45%; Equity/TA 344,373/365,389 = 94.2%.</p>
<h3>Trend (horizontal) analysis</h3>
<div class="f">% Change = <span class="frac"><span class="top">Dollar change</span><span class="bot">Base-year amount</span></span> × 100, &nbsp; Dollar change = Analysis year − Base year</div>
<p class="where">E.g. Cash (261,248−224,399)/224,399 = 16.4%; NI (25−15)/15 = 66.6%; RE (67−65)/65 = 3.07%.</p>
<h3>Ratio toolkit ★</h3>
<table>
  <tr><th>Group</th><th>Ratio</th><th>Formula</th><th>Read / rule</th></tr>
  <tr><td rowspan="3">Liquidity</td><td>Current ratio</td><td>CA / CL</td><td>≥ 1 → covers short-term liabilities</td></tr>
  <tr><td>Quick (acid-test)</td><td>(Cash + ST investments + A/R) / CL</td><td>≥ 1 → covers CL without selling inventory</td></tr>
  <tr><td>Cash ratio</td><td>Cash (&amp; equivalents) / CL</td><td>Higher = stronger position</td></tr>
  <tr><td rowspan="2">Efficiency</td><td>A/R turnover</td><td>Net credit sales / Avg net A/R</td><td>Higher = collects debts efficiently</td></tr>
  <tr><td>Inventory turnover</td><td>COGS / Avg inventory</td><td>Higher = efficient inventory management</td></tr>
  <tr><td rowspan="2">Solvency</td><td>Debt to assets</td><td>Total debt / Total assets</td><td>Long-term survival; lower = safer</td></tr>
  <tr><td>Times interest earned</td><td>EBIT / Interest expense</td><td>Ability to meet interest payments</td></tr>
  <tr><td rowspan="6">Profitability</td><td>Profit margin</td><td>Net income / Net sales</td><td>Net income per $1 of sales</td></tr>
  <tr><td>Asset turnover</td><td>Net sales / Avg total assets</td><td>Revenue per $1 of assets</td></tr>
  <tr><td>Return on assets</td><td>Net income / Avg total assets</td><td>NI per $1 invested in assets</td></tr>
  <tr><td>Return on equity</td><td>Net income / Avg equity</td><td>NI per $1 of equity</td></tr>
  <tr><td>EPS</td><td>NI / Weighted-avg shares</td><td>—</td></tr>
  <tr><td>P/E ratio</td><td>Market price per share / EPS</td><td>—</td></tr>
</table>
<details><summary>Example — ABC Co. (all ratios)</summary>
  Current = 440/180 = <b>2.44</b> · Quick = (100+180)/180 = <b>1.56</b> · Cash = 100/180 = <b>0.56</b> ·
  Debt/Assets = (180+450)/1,290 = <b>48.8%</b> · TIE = 400/50 = <b>8×</b> ·
  Margin = 245/2,000 = <b>12.25%</b> · Asset turnover = 2,000/[(950+1,290)/2] = <b>1.79</b> ·
  ROA = 245/1,120 = <b>21.87%</b> · ROE = 245/[(500+660)/2] = <b>42.24%</b> ·
  EPS = 245,000/250,000 = <b>$0.98</b> · P/E = 5/0.98 = <b>5.1</b>.
</details>
</section>

<!-- ================= 5 ================= -->
<section id="s5">
<h2>5 · Stock Valuation <span class="src">Lec 8</span><a class="top-link" href="#top">top</a></h2>
<h3>Expected return (dividends + capital gains)</h3>
<div class="f">E(r) = <span class="frac"><span class="top">D</span><span class="bot">P</span></span> + g</div>
<p class="where">D = dividend, P = price, g = growth. E.g. $1 dividend on $25 stock, g = 7% → 1/25 + 0.07 = <b>11%</b>.</p>
<h3>Zero-growth model (perpetuity; also preferred stock)</h3>
<div class="f">P<sub>0</sub> = D<sub>1</sub> × <span class="frac"><span class="top">1</span><span class="bot">r<sub>s</sub></span></span> = <span class="frac"><span class="top">D<sub>1</sub></span><span class="bot">r<sub>s</sub></span></span></div>
<details><summary>Examples</summary>
  Constant $3 dividend, r<sub>s</sub> = 15% → P<sub>0</sub> = 3/0.15 = <b>$20</b>. Table: 3/0.12 = 25 · 5/0.10 = 50 · 4/0.16 = 25 · 2.5/0.08 = 31.25 · 6/0.15 = 40.
</details>
<h3>Constant-growth model (Gordon) ★</h3>
<div class="f">P<sub>0</sub> = <span class="frac"><span class="top">D<sub>1</sub></span><span class="bot">r<sub>s</sub> − g</span></span>, &nbsp; D<sub>1</sub> = D<sub>0</sub>(1 + g)</div>
<details><summary>Examples</summary>
  D<sub>0</sub> = 1.40, g = 7%, r<sub>s</sub> = 15% → 1.40(1.07)/(0.15−0.07) = <b>$18.75</b>. Table: 2/(0.10−0.04) = 33.33 · 3/(0.12−0.05) = 42.86 · 1.5/(0.09−0.03) = 25 · 2.5/(0.11−0.06) = 50 · 4/(0.14−0.05) = 44.44.
</details>
<p><span class="rule ok">Buy if value &gt; price (undervalued)</span><span class="rule no">Sell/avoid if value &lt; price (overvalued)</span></p>
<h3>Must-know terms</h3>
<ul class="cols">
  <li><b>Common stock:</b> residual claimants; voting rights; returns = dividends + capital gains.</li>
  <li><b>Share types:</b> authorized · issued · outstanding · treasury; par vs no-par.</li>
  <li><b>IPO:</b> needs shareholder approval + investment bank underwriting (bank buys issue at agreed price, bears selling risk).</li>
  <li><b>Preferred stock:</b> fixed dividend, prior claim, <b>cumulative</b> (arrears), paid before common; hybrid of bond &amp; stock.</li>
</ul>
</section>

<!-- ================= 6 ================= -->
<section id="s6">
<h2>6 · Risk, Return, Portfolio &amp; CAPM <span class="src">Lec 8 · Lec 9</span><a class="top-link" href="#top">top</a></h2>
<h3>Individual asset</h3>
<div class="f">E(R) = Σ P<sub>i</sub> R<sub>i</sub> &nbsp;&nbsp;|&nbsp;&nbsp; σ² = Σ P<sub>i</sub>(R<sub>i</sub> − E(R))² &nbsp;&nbsp;|&nbsp;&nbsp; σ = √σ²</div>
<details><summary>Example — states of nature (P: recession .2, normal .5, boom .3)</summary>
  Stock C: E(R) = .2(.02)+.5(.10)+.3(.15) = <b>9.7%</b>; σ² = 0.002028 → σ = <b>4.5%</b>. Stock T: E(R) = <b>17.7%</b>. Total risk = σ; systematic risk = β (C: σ20%/β1.25 vs K: σ30%/β0.95 → K more total risk, C more systematic risk &amp; higher expected return).
</details>
<h3>Portfolio return &amp; weights</h3>
<div class="f">w<sub>i</sub> = <span class="frac"><span class="top">Investment<sub>i</sub></span><span class="bot">Total portfolio</span></span> (Σw = 1) &nbsp;&nbsp;|&nbsp;&nbsp; E(R<sub>p</sub>) = Σ w<sub>i</sub> E(R<sub>i</sub>)</div>
<details><summary>Examples</summary>
  $15,000: IREX 2,000 (.1333, 19.65%) · AIND 3,000 (.2, 8.96%) · EFID 4,000 (.266, 9.67%) · EKHO 6,000 (.4, 8.13%) → E(R<sub>p</sub>) = .0262+.0179+.0257+.0325 = <b>10%</b>. AbuAuf &amp; VCola — half the money in each, 14% return each → <b>14%</b>.
</details>
<h3>Two-asset portfolio standard deviation ★</h3>
<div class="f">σ<sub>p</sub> = √( w<sub>1</sub>²σ<sub>1</sub>² + w<sub>2</sub>²σ<sub>2</sub>² + 2 w<sub>1</sub>w<sub>2</sub> ρ<sub>1,2</sub> σ<sub>1</sub>σ<sub>2</sub> )</div>
<details><summary>Example — w .5/.5, σ .2/.2, ρ = +0.75</summary>
  σ<sub>p</sub> = √(.5²·.2² + .5²·.2² + 2·.5·.5·.75·.2·.2) = √0.035 = <b>0.187</b>. ρ = +0.75 ⇒ returns move together but not in perfect unison.
</details>
<h3>Types of risk</h3>
<ul class="cols">
  <li><b>Systematic</b> (market / non-diversifiable): GDP, inflation, interest rates — measured by β.</li>
  <li><b>Unsystematic</b> (unique / asset-specific): strikes, part shortages — <b>eliminated by diversification</b>.</li>
  <li><b>Total risk</b> = σ; don't hold one asset or one industry.</li>
</ul>
<h3>Portfolio beta</h3>
<div class="f">β<sub>p</sub> = Σ w<sub>i</sub> β<sub>i</sub></div>
<p class="where">.133(3.69) + .2(0.64) + .167(1.64) + .4(1.79) = <b>1.61</b>.</p>
<h3>CAPM ★</h3>
<div class="f">R<sub>e</sub> = R<sub>f</sub> + β (R<sub>m</sub> − R<sub>f</sub>)</div>
<p class="where">R<sub>f</sub> = risk-free rate (e.g. T-bills), R<sub>m</sub> = market return, (R<sub>m</sub>−R<sub>f</sub>) = market risk premium. Higher β ⇒ higher risk premium.</p>
<details><summary>Examples &amp; decision rule</summary>
  R<sub>f</sub> 4%, R<sub>m</sub> 10%, β 1.5 → R<sub>e</sub> = 4 + 1.5(6) = <b>13%</b>. R<sub>f</sub> 3%, R<sub>m</sub> 11% (premium 8%): A β.8 → 9.4% vs exp 8% ⇒ <b>No</b>; B β1.2 → 12.6% vs 14% ⇒ <b>Yes</b>; C β1.5 → 15% vs 16% ⇒ <b>Yes</b>. R<sub>f</sub> 5%, R<sub>m</sub> 12%: X β.5 → 8.5% vs 7% No; Y β1.0 → 12% vs 12% Yes; Z β1.8 → 17.6% vs 18% Yes.<br>
  <span class="rule ok">Accept: Expected return ≥ CAPM return</span><span class="rule no">Reject: Expected return &lt; CAPM return</span>
</details>
</section>

<!-- ================= 7 ================= -->
<section id="s7">
<h2>7 · Time Value of Money &amp; Bond Valuation <span class="src">Lec 10</span><a class="top-link" href="#top">top</a></h2>
<h3>Simple interest</h3>
<div class="f">FV = PV × (1 + r·n) &nbsp;&nbsp;|&nbsp;&nbsp; PV = <span class="frac"><span class="top">FV</span><span class="bot">1 + r·n</span></span></div>
<p class="where">PV 100 at 6% for 1 year → FV 106. FV table (PV, r, n → FV): (10,000, 5%, 3) → 11,500 · (25,000, 7%, 4) → 32,000 · (5,000, 6%, 1.5) → 5,450. PV table (FV, r, n → PV): (12,000, 5%, 3) → 10,434.78 · (20,000, 6%, 4) → 16,129.03 · (8,000, 9%, 2) → 6,779.66.</p>
<h3>Compound interest</h3>
<div class="f">FV = PV × (1 + r)<sup>n</sup> &nbsp;&nbsp;|&nbsp;&nbsp; PV = <span class="frac"><span class="top">FV</span><span class="bot">(1 + r)<sup>n</sup></span></span></div>
<p class="where">PV 100 at 6% for 5 years → FV 133.8. FV table (PV, r, n → FV): (10,000, 5%, 3) → 11,576.25 · (15,000, 8%, 5) → 22,039.92 · (50,000, 6%, 10) → 89,542.4. PV table (FV, r, n → PV): (15,000, 5%, 4) → 12,340 · (30,000, 6%, 3) → 25,188 · (10,000, 8%, 10) → 4,631.93.</p>
<h3>Annuities (end-of-year payments)</h3>
<div class="f">FV = PMT × <span class="frac"><span class="top">(1 + r)<sup>n</sup> − 1</span><span class="bot">r</span></span> &nbsp;&nbsp;|&nbsp;&nbsp; PV = PMT × <span class="frac"><span class="top">1 − (1 + r)<sup>−n</sup></span><span class="bot">r</span></span></div>
<p class="where">PMT = 5,000 paid at the end of each year for 5 years, at r = 5%: FV = 5,000 × 5.5256 = <b>27,628</b>; PV = 5,000 × 4.3298 = <b>21,647.8</b>.</p>
<h3>Bond terms</h3>
<ul class="cols">
  <li><b>Loans</b> = private debt (two parties). Pros: speed · reduced costs · financing flexibility. Cons: interest cost higher than bonds · restrictive covenants · possible future SEC registration. <b>Bonds</b> = public debt, traded in bond markets.</li>
  <li><b>Indenture</b> = legal contract with trustee; bondholders' claims <b>senior</b> to common stock.</li>
  <li><b>Par value</b> = face repaid at <b>maturity</b>; <b>coupon rate</b> = % of par paid yearly.</li>
  <li><b>Call provision</b> = issuer may redeem early; <b>conversion</b> = bond → shares.</li>
  <li><b>Floating rate</b> = index (LIBOR) of prior period + spread, subject to cap &amp; floor.</li>
</ul>
<div class="f">Current yield = <span class="frac"><span class="top">Annual interest</span><span class="bot">Current market price</span></span> &nbsp;|&nbsp; Accrued interest = <span class="frac"><span class="top">Months since payment</span><span class="bot">12</span></span> × Annual coupon</div>
<p class="where">8% coupon, $1,000 par, price $700 → 80/700 = <b>11.4%</b>; 6 months accrued = 6/12 × 80 = <b>$40</b>. Floating loan (LIBOR+0.25, cap 2.5, floor 1.75): wk2 2.23 · wk3 1.91 · wk4 1.77 · wk5 1.60 · wk6 1.85 · wk7 1.88 · wk8 1.92 · wk9 2.13 · wk10 2.18.</p>
<h3>Bond value ★</h3>
<div class="f">B<sub>0</sub> = C × <span class="frac"><span class="top">1 − (1 + r)<sup>−n</sup></span><span class="bot">r</span></span> + <span class="frac"><span class="top">Par</span><span class="bot">(1 + r)<sup>n</sup></span></span></div>
<p class="where">= PV of coupon annuity + PV of par. C = coupon rate × par.</p>
<details><summary>Examples</summary>
  12% required, $120 coupon, 5yr → 432.576 + 567.427 = <b>1,000</b> (par). 15% → 402.264 + 497.77 = <b>899.44</b> (discount). 9% → 466.758 + 649.93 = <b>1,116.68</b> (premium). Coupon 8% with required yield 11.4% over 10 years → 458 + 339 = <b>803</b>. Table (coupon rate, required yield r, years → bond value): (7%, 5%, 3) → 1,054.47 · (8%, 10%, 4) → 936.60 · (6%, 7%, 5) → 959.00.<br>
  r &gt; coupon ⇒ discount · r = coupon ⇒ par · r &lt; coupon ⇒ premium.
</details>
<p><span class="rule ok">Accept/buy: DCF value &gt; market price (undervalued)</span><span class="rule no">Reject: DCF value &lt; market price (overvalued)</span></p>
</section>

<!-- ================= 8 ================= -->
<section id="s8">
<h2>8 · Capital Budgeting <span class="src">Lec 12</span><a class="top-link" href="#top">top</a></h2>
<p><b>Capital budgeting</b> = decision process for analyzing potential fixed-asset investments. Important because of: growth, large amounts, irreversibility, complexity, risk, long-term implications. Uses: new product/service, replacement, expansion, R&amp;D, long-term contracts, safety/environment.</p>
<h3>Techniques</h3>
<ul class="cols">
  <li><b>Non-discounted:</b> Payback period (PBP) · Average rate of return (ARR).</li>
  <li><b>Discounted:</b> Discounted PBP · NPV · IRR · Profitability index.</li>
</ul>
<h3>Payback period</h3>
<div class="f">Constant inflow: PBP = <span class="frac"><span class="top">Initial investment</span><span class="bot">Annual fixed cash inflow</span></span></div>
<div class="f">Variable inflow: PBP = Completed years + <span class="frac"><span class="top">Remaining outflow</span><span class="bot">Cash inflow of year t</span></span></div>
<details><summary>Examples</summary>
  Constant: A 50,000/12,000 = 4.17yr · B 60,000/15,000 = <b>4yr (best)</b> · C 45,000/10,000 = 4.5yr.<br>
  Variable: A 50,000 → cum 15/30/40/46 + 4,000/5,000 = <b>4.8yr</b>; B 60,000 → cum 20/40/50/56 + 4,000/6,000 = <b>4.66yr (best)</b>; C 45,000 → cum 12/24/36/42 + 3,000/4,000 = <b>4.75yr</b>. <span class="rule ok">Shorter PBP = better</span>
</details>
<h3>Average rate of return</h3>
<div class="f">ARR = <span class="frac"><span class="top">Average profit after tax</span><span class="bot">Average investment</span></span> &nbsp; or &nbsp; <span class="frac"><span class="top">Average profit after tax</span><span class="bot">Initial investment</span></span></div>
<p class="where">Determines the average annual earning of a project.</p>
</section>

<!-- ================= 9 ================= -->
<section id="s9">
<h2>9 · International Financial Management <span class="src">Lec 13</span><a class="top-link" href="#top">top</a></h2>
<ul class="cols">
  <li><b>MNC:</b> produces &amp; sells in more than one country; parent in home country + typically 5–6 foreign subsidiaries with strategic interaction.</li>
  <li><b>Classifications:</b> international · multinational · transnational corporations.</li>
  <li><b>Formation (FDI):</b> buying an entire company, or partial ownership (<b>≥10%</b> of stock).</li>
  <li><b>Motives:</b> raw-material seekers (BP, Exxon, Total) · market seekers (per-capita markets) · cost minimizers (Microsoft).</li>
  <li><b>Goal:</b> maximize shareholder wealth (share price + coupons).</li>
  <li><b>Roles:</b> global manager (adjust to volatility) · politician &amp; labor-union face (jobs/exports at home vs abroad).</li>
  <li><b>Difficulties:</b> exchange-rate risk · inflation risk · tax-rate differences · multiple financial markets · political risk.</li>
  <li><b>FX market participants:</b> bank &amp; non-bank dealers · individuals &amp; firms · speculators &amp; arbitragers · central banks &amp; treasuries · brokers.</li>
</ul>
<h3>Exchange-rate regimes</h3>
<ul class="cols">
  <li><b>Hard pegs:</b> gave up monetary sovereignty (adopt another currency / currency board).</li>
  <li><b>Soft pegs:</b> fixed exchange rates.</li>
  <li><b>Floating:</b> freely floating (market supply &amp; demand, occasional intervention) · managed floating (secret targets, heavy intervention).</li>
  <li><b>Residual:</b> everything else.</li>
</ul>
<h3>Quotations</h3>
<div class="f">Direct = home-currency price of 1 unit foreign &nbsp;|&nbsp; Indirect = foreign-currency price of 1 unit home</div>
<p class="where">European terms = indirect for Americans; American terms = direct. E.g. 22-Jan-2020: $1 = EGP 15.80 = 0.90 € = 2.82 TD.</p>
