<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Corporate Finance · FIN211 Learning Platform</title>
<style>
:root{
  --bg:#f4f6fa; --card:#ffffff; --ink:#16233a; --muted:#5c6b84; --navy:#0e2a47;
  --accent:#1663c7; --accent-soft:#e8f0fb; --gold:#b8860b; --gold-soft:#fdf6e3;
  --line:#dfe6f0; --ok:#1a7f4b; --ok-soft:#e5f5ec; --warn:#b3261e; --warn-soft:#fdecea;
  --box:#f2f6fc; --shadow:0 1px 3px rgba(16,42,67,.08),0 10px 28px rgba(16,42,67,.07);
  --radius:14px;
}
[data-theme="dark"]{
  --bg:#0c1420; --card:#141f30; --ink:#e8eef7; --muted:#9db0c7; --navy:#0a111c;
  --accent:#6fa8ff; --accent-soft:#16283f; --gold:#e0b050; --gold-soft:#2a2312;
  --line:#243449; --ok:#5ec99a; --ok-soft:#12291e; --warn:#ff8f86; --warn-soft:#33161a;
  --box:#101a29; --shadow:0 1px 3px rgba(0,0,0,.5),0 10px 28px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:15.5px/1.65 "Segoe UI",system-ui,-apple-system,"Helvetica Neue",Tahoma,Arial,sans-serif}
[dir="rtl"] body{font-family:Tahoma,"Segoe UI",system-ui,Arial,sans-serif}
a{color:var(--accent)}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.skip{position:absolute;left:-9999px;top:0;background:var(--accent);color:#fff;padding:8px 14px;border-radius:0 0 8px 0;z-index:99}
.skip:focus{left:0}
/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:40;background:var(--navy);color:#fff;box-shadow:var(--shadow)}
.tb-in{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px 18px}
.brand{display:flex;align-items:baseline;gap:8px;color:#fff;text-decoration:none;font-weight:700;font-size:17px;white-space:nowrap}
.brand .logo{width:26px;height:26px;flex:0 0 auto;align-self:center}
.brand small{font-weight:500;opacity:.75;font-size:11px}
nav.mainnav{display:flex;gap:2px;margin-inline-start:14px;flex-wrap:wrap}
nav.mainnav a{color:#dce7f5;text-decoration:none;font-size:13.5px;padding:7px 11px;border-radius:8px}
nav.mainnav a:hover{background:rgba(255,255,255,.12);color:#fff}
nav.mainnav a[aria-current="page"]{background:var(--accent);color:#fff;font-weight:600}
.tb-actions{margin-inline-start:auto;display:flex;align-items:center;gap:6px}
.icon-btn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);color:#fff;border-radius:9px;padding:6px 10px;font-size:14px;line-height:1}
.icon-btn:hover{background:rgba(255,255,255,.22)}
.lang-sw{display:flex;border:1px solid rgba(255,255,255,.25);border-radius:9px;overflow:hidden}
.lang-sw button{background:transparent;border:0;color:#cfe0f2;padding:6px 10px;font-size:12.5px;font-weight:600}
.lang-sw button.on{background:#fff;color:var(--navy)}
#menuBtn{display:none}
.authwrap{max-width:440px;margin:5vh auto 0}
.auth{padding:26px}
.auth h1{margin:0 0 4px;font-size:22px;color:var(--accent)}
.auth input{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px 13px;font:inherit;background:var(--bg);color:var(--ink);margin:6px 0}
.auth .err{color:var(--warn);font-size:13px;margin:6px 0;min-height:18px}
.uchip{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);border-radius:9px;padding:6px 10px;font-size:12.5px;color:#eaf2fb;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* ---------- layout ---------- */
.view{max-width:1200px;margin:0 auto;padding:22px 18px 60px}
.foot{border-top:1px solid var(--line);color:var(--muted);font-size:12.5px;text-align:center;padding:18px}
/* ---------- hero ---------- */
.hero{background:linear-gradient(135deg,var(--navy),#123c66 70%,#1663c7);color:#fff;border-radius:var(--radius);padding:38px 34px;box-shadow:var(--shadow)}
.hero h1{margin:0 0 8px;font-size:clamp(26px,4vw,38px);letter-spacing:.3px}
.hero p{margin:4px 0;max-width:640px;font-size:14.5px;opacity:.92}
.hero .btns{margin-top:18px;display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-block;border:0;border-radius:10px;padding:10px 18px;font-weight:600;font-size:14px;text-decoration:none}
.btn-primary{background:#fff;color:var(--navy)}
.btn-primary:hover{background:#e8f0fb}
.btn-ghost{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.55)}
.btn-ghost:hover{background:rgba(255,255,255,.14)}
.btn-accent{background:var(--accent);color:#fff}
.btn-accent:hover{filter:brightness(1.1)}
.btn-soft{background:var(--accent-soft);color:var(--accent)}
/* ---------- cards & grids ---------- */
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(270px,1fr))}
.grid.sm{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow)}
.card h3{margin:0 0 6px;font-size:16px}
.card .muted{color:var(--muted);font-size:13px}
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font-size:26px;color:var(--accent)}
.stat span{font-size:12.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
h2.sec{font-size:20px;margin:30px 0 12px;display:flex;align-items:center;gap:10px}
h2.sec::after{content:"";flex:1;height:1px;background:var(--line)}
/* ---------- progress ---------- */
.bar{height:9px;background:var(--line);border-radius:99px;overflow:hidden}
.bar .fill{height:100%;background:linear-gradient(90deg,var(--accent),#4d8fe0);border-radius:99px;transition:width .4s}
.prow{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-bottom:5px}
/* ---------- badges / chips ---------- */
.badge{display:inline-block;background:var(--accent-soft);color:var(--accent);border-radius:20px;padding:2px 10px;font-size:11.5px;font-weight:700;margin-inline-end:6px}
.badge.gold{background:var(--gold-soft);color:var(--gold)}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
/* ---------- lesson lists ---------- */
.lrow{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;box-shadow:var(--shadow)}
.lrow .chk{width:26px;height:26px;flex:0 0 auto;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;color:#fff;margin-top:2px}
.lrow.done .chk{background:var(--ok);border-color:var(--ok)}
.lrow a{color:var(--ink);text-decoration:none;font-weight:600}
.lrow a:hover{color:var(--accent)}
.lrow .muted{font-size:12.5px;color:var(--muted)}
/* ---------- crumbs ---------- */
.crumbs{font-size:12.5px;color:var(--muted);margin-bottom:12px}
.crumbs a{color:var(--muted);text-decoration:none}
.crumbs a:hover{color:var(--accent)}
.crumbs span{margin:0 5px}
/* ---------- lesson page ---------- */
.lhead{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--accent);border-radius:var(--radius);padding:20px 24px;box-shadow:var(--shadow)}
[dir="rtl"] .lhead{border-left:1px solid var(--line);border-right:6px solid var(--accent)}
.lhead h1{margin:4px 0 6px;font-size:clamp(20px,3vw,28px)}
.meta{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:12.5px;margin-top:8px}
.callout{border-radius:12px;padding:13px 17px;margin:14px 0;font-size:14.5px}
.callout .ct{font-weight:800;font-size:12.5px;text-transform:uppercase;letter-spacing:.6px;display:block;margin-bottom:4px}
.c-simple{background:var(--ok-soft);border:1px solid color-mix(in srgb,var(--ok) 35%,transparent)}
.c-simple .ct{color:var(--ok)}
.c-note{background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent)}
.c-note .ct{color:var(--accent)}
.c-warn{background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent)}
.c-warn .ct{color:var(--warn)}
.c-remember{background:var(--gold-soft);border:1px solid color-mix(in srgb,var(--gold) 40%,transparent)}
.c-remember .ct{color:var(--gold)}
section.blk{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 22px;margin:16px 0;box-shadow:var(--shadow)}
section.blk>h2{font-size:17px;margin:0 0 10px;color:var(--accent)}
section.blk h4{margin:14px 0 4px;font-size:14.5px}
/* ---------- formulas ---------- */
.f{background:var(--box);border:1px solid var(--line);border-inline-start:4px solid var(--accent);border-radius:10px;padding:10px 16px;margin:10px 0;font-family:Georgia,"Times New Roman",serif;font-size:17px;overflow-x:auto}
.f b{color:var(--accent)}
.fr{display:inline-block;vertical-align:middle;text-align:center;margin:0 3px}
.fr .top{display:block;border-bottom:1.5px solid currentColor;padding:0 5px 1px}
.fr .bot{display:block;padding:1px 5px 0}
sub,sup{font-size:.68em}
.vars{font-size:13px;color:var(--muted);margin:4px 0 0;padding-inline-start:20px}
.vars li{margin:2px 0}
/* ---------- tables ---------- */
.tblwrap{overflow-x:auto}
table.tbl{border-collapse:collapse;width:100%;font-size:13.5px;margin:10px 0}
.tbl th,.tbl td{border:1px solid var(--line);padding:7px 10px;text-align:start;vertical-align:top}
.tbl th{background:var(--accent-soft);color:var(--accent);font-size:12px;text-transform:uppercase;letter-spacing:.4px}
.tbl td.num,.tbl th.num{text-align:end;font-variant-numeric:tabular-nums}
/* ---------- examples ---------- */
.ex{border:1px solid var(--line);border-radius:12px;margin:12px 0;overflow:hidden}
.ex .exh{background:var(--gold-soft);color:var(--gold);font-weight:700;font-size:13px;padding:9px 15px;border-bottom:1px solid var(--line)}
.ex .exb{padding:12px 16px;font-size:14px}
.ex .step{margin:7px 0}
.ex .step b{color:var(--accent);display:inline-block;min-width:96px}
.ex .ans{background:var(--ok-soft);color:var(--ok);font-weight:800;border-radius:8px;padding:7px 12px;display:inline-block;margin-top:6px}
/* ---------- concept map ---------- */
.flow{display:flex;flex-direction:column;align-items:center;gap:0;margin:12px 0}
.flow .node{background:var(--accent-soft);color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);border-radius:10px;padding:7px 18px;font-weight:600;font-size:13.5px;text-align:center}
.flow .ar{color:var(--muted);font-size:15px;line-height:1.2}
/* ---------- terms ---------- */
.term{border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:8px 0;background:var(--box)}
.term b.t{color:var(--accent);font-size:14.5px}
.term .ar-t{color:var(--gold);font-weight:700}
.term div{font-size:13.5px;margin:3px 0}
/* ---------- tabs ---------- */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}
.tabs button{border:1.5px solid var(--line);background:var(--card);color:var(--muted);border-radius:99px;padding:7px 16px;font-size:13px;font-weight:600}
.tabs button.on{background:var(--accent);border-color:var(--accent);color:#fff}
/* ---------- search overlay ---------- */
.overlay{position:fixed;inset:0;background:rgba(8,15,26,.55);z-index:60;display:flex;justify-content:center;padding:6vh 16px 16px;overflow:auto}
.overlay[hidden]{display:none}
.modal{background:var(--card);border-radius:16px;max-width:680px;width:100%;padding:18px 20px;box-shadow:var(--shadow);max-height:82vh;overflow:auto}
.modal input{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:11px 14px;font:inherit;background:var(--bg);color:var(--ink)}
.sres{margin-top:12px}
.sres .grp{font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:12px 0 4px}
.sres a{display:block;padding:8px 10px;border-radius:8px;color:var(--ink);text-decoration:none;font-size:14px}
.sres a:hover{background:var(--accent-soft)}
.sres a small{color:var(--muted);display:block;font-size:12px}
mark{background:var(--gold-soft);color:var(--gold);border-radius:3px;padding:0 2px}
/* ---------- misc ---------- */
.muted{color:var(--muted)}
.small{font-size:12.5px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spread{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.lessonnav{display:flex;justify-content:space-between;gap:10px;margin-top:18px;flex-wrap:wrap}
.bookmark{background:transparent;border:1.5px solid var(--line);border-radius:9px;padding:6px 12px;color:var(--muted);font-size:13px}
.bookmark.on{color:var(--gold);border-color:var(--gold);background:var(--gold-soft)}
details.rev{border:1px solid var(--line);border-radius:10px;margin:8px 0;background:var(--card)}
details.rev summary{padding:10px 15px;font-weight:600;font-size:14px;cursor:pointer}
details.rev .in{padding:4px 16px 14px}
@media (max-width:900px){
  nav.mainnav{display:none;position:absolute;top:52px;inset-inline:12px;background:var(--navy);border:1px solid rgba(255,255,255,.2);border-radius:12px;padding:10px;flex-direction:column;box-shadow:var(--shadow)}
  nav.mainnav.open{display:flex}
  #menuBtn{display:block}
  .hero{padding:26px 22px}
}
[dir="rtl"] p,[dir="rtl"] li,[dir="rtl"] .f,[dir="rtl"] .ans,[dir="rtl"] td,[dir="rtl"] th,[dir="rtl"] .step,[dir="rtl"] .where{unicode-bidi:plaintext}
[dir="rtl"] .f{text-align:left}
[dir="rtl"] .flip{display:inline-block;transform:scaleX(-1)}
[dir="rtl"] .crumbs span{display:inline-block;transform:scaleX(-1)}
@media print{.topbar,.tabs,.lessonnav,.bookmark{display:none}}
</style>
</head>

 desc:{en:"The field, the goal of the firm, business forms, the five principles of finance, and how finance differs from accounting.",ar:"المجال، هدف المنشأة، أشكال المنشآت، مبادئ التمويل الخمسة، والفرق بين التمويل والمحاسبة."},
 obj:{en:["Define corporate finance and state the goal of the firm","List and explain the five principles of finance","Compare sole proprietorship, partnership and corporation","Distinguish accounting from finance","Calculate earnings per share (EPS)"],

 blocks:[
  {h:{en:"The field of corporate finance",ar:"مجال المالية الإدارية"},p:[
   {en:"Finance is the management of money by individuals (personal finance), companies (corporate finance) and governments (public finance). Corporate finance deals with the financial structure of the company — its mix of debt and equity — and focuses on maximizing shareholders' wealth through short-term and long-term financing plans.",ar:"التمويل هو إدارة الأموال بواسطة الأفراد (تمويل شخصي) والشركات (تمويل المنشآت) والحكومات (المالية العامة). المالية الإدارية تهتم بالهيكل المالي للمنشأة — مزيج الديون وحقوق الملكية — وتركز على تعظيم ثروة المساهمين عبر خطط التمويل قصيرة وطويلة الأجل."},
   {en:"Three areas define the job of the financial manager: capital budgeting (which fixed assets to invest in), capital financing (how to fund projects and operations) and working-capital management (day-to-day liquidity).",ar:"ثلاثة مجالات تحدد عمل المدير المالي: الموازنة الرأسمالية (في أي أصول ثابتة نستثمر)، التمويل الرأسمالي (كيف نمول المشروعات والتشغيل)، وإدارة رأس المال العامل (السيولة اليومية)."}]},
  {h:{en:"Sources of funds and the balance-sheet view",ar:"مصادر الأموال ومنظور الميزانية"},p:[{en:"The balance sheet presents resources (assets) against sources of funds. Sources of money are debt — loans and debt securities — and equity — preferred stocks and common stocks. Short-term financial management deals with current assets and current liabilities; long-term management with long-term assets, debt securities and equity.",ar:"تعرض الميزانية الموارد (الأصول) مقابل مصادر الأموال. ومصادر الأموال هي الدين — القروض وأوراق الدين — والملكية — الأسهم الممتازة والعادية. الإدارة المالية قصيرة الأجل تعنى بالأصول والخصوم المتداولة، وطويلة الأجل بالأصول الطويلة وأوراق الدين والملكية."}]},
  {h:{en:"The goal of the firm",ar:"هدف المنشأة"},p:[
   {en:"The corporate goal is maximizing profit and, above all, shareholders' wealth. Capital management provides sufficient short-term liquidity through debt and equity — but relying on too much debt increases default risk, while relying on too much equity decreases earnings per share.",ar:"هدف المنشأة هو تعظيم الربح وقبل كل شيء ثروة المساهمين. إدارة رأس المال توفر سيولة كافية قصيرة الأجل عبر الديون وحقوق الملكية — لكن الإفراط في الديون يزيد مخاطر التعثر، والإفراط في حقوق الملكية يخفض ربحية السهم."}]},
  {co:"simple",c:{en:"Imagine the firm as a machine. Finance answers three questions: which machines do we buy (budgeting), whose money do we use — ours or the bank's (financing), and how do we keep enough cash in the drawer to operate tomorrow (working capital). All three serve one boss: the shareholders' wealth.",ar:"تخيل المنشأة كآلة. التمويل يجيب عن ثلاثة أسئلة: أي آلات نشتري (الموازنة)، بأموال مَن نعمل — أموالنا أم أموال البنك (التأمين/التمويل)، وكيف نبقي نقدًا كافيًا في الدرج لنعمل غدًا (رأس المال العامل). والثلاثة تخدم سيدًا واحدًا: ثروة المساهمين."}},
  {h:{en:"Forms of business",ar:"أشكال المنشآت"},p:[
   {en:"Ownership, liability and taxation are what separate the legal forms. The corporation is the only form with limited liability, unlimited life and easy access to capital — at the cost of double taxation (earnings taxed at the corporate level, dividends taxed again at the personal level).",ar:"الملكية والمسؤولية والضرائب هي ما يفرّق بين الأشكال القانونية. الشركة المساهمة هي الشكل الوحيد ذو المسؤولية المحدودة والعمر غير المحدود وسهولة الوصول لرأس المال — مقابل ازدواج ضريبي (الأرباح تُضرب على مستوى الشركة، والتوزيعات تُضرب مرة أخرى على مستوى الفرد)."}],
   tb:{h:[{en:"",ar:""},{en:"Sole proprietorship",ar:"منشأة فردية"},{en:"Partnership",ar:"شراكة"},{en:"LP / LLC",ar:"شراكة محدودة / ذ.م.م"},{en:"Corporation",ar:"شركة مساهمة"}],
    r:[[{en:"Owners",ar:"الملاك"},{en:"One",ar:"واحد"},{en:"Two or more",ar:"اثنان فأكثر"},{en:"≥1 GP + limited LPs",ar:"شريك عام واحد على الأقل + شركاء محدودون"},{en:"Shareholders",ar:"مساهمون"}],
       [{en:"Liability",ar:"المسؤولية"},{en:"Unlimited",ar:"غير محدودة"},{en:"Unlimited (each)",ar:"غير محدودة (لكل شريك)"},{en:"GP unlimited, LP limited",ar:"العام غير محدودة والمحدود محدودة"},{en:"Limited",ar:"محدودة"}],

  {h:{en:"Five principles of finance",ar:"المبادئ الخمسة للتمويل"},p:[
   {en:"1) Time value of money — a dollar today is better than a dollar tomorrow. 2) Risk–return trade-off — higher risk requires higher return. 3) Cash flows are the source of value — what matters is the cash that can be taken out of the business. 4) Market prices reflect information — buying and selling moves prices to equilibrium. 5) Individuals respond to incentives — motivation drives decisions.",ar:"١) القيمة الزمنية للنقد — جنيه اليوم خير من جنيه الغد. ٢) مقايضة المخاطرة والعائد — مخاطرة أعلى تتطلب عائدًا أعلى. ٣) التدفقات النقدية مصدر القيمة — المهم هو النقد الذي يمكن سحبه من النشاط. ٤) أسعار السوق تعكس المعلومات — البيع والشراء يوصلان السعر للتوازن. ٥) الأفراد يستجيبون للحوافز — الدوافع تحرك القرارات."}]},
  {h:{en:"Accounting vs finance",ar:"المحاسبة مقابل التمويل"},p:[
   {en:"Accounting looks at the past and present on an accrual basis under IFRS/GAAP. Finance is future-oriented and works on a cash basis: it uses the reports to make strategic decisions about risk, growth and the time value of money.",ar:"المحاسبة تنظر للماضي والحاضر على أساس الاستحقاق وفق المعايير الدولية. أما التمويل فيتجه للمستقبل ويعمل على الأساس النقدي: يستخدم التقارير لاتخاذ قرارات استراتيجية حول المخاطر والنمو والقيمة الزمنية للنقد."}]}],
 concepts:[
  {n:{en:"Shareholder-wealth maximization",ar:"تعظيم ثروة المساهمين"},d:{en:"The overriding corporate goal: management acts to raise the value of the owners' stake (share price), not just accounting profit.",ar:"الهدف الأعلى للمنشأة: الإدارة تعمل لرفع قيمة حصة الملاك (سعر السهم) لا الربح المحاسبي فقط."},w:{en:"Every formula in this course ultimately serves this goal — valuation, budgeting and financing decisions are judged by their effect on owner value.",ar:"كل معادلة في هذا المقرر تخدم هذا الهدف في النهاية — قرارات التقييم والموازنة والتمويل تُقاس بأثرها على قيمة الملاك."}},
  {n:{en:"Cash, not profit, is the source of value",ar:"النقد لا الربح هو مصدر القيمة"},d:{en:"Value comes from cash that can be extracted from the business, which is why finance restates accounting numbers into cash flows.",ar:"القيمة تأتي من النقد القابل للسحب من النشاط، ولهذا يعيد التمويل صياغة الأرقام المحاسبية إلى تدفقات نقدية."},w:{en:"It is the bridge from Lecture 1 to every valuation model later in the course.",ar:"هو الجسر من المحاضرة الأولى إلى كل نماذج التقييم لاحقًا في المقرر."}},
  {n:{en:"Double taxation",ar:"الازدواج الضريبي"},d:{en:"Corporations pay tax on earnings, and shareholders pay tax again on dividends received.",ar:"الشركة تسدد ضريبة على الأرباح، ثم يسدد المساهمون ضريبة أخرى على التوزيعات المستلمة."},w:{en:"It is the main price paid for limited liability and easy access to capital.",ar:"هو الثمن الرئيسي المدفوع مقابل المسؤولية المحدودة وسهولة الوصول لرأس المال."}}],
 terms:[
  {t:{en:"Corporate finance",ar:"المالية الإدارية"},d:{en:"The area of finance dealing with capital structure (debt & equity), focused on maximizing shareholders' wealth through short- and long-term financing plans.",ar:"مجال التمويل المعني بالهيكل الرأسمالي (ديون وملكية)، ويركز على تعظيم ثروة المساهمين بخطط تمويل قصيرة وطويلة الأجل."},s:{en:"How a company gets money and uses it to make owners richer.",ar:"كيف تحصل الشركة على الأموال وتستخدمها لجعل الملاك أغنى."}},
  {t:{en:"Capital budgeting",ar:"الموازنة الرأسمالية"},d:{en:"The decision-making process used to analyze potential investments in fixed assets.",ar:"عملية اتخاذ القرار المستخدمة لتحليل الاستثمارات المحتملة في الأصول الثابتة."},s:{en:"Choosing which big, long-lived purchases are worth making.",ar:"اختيار أي المشتريات الكبيرة طويلة العمر تستحق التنفيذ."}},
  {t:{en:"Capital management",ar:"إدارة رأس المال"},d:{en:"Managing sources of funds (debt & equity) to provide sufficient short-term liquidity for continuing operations.",ar:"إدارة مصادر الأموال (ديون وملكية) لتوفير سيولة قصيرة الأجل كافية لاستمرار التشغيل."},s:{en:"Keeping enough cash to survive today without borrowing too much.",ar:"الإبقاء على نقد كافٍ للنجاة اليوم دون اقتراض مفرط."}},
  {t:{en:"Earnings per share (EPS)",ar:"ربحية السهم"},d:{en:"Net income minus preferred dividends, divided by outstanding common shares.",ar:"صافي الدخل مطروحًا منه أرباح الأسهم الممتازة مقسومًا على الأسهم العادية القائمة."},s:{en:"How much profit belongs to each single share you hold.",ar:"كم من الربح يخص كل سهم واحد تملكه."}}],

 desc:{en:"Where securities trade, who the intermediaries are, and how money moves from investors to borrowers.",ar:"أين تُتداول الأوراق المالية، مَن الوسطاء، وكيف تنتقل الأموال من المستثمرين إلى المقترضين."},
 obj:{en:["Define financial markets and financial services","Identify the main financial institutions","Explain how investors and borrowers meet in the securities markets"],
      ar:["أن تعرّف الأسواق المالية والخدمات المالية","أن تحدد المؤسسات المالية الرئيسية","أن تشرح كيف يلتقي المستثمرون والمقترضون في أسواق الأوراق المالية"]},
 blocks:[
  {h:{en:"The financial marketplace",ar:"السوق المالي"},p:[
   {en:"Financial markets are any marketplace where the trading of securities occurs: stock market, bond market, forex market and derivatives markets. Financial services deal with the design and delivery of advice and financial products to individuals, businesses and governments.",ar:"الأسواق المالية هي أي سوق تتم فيه تداولات الأوراق المالية: سوق الأسهم وسوق السندات وسوق الصرف وأسواق المشتقات. أما الخدمات المالية فتعنى بتصميم وتقديم الاستشارة والمنتجات المالية للأفراد والشركات والحكومات."},
   {en:"The marketplace has two sides. Investors (money supply) exchange cash for financial instruments; borrowers (money demand) obtain financing and repay it with a return. Between them stand the financial institutions.",ar:"للسوق طرفان: المستثمرون (عرض الأموال) يستبدلون النقد بأوراق مالية، والمقترضون (طلب الأموال) يحصلون على التمويل ويسددونه بعائد. وبينهما تقف المؤسسات المالية."}]},
  {h:{en:"Who stands in the middle?",ar:"مَن يقف في المنتصف؟"},p:[
   {en:"Financial institutions: commercial banks, finance companies, insurance companies and investment banks. Investment companies pool money and invest it as a group. Securities markets split into debt markets and stock markets.",ar:"المؤسسات المالية: البنوك التجارية، شركات التمويل، شركات التأمين، وبنوك الاستثمار. شركات الاستثمار تجمع الأموال وتستثمرها كمجموعة. وتنقسم أسواق الأوراق المالية إلى أسواق دين وأسواق أسهم."}]},
  {co:"simple",c:{en:"You have spare cash; a factory needs a new line. Instead of you lending to the factory directly, a bank or a fund takes your money with thousands of others and lends it — you earn a return, the factory gets funds. That middle layer is the financial system.",ar:"لديك فائض نقد؛ ومصنع يحتاج خط إنتاج جديد. بدل أن تقرض المصنع مباشرة، يأخذ بنك أو صندوق أموالك مع آلاف غيرك ويقرضها — فتحصل على عائد ويحصل المصنع على التمويل. تلك الطبقة الوسطى هي النظام المالي."}}],
 concepts:[{n:{en:"Financial intermediation",ar:"الوساطة المالية"},d:{en:"Institutions collect funds from savers and channel them to borrowers, transforming risk, size and maturity.",ar:"تجمع المؤسسات الأموال من المدخرين وتوجّهها للمقترضين مع تحويل المخاطر والحجم والأجل."},w:{en:"It explains why firms can raise huge amounts quickly and why individuals can invest small amounts safely.",ar:"يشرح لماذا تستطيع المنشآت جمع مبالغ ضخمة بسرعة ولماذا يستطيع الأفراد استثمار مبالغ صغيرة بأمان."}}],
 terms:[{t:{en:"Financial markets",ar:"الأسواق المالية"},d:{en:"Any marketplace where the trading of securities occurs (stock, bond, forex, derivatives).",ar:"أي سوق تتم فيه تداولات الأوراق المالية (أسهم، سندات، صرف، مشتقات)."},s:{en:"The meeting place of money and financing needs.",ar:"مكان التقاء الأموال بحاجات التمويل."}},

{id:"l3",ch:"c2",mins:12,title:{en:"Cash Flow & Depreciation",ar:"التدفق النقدي والإهلاك"},
 desc:{en:"The three cash-flow categories, why depreciation matters even though it is not cash, and MACRS depreciation schedules.",ar:"فئات التدفق النقدي الثلاث، ولماذا يهم الإهلاك رغم أنه ليس نقدًا، وجداول إهلاك MACRS."},
 obj:{en:["Classify cash flows as operating, investing or financing","Explain why depreciation is important in cash-flow analysis","Compute yearly depreciation with MACRS rates"],
      ar:["أن تصنف التدفقات النقدية تشغيلية واستثمارية وتمويلية","أن تشرح أهمية الإهلاك في تحليل التدفق النقدي","أن تحسب الإهلاك السنوي بمعدلات MACRS"]},
 blocks:[
  {h:{en:"Cash flow: the manager's primary focus",ar:"التدفق النقدي: التركيز الأساسي للمدير المالي"},p:[
   {en:"Operating flows: cash sales, collecting accounts receivable, tax refunds — against payment of wages, payables, overhead and interest. Investing flows: sale and purchase of fixed assets. Financing flows: sale of stock and borrowing — against buying back stock, paying dividends and repaying debt.",ar:"التدفقات التشغيلية: المبيعات النقدية وتحصيل المدينين واستردادات الضرائب — مقابل سداد الأجور والموردين والمصاريف العمومية والفوائد. الاستثمارية: بيع وشراء الأصول الثابتة. التمويلية: بيع الأسهم والاقتراض — مقابل شراء الأسهم وتوزيع الأرباح وسداد الديون."},
   {en:"These flows are summarized in the statement of cash flows. Two ideas make depreciation central: it is a non-cash charge, and it creates a tax shield (it reduces taxable income, so it reduces tax paid in cash).",ar:"تُلخّص هذه التدفقات في قائمة التدفقات النقدية. فكرتان تجعل الإهلاك محوريًا: أنه مصروف غير نقدي، وأنه يخلق درعًا ضريبيًا (يخفض الوعاء الضريبي فيخفض الضريبة المدفوعة نقدًا)."}]},
  {h:{en:"MACRS depreciation",ar:"الإهلاك بطريقة MACRS"},p:[
   {en:"Under MACRS the percentage of depreciation for each year is stated by the recovery period. For a 5-year asset the rates are 20%, 32%, 19%, 12%, 12% and 5% — note six years of charges for a five-year recovery period.",ar:"وفق MACRS تُحدد نسبة الإهلاك لكل سنة حسب فترة الاسترداد. لأصل عمره 5 سنوات المعدلات: 20% و32% و19% و12% و12% و5% — لاحظ ست سنوات من الإهلاك لفترة استرداد من خمس سنوات."}]},
  {co:"note",c:{en:"Depreciation expense of year t = installed cost × MACRS rate of year t. The rate applies to the original cost every year — never to the remaining book value.",ar:"إهلاك السنة ت = التكلفة التركيبية × معدل MACRS للسنة ت. المعدل يُطبق على التكلفة الأصلية كل سنة — وليس على القيمة الدفترية المتبقية أبدًا."}},
  {co:"simple",c:{en:"Think of depreciation as a paper expense: no cash leaves your pocket, yet it shrinks the profit that gets taxed — so it quietly saves real cash every year. That saving is the tax shield.",ar:"فكّر في الإهلاك كمصروف ورقي: لا نقد يخرج من جيبك، لكنه يصغّر الربح الخاضع للضريبة — فيوفّر نقدًا حقيقيًا كل سنة. هذا التوفير هو الدرع الضريبي."}}],
 concepts:[{n:{en:"Tax shield of depreciation",ar:"الدرع الضريبي للإهلاك"},d:{en:"Depreciation reduces taxable income, so the firm pays less tax in cash even though depreciation itself is not a cash outflow.",ar:"الإهلاك يخفض الوعاء الضريبي فتدفع المنشأة ضريبة نقدية أقل رغم أن الإهلاك نفسه ليس تدفقًا خارجًا نقديًا."},w:{en:"It is why finance adds depreciation back when computing operating cash flow.",ar:"لهذا يضيف التمويل الإهلاك مرة أخرى عند حساب التدفق التشغيلي."}}],
 terms:[{t:{en:"Depreciation",ar:"الإهلاك"},d:{en:"A non-cash charge that allocates the cost of a fixed asset over its recovery period.",ar:"مصروف غير نقدي يوزّع تكلفة الأصل الثابت على فترة استرداده."},s:{en:"An expense on paper that saves real cash through lower taxes.",ar:"مصروف على الورق يوفر نقدًا حقيقيًا عبر ضرائب أقل."}},
  {t:{en:"Tax shield",ar:"الدرع الضريبي"},d:{en:"The cash tax saving produced by deductible charges such as depreciation and interest.",ar:"التوفير النقدي في الضريبة الناتج عن مصروفات قابلة للخصم مثل الإهلاك والفوائد."},s:{en:"The part of your tax bill that a deduction erases.",ar:"جزء من فاتورتك الضريبية يمحوه الخصم."}}],
 formulas:["macrs"],
 examples:[{ti:{en:"MACRS schedule — Baker's machine",ar:"جدول MACRS — آلة بيكر"},
  g:[{en:"Installed cost $100,000; recovery period 5 years; MACRS rates 20/32/19/12/12/5%.",ar:"التكلفة التركيبية 100,000$؛ فترة الاسترداد 5 سنوات؛ معدلات MACRS: 20/32/19/12/12/5%."}],
  rq:{en:"Compute the depreciation expense of each year.",ar:"احسب مصروف الإهلاك لكل سنة."},f:"macrs",
  st:[{en:"Y1 100,000×20% = 20,000 · Y2 ×32% = 32,000 · Y3 ×19% = 19,000",ar:"س1 100,000×20% = 20,000 · س2 ×32% = 32,000 · س3 ×19% = 19,000"},{en:"Y4 ×12% = 12,000 · Y5 ×12% = 12,000 · Y6 ×5% = 5,000",ar:"س4 ×12% = 12,000 · س5 ×12% = 12,000 · س6 ×5% = 5,000"}],
  an:{en:"20,000 / 32,000 / 19,000 / 12,000 / 12,000 / 5,000 — total 100,000 (100%).",ar:"20,000 / 32,000 / 19,000 / 12,000 / 12,000 / 5,000 — المجموع 100,000 (100%)."},
  ip:{en:"The asset is fully depreciated after six charge years; the big early deductions front-load the tax shield.",ar:"يُستهلك الأصل كاملًا بعد ست سنوات إهلاك؛ والخصومات الكبيرة مبكرًا تقدّم الدرع الضريبي زمنيًا."}}],
 mistakes:[{en:"Applying MACRS rates to the remaining book value instead of the installed cost.",ar:"تطبيق معدلات MACRS على القيمة الدفترية المتبقية بدل التكلفة التركيبية."},{en:"Stopping at year 5 — MACRS 5-year property has six depreciation years.",ar:"التوقف عند السنة 5 — أصل MACRS الخمسي له ست سنوات إهلاك."}],
 dist:[],map:[{en:"Sales & collections",ar:"المبيعات والتحصيلات"},{en:"Operating cash flow",ar:"التدفق التشغيلي"},{en:"− Investing & financing flows",ar:"− تدفقات استثمارية وتمويلية"},{en:"Statement of cash flows",ar:"قائمة التدفقات النقدية"}],
 sum:{ideas:[{en:"Cash flows: operating, investing, financing.",ar:"التدفقات النقدية: تشغيلية واستثمارية وتمويلية."},{en:"Depreciation is a non-cash charge with a real tax shield.",ar:"الإهلاك مصروف غير نقدي له درع ضريبي حقيقي."},{en:"MACRS 5-year rates: 20/32/19/12/12/5 applied to installed cost.",ar:"معدلات MACRS الخمسية: 20/32/19/12/12/5 تُطبق على التكلفة التركيبية."}],
  terms:[{en:"Depreciation",ar:"الإهلاك"},{en:"Tax shield",ar:"الدرع الضريبي"},{en:"MACRS",ar:"MACRS"}],f:["macrs"],
  rem:[{en:"Rates multiply the original installed cost, every year.",ar:"المعدلات تضرب التكلفة التركيبية الأصلية كل سنة."}],
  exam:[{en:"MACRS table computation is a classic quiz question (Quiz I covers cash flow).",ar:"حساب جدول MACRS سؤال كلاسيكي في الاختبارات (الاختبار الأول يغطي التدفق النقدي)."}]}},
{id:"l4",ch:"c2",mins:15,title:{en:"Operating Cash Flow & Free Cash Flow",ar:"التدفق النقدي التشغيلي والتدفق الحر"},
 desc:{en:"NOPAT, OCF, and the free cash flow available after investing in fixed assets and working capital — with Baker Corporation.",ar:"NOPAT والتدفق التشغيلي والتدفق الحر المتبقي بعد الاستثمار في الأصول الثابتة ورأس المال العامل — مع شركة بيكر."},
 obj:{en:["Compute NOPAT and operating cash flow (OCF)","Compute net fixed asset investment (NFAI) and net current asset investment (NCAI)","Derive free cash flow (FCF) and interpret it"],
      ar:["حساب NOPAT والتدفق النقدي التشغيلي (OCF)","حساب صافي الاستثمار في الأصول الثابتة (NFAI) وصافي الاستثمار في الأصول المتداولة (NCAI)","استخراج التدفق النقدي الحر (FCF) وتفسيره"]},
 blocks:[
  {h:{en:"From EBIT to operating cash flow",ar:"من EBIT إلى التدفق التشغيلي"},p:[
   {en:"NOPAT is earnings before interest and taxes after tax: NOPAT = EBIT × (1 − T). Adding back the non-cash depreciation gives operating cash flow: OCF = EBIT × (1 − T) + Depreciation.",ar:"NOPAT هو الربح قبل الفوائد والضرائب بعد الضريبة: NOPAT = EBIT × (1 − T). وبإضافة الإهلاك غير النقدي نحصل على التدفق التشغيلي: OCF = EBIT × (1 − T) + الإهلاك."}]},
  {h:{en:"Free cash flow",ar:"التدفق النقدي الحر"},p:[
   {en:"FCF is what remains for investors after the firm funds its growth: FCF = OCF − NFAI − NCAI, where NFAI = change in net fixed assets + depreciation, and NCAI = change in current assets − change in accounts payable and accruals.",ar:"التدفق الحر هو ما يتبقى للمستثمرين بعد أن تموّل المنشأة نموها: FCF = OCF − NFAI − NCAI، حيث NFAI = التغير في صافي الأصول الثابتة + الإهلاك، وNCAI = التغير في الأصول المتداولة − التغير في الموردين والمصروفات المستحقة."}]},
  {co:"simple",c:{en:"OCF is the cash the business engine produces. But the engine also needs new machines (NFAI) and extra stock in the warehouse (NCAI). What is left after feeding those two is free cash flow — the cash owners and lenders can actually take.",ar:"التدفق التشغيلي هو النقد الذي ينتجه محرك النشاط. لكن المحرك يحتاج آلات جديدة (NFAI) ومخزونًا إضافيًا في المستودع (NCAI). ما يتبقى بعد إطعام هذين هو التدفق الحر — النقد الذي يمكن للملاك والمقرضين أخذه فعلًا."}}],
 concepts:[{n:{en:"Free cash flow (FCF)",ar:"التدفق النقدي الحر"},d:{en:"Operating cash flow minus the investments needed in fixed assets and working capital.",ar:"التدفق التشغيلي مطروحًا منه الاستثمارات اللازمة في الأصول الثابتة ورأس المال العامل."},w:{en:"It is the cash truly available to pay lenders and owners — the core of valuation.",ar:"هو النقد المتاح فعليًا لسداد المقرضين والملاك — جوهر التقييم."}}],
 terms:[{t:{en:"NOPAT",ar:"NOPAT"},d:{en:"Net operating profit after taxes: EBIT × (1 − T).",ar:"صافي الربح التشغيلي بعد الضرائب: EBIT × (1 − T)."},s:{en:"Profit the operations earned after tax, ignoring how they were financed.",ar:"ربح النشاط بعد الضريبة متجاهلًا طريقة تمويله."}},
  {t:{en:"Operating cash flow (OCF)",ar:"التدفق النقدي التشغيلي"},d:{en:"NOPAT plus depreciation — the cash generated by operations.",ar:"NOPAT زائد الإهلاك — النقد المولّد من التشغيل."},s:{en:"Real cash the business produced this period.",ar:"النقد الحقيقي الذي أنتجه النشاط هذه الفترة."}},
  {t:{en:"Free cash flow (FCF)",ar:"التدفق النقدي الحر"},d:{en:"OCF minus net fixed asset investment and net current asset investment.",ar:"التدفق التشغيلي ناقص صافي الاستثمار في الأصول الثابتة وصافي الاستثمار في المتداولة."},s:{en:"Cash left over after the firm feeds its own growth.",ar:"النقد المتبقي بعد أن تغذي المنشأة نموها الذاتي."}}],
 formulas:["nopat","ocf_u","fcf","nfai","ncai"],
 examples:[{ti:{en:"Baker Corporation — full FCF",ar:"شركة بيكر — التدفق الحر كاملًا"},
  g:[{en:"EBIT $370; tax 40%; depreciation $100; net fixed assets 1,000 → 1,200; current assets 1,900 → 2,000; A/P & accruals 700 → 800 (all $000).",ar:"EBIT = 370$؛ الضريبة 40%؛ الإهلاك 100$؛ صافي الأصول الثابتة 1,000 ← 1,200؛ المتداولة 1,900 ← 2,000؛ الموردون والمستحقات 700 ← 800 (بالألف $)."}],
  rq:{en:"Compute OCF, NFAI, NCAI and FCF.",ar:"احسب OCF وNFAI وNCAI وFCF."},f:"ocf_u",
  st:[{en:"OCF = 370 × (1 − .40) + 100 = 222 + 100 = 322",ar:"OCF = 370 × (1 − .40) + 100 = 222 + 100 = 322"},
      {en:"NFAI = (1,200 − 1,000) + 100 = 300",ar:"NFAI = (1,200 − 1,000) + 100 = 300"},
      {en:"NCAI = (2,000 − 1,900) − (800 − 700) = 100 − 100 = 0",ar:"NCAI = (2,000 − 1,900) − (800 − 700) = 100 − 100 = 0"},
      {en:"FCF = 322 − 300 − 0",ar:"FCF = 322 − 300 − 0"}],

{id:"l5",ch:"c2",mins:12,title:{en:"FCFF & Cash-Flow Ratios",ar:"التدفق الحر للمنشأة ونسب التدفق النقدي"},
 desc:{en:"Free cash flow to the firm from the income statement and balance sheet, levered vs unleveled OCF, and the margin & coverage ratios.",ar:"التدفق النقدي الحر للمنشأة من قائمة الدخل والميزانية، والفرق بين OCF الممول وغير الممول، ونسبتا الهامش والتغطية."},
 obj:{en:["Compute FCFF from net income, depreciation, interest, capex and working capital","Distinguish levered from unlevered operating cash flow","Interpret cash-flow margin and cash-flow coverage"],
      ar:["حساب FCFF من صافي الدخل والإهلاك والفوائد والإنفاق الرأسمالي ورأس المال العامل","التمييز بين التدفق التشغيلي الممول وغير الممول","تفسير هامش التدفق النقدي وتغطية التدفق النقدي"]},
 blocks:[
  {h:{en:"Free cash flow to the firm (FCFF)",ar:"التدفق النقدي الحر للمنشأة (FCFF)"},p:[
   {en:"FCFF = Net income + Depreciation + [Interest × (1 − Tax rate)] − Fixed-asset investment − Changes in working capital. It measures the cash available for both debt and equity holders and for re-investment.",ar:"FCFF = صافي الدخل + الإهلاك + [الفوائد × (1 − معدل الضريبة)] − الاستثمار في الأصول الثابتة − التغيرات في رأس المال العامل. يقيس النقد المتاح لحملة الديون وحقوق الملكية معًا وللإعادة استثمار."},
   {en:"Interest is added back after tax because FCFF belongs to all capital providers, so the tax-deducted cost of debt must be neutralized.",ar:"تُضاف الفوائد بعد الضريبة لأن FCFF ملك لكل مقدمي رأس المال، لذا يجب تحييد تكلفة الدين بعد خصم الضريبة."},{en:"The slides also criticize the earlier FCF chain: it repeats depreciation (inside OCF and again inside NFAI) and seems to neglect interest payments — the FCFF form corrects both.",ar:"تنتقد الشرائح أيضًا سلسلة FCF السابقة: فهي تكرّر الإهلاك (داخل OCF ثم داخل NFAI مجددًا) ويبدو أنها تُغفل مدفوعات الفوائد — وصيغة FCFF تصحح الأمرين."}]},
  {h:{en:"Levered vs unlevered OCF",ar:"التدفق التشغيلي الممول وغير الممول"},p:[
   {en:"Levered OCF = net income after tax + depreciation: it considers interest payments and debt servicing. Unlevered OCF = EBIT(1 − T) + depreciation: cash available to all capital providers before debt and equity.",ar:"التدفق الممول = صافي الدخل بعد الضريبة + الإهلاك: يضع في الاعتبار سداد الفوائد والدين. غير الممول = EBIT(1−T) + الإهلاك: النقد المتاح لكل مقدمي رأس المال قبل الديون والملكية."}]},
  {h:{en:"Cash-flow ratios",ar:"نسب التدفق النقدي"},p:[
   {en:"Cash-flow margin = OCF / sales revenue — how much cash the company generates from its revenues. Cash-flow coverage = OCF / total debt — the ability to repay total debt from operating cash, i.e. how many years repayment would take.",ar:"هامش التدفق النقدي = OCF ÷ إيرادات المبيعات — كم نقدًا تولد المنشأة من إيراداتها. تغطية التدفق النقدي = OCF ÷ إجمالي الديون — القدرة على سداد إجمالي الدين من نقد التشغيل، أي كم سنة يستغرق السداد."},
   {en:"Reading the margin: high = strong cash conversion, average = average conversion, negative = operations consume cash. Coverage: high (&gt;1 ⇒ debt repaid in under a year), 0.1–0.3 acceptable, &lt;0.1 low, negative = financial risk.",ar:"قراءة الهامش: مرتفع = تحويل نقدي قوي، متوسط = تحويل متوسط، سالب = التشغيل يستهلك النقد. التغطية: مرتفعة (&gt;1 ⇒ سداد الدين في أقل من سنة)، 0.1–0.3 مقبولة، &lt;0.1 منخفضة، سالبة = خطر مالي."}]},
  {co:"simple",c:{en:"FCFF answers one question: after paying for new machines and extra working capital, how much cash is left for everyone who funded the firm — the bank and the owners together?",ar:"FCFF يجيب عن سؤال واحد: بعد دفع ثمن الآلات الجديدة ورأس المال العامل الإضافي، كم نقدًا يتبقى لكل من موّل المنشأة — البنك والملاك معًا؟"}}],
 concepts:[{n:{en:"FCFF",ar:"التدفق الحر للمنشأة"},d:{en:"Cash available to all capital providers (debt + equity) after re-investment needs.",ar:"النقد المتاح لكل مقدمي رأس المال (دين + ملكية) بعد حاجات إعادة الاستثمار."},w:{en:"It is the cleanest measure of what the whole firm generates — the base of firm valuation.",ar:"أنظف مقياس لما تولده المنشأة ككل — أساس تقييم المنشأة."}}],
 terms:[{t:{en:"FCFF",ar:"التدفق الحر للمنشأة"},d:{en:"Free cash flow to the firm: cash for debt holders, equity holders and re-investment.",ar:"النقد المتاح لحملة الديون وحقوق الملكية وإعادة الاستثمار."},s:{en:"The whole pie before splitting it between bank and owners.",ar:"الفطيرة كاملة قبل تقسيمها بين البنك والملاك."}},
  {t:{en:"Cash-flow coverage",ar:"تغطية التدفق النقدي"},d:{en:"OCF divided by total debt; indicates ability to repay debt from operations.",ar:"OCF مقسومًا على إجمالي الدين؛ يبين القدرة على سداد الدين من التشغيل."},s:{en:"How many years of operating cash would clear the debt.",ar:"كم سنة من نقد التشغيل تمحو الدين."}}],
 formulas:["fcff","ocf_l","cf_margin","cf_cov"],
 examples:[{ti:{en:"FCFF — direct data",ar:"FCFF — بيانات مباشرة"},

  rq:{en:"Calculate FCFF for 2024.",ar:"احسب FCFF لعام 2024."},f:"fcff",

      {en:"ΔWC = (440,000 − 180,000) − (350,000 − 150,000) = 260,000 − 200,000 = 60,000",ar:"ΔWC = (440,000 − 180,000) − (350,000 − 150,000) = 260,000 − 200,000 = 60,000"},

  ip:{en:"After heavy expansion (250k capex, 60k working capital) the firm still frees 70k for its capital providers.",ar:"بعد توسع كثيف (250 ألف إنفاق رأسمالي و60 ألف رأس مال عامل) تفرغ المنشأة 70 ألفًا لمقدمي رأس المال."}}],
 mistakes:[{en:"Adding interest pre-tax — the add-back must be Interest × (1 − T).",ar:"إضافة الفوائد قبل الضريبة — الإضافة يجب أن تكون الفوائد × (1 − الضريبة)."},{en:"Confusing levered with unlevered OCF: levered starts from net income (after interest), unlevered from EBIT.",ar:"الخلط بين OCF الممول وغير الممول: الممول يبدأ من صافي الدخل (بعد الفوائد) وغير الممول من EBIT."}],
 dist:[{ti:{en:"Levered vs Unlevered OCF",ar:"التدفق التشغيلي الممول مقابل غير الممول"},c1:{en:"Levered",ar:"ممول"},c2:{en:"Unlevered",ar:"غير ممول"},

        [{en:"Considers interest & debt servicing",ar:"يراعي الفوائد وخدمة الدين"},{en:"Before debt and equity claims",ar:"قبل مطالب الديون والملكية"}]],

{id:"l6",ch:"c3",mins:18,title:{en:"The Cash Budget",ar:"الموازنة النقدية"},
 desc:{en:"Forecast receipts, schedule disbursements, and find each month's financing need or excess cash — the complete Halley example.",ar:"توقع المقبوضات وجدول المدفوعات وحدد حاجة التمويل أو الفائض النقدي لكل شهر — مثال هالي الكامل."},
 obj:{en:["Build the cash-receipts schedule from a collection pattern","Build the cash-disbursements schedule from a payment pattern","Determine net cash flow, ending cash, required financing and excess cash"],
      ar:["إعداد جدول المقبوضات النقدية من نمط التحصيل","إعداد جدول المدفوعات النقدية من نمط السداد","تحديد صافي التدفق والنقد الختامي والتمويل المطلوب والفائض النقدي"]},
 blocks:[
  {h:{en:"Why a cash budget?",ar:"لماذا الموازنة النقدية؟"},p:[
   {en:"Financial planning has two wings: cash planning (the cash budget) and profit planning (pro-forma financial statements). The cash budget indicates the extent to which cash shortages or surpluses are expected in each month of the forecast.",ar:"للتخطيط المالي جناحان: التخطيط النقدي (الموازنة النقدية) والتخطيط للربح (القوائم المالية التخطيطية). الموازنة النقدية تبين حجم العجز أو الفائض النقدي المتوقع في كل شهر من التوقع."}]},
  {h:{en:"Step 1 — Cash receipts",ar:"الخطوة ١ — المقبوضات النقدية"},p:[
   {en:"Split each month's sales into the cash portion and the lagged collections (1 month, 2 months), then add other receipts such as dividends received.",ar:"قسّم مبيعات كل شهر إلى الجزء النقدي والتحصيلات المؤجلة (شهر، شهران)، ثم أضف المقبوضات الأخرى مثل أرباح الأسهم المستلمة."}]},
  {h:{en:"Step 2 — Cash disbursements",ar:"الخطوة ٢ — المدفوعات النقدية"},p:[
   {en:"Purchases are a percentage of sales and are paid with their own lag pattern; then add rent, wages and salaries, taxes, fixed-asset outlays, interest, dividends paid and loan principal.",ar:"المشتريات نسبة من المبيعات تُسد بنمط تأخير خاص؛ ثم أضف الإيجار والأجور والرواتب والضرائب والإنفاق على الأصول الثابتة والفوائد والتوزيعات المسددة وأصل القرض."}]},
  {h:{en:"Step 3 — The financing position",ar:"الخطوة ٣ — مركز التمويل"},p:[
   {en:"Net cash flow = receipts − disbursements. Ending cash = net cash flow + beginning cash. Compare ending cash with the required minimum: below it ⇒ required total financing (notes payable); above it ⇒ excess cash balance invested in marketable securities.",ar:"صافي التدفق = المقبوضات − المدفوعات. النقد الختامي = صافي التدفق + النقد الابتدائي. قارن الختامي بالحد الأدنى المطلوب: أقل منه ⇒ إجمالي التمويل المطلوب (أوراق دفع)؛ أعلى منه ⇒ فائض نقدي يُستثمر في أوراق مالية قابلة للتداول."}]},
  {co:"simple",c:{en:"A cash budget is your personal bank statement from the future: what will come in, what will go out, and whether the balance dips below your safety line — so you arrange a loan (or an investment) before the hole appears.",ar:"الموازنة النقدية كشف حساب بنكي من المستقبل: ما سيدخل، وما سيخرج، وهل سينزل الرصيد تحت خط الأمان — فتدبّر قرضًا (أو استثمارًا) قبل ظهور الحفرة."}}],
 concepts:[{n:{en:"Required total financing",ar:"إجمالي التمويل المطلوب"},d:{en:"The borrowing (notes payable) needed when ending cash falls below the minimum required balance.",ar:"الاقتراض (أوراق الدفع) اللازم حين ينزل النقد الختامي تحت الحد الأدنى المطلوب."},w:{en:"It tells the treasurer how much credit to arrange and in which month.",ar:"يخبر أمين الصندوق بحجم الائتمان اللازم وفي أي شهر."}},
  {n:{en:"Excess cash balance",ar:"الفائض النقدي"},d:{en:"Ending cash above the minimum, assumed invested in marketable securities.",ar:"النقد الختامي فوق الحد الأدنى، ويُفترض استثماره في أوراق مالية قابلة للتداول."},w:{en:"Idle cash earns nothing; the budget decides when to put it to work.",ar:"النقد المعطل لا يكسب شيئًا؛ الموازنة تقرر متى نشغّله."}}],
 terms:[{t:{en:"Cash budget",ar:"الموازنة النقدية"},d:{en:"A forecast of cash receipts, disbursements and the resulting financing position over future months.",ar:"توقع للمقبوضات والمدفوعات النقدية ومركز التمويل الناتج عبر الشهور القادمة."},s:{en:"A month-by-month plan of cash in and cash out.",ar:"خطة شهر بشهر للنقد الداخل والخارج."}},
  {t:{en:"Pro-forma statements",ar:"القوائم التخطيطية"},d:{en:"Projected financial statements used for profit planning.",ar:"قوائم مالية متوقعة تستخدم للتخطيط للربح."},s:{en:"Tomorrow's financial statements, drafted today.",ar:"قوائم الغد المالية تُصاغ اليوم."}}],
 formulas:["cb_net","cb_end"],
 examples:[{ti:{en:"Halley Co. — Oct to Dec ($000)",ar:"شركة هالي — أكتوبر إلى ديسمبر (بالألف $)"},
  g:[{en:"Sales: Aug 100, Sep 200, Oct 400, Nov 300, Dec 200. Collections: 20% cash, 50% after 1 month, 30% after 2 months. Dec: +30 dividend received. Purchases = 70% of sales, paid 10% cash, 70% after 1 month, 20% after 2 months. Rent 5/month; wages 48/38/28; taxes 25 in Dec; capital assets 130 in Nov; interest 10 in Dec; dividends paid 20 in Oct; loan principal 20 in Dec. Minimum cash 25; beginning cash Oct 50.",ar:"المبيعات: أغسطس 100، سبتمبر 200، أكتوبر 400، نوفمبر 300، ديسمبر 200. التحصيل: 20% نقدًا، 50% بعد شهر، 30% بعد شهرين. ديسمبر: +30 أرباح مستلمة. المشتريات = 70% من المبيعات تُسد 10% نقدًا و70% بعد شهر و20% بعد شهرين. إيجار 5/شهر؛ أجور 48/38/28؛ ضرائب 25 في ديسمبر؛ أصول رأسمالية 130 في نوفمبر؛ فوائد 10 في ديسمبر؛ توزيعات مسددة 20 في أكتوبر؛ أصل قرض 20 في ديسمبر. الحد الأدنى للنقد 25؛ النقد الابتدائي لأكتوبر 50."}],
  rq:{en:"Prepare the cash budget and state the financing decision of each month.",ar:"أعد الموازنة النقدية وبيّن قرار التمويل لكل شهر."},f:"cb_net",
  st:[{en:"Receipts: Oct 210 (80 cash + 100 + 30 lags) · Nov 320 · Dec 340 (incl. +30 dividend)",ar:"المقبوضات: أكتوبر 210 (80 نقدًا + 100 + 30 مؤجلات) · نوفمبر 320 · ديسمبر 340 (تشمل +30 أرباحًا)"},
      {en:"Disbursements: Oct 213 · Nov 418 (incl. 130 capex) · Dec 305",ar:"المدفوعات: أكتوبر 213 · نوفمبر 418 (تشمل 130 إنفاقًا رأسماليًا) · ديسمبر 305"},
      {en:"Net CF: (3) / (98) / 35 → Ending: 47 / (51) / (16) after chaining beginning cash 50 → 47 → (51)",ar:"صافي التدفق: (3) / (98) / 35 ← الختامي: 47 / (51) / (16) بعد ترحيل النقد الابتدائي 50 ← 47 ← (51)"},
      {en:"vs minimum 25 → Oct excess 22 · Nov financing 76 · Dec financing 41",ar:"مقابل الحد الأدنى 25 ← فائض أكتوبر 22 · تمويل نوفمبر 76 · تمويل ديسمبر 41"}],
  an:{en:"Oct: invest excess 22 in marketable securities. Nov: finance 76. Dec: finance 41 (notes payable).",ar:"أكتوبر: استثمار الفائض 22 في أوراق مالية. نوفمبر: تمويل 76. ديسمبر: تمويل 41 (أوراق دفع)."},
  ip:{en:"The budget converts a sales forecast into concrete borrowing decisions before the cash actually runs out.",ar:"تحول الموازنة توقع المبيعات إلى قرارات اقتراض ملموسة قبل نفاد النقد فعليًا."}},
  {ti:{en:"Quick quarter — Q1 2025",ar:"ربع سريع — الربع الأول 2025"},
  g:[{en:"Beginning cash 50; minimum 25. Receipts 420/640/680; disbursements 426/836/610 for Jan/Feb/Mar.",ar:"النقد الابتدائي 50؛ الحد الأدنى 25. المقبوضات 420/640/680 والمدفوعات 426/836/610 يناير/فبراير/مارس."}],
  rq:{en:"Compute ending cash, required financing and excess cash.",ar:"احسب النقد الختامي والتمويل المطلوب والفائض."},f:"cb_end",

{id:"l7",ch:"c4",mins:10,title:{en:"Common-Size & Trend Analysis",ar:"التحليل بالمقاس المشترك وتحليل الاتجاهات"},
 desc:{en:"Vertical analysis (everything as a % of a base) and horizontal analysis (change over time), with the course's computations.",ar:"التحليل الرأسي (كل بند نسبةً إلى أساس) والتحليل الأفقي (التغير عبر الزمن) مع حسابات المقرر."},
 obj:{en:["Compute common-size percentages for income statement and balance sheet items","Compute percent change in trend analysis","Interpret what each analysis reveals"],
      ar:["حساب نسب المقاس المشترك لبنود قائمة الدخل والميزانية","حساب نسبة التغير في تحليل الاتجاهات","تفسير ما يكشفه كل تحليل"]},
 blocks:[
  {h:{en:"Common-size (vertical) analysis",ar:"التحليل بالمقاس المشترك (الرأسي)"},p:[
   {en:"Financial statement analysis is the process of analyzing the company's financial statements for decision-making; its purpose is to assess the firm's financial condition and performance the way an outside investor would.",ar:"تحليل القوائم المالية هو عملية تحليل قوائم المنشأة بغرض اتخاذ القرار، وهدفه تقييم وضعها المالي وأدائها كما يقيّمه مستثمر خارجي."},
   {en:"Each line item is expressed as a percentage of a base: total revenues for the income statement, total assets for the balance sheet. It evaluates the company's internal structure and lets you compare performance against competitors or benchmarks.",ar:"يُعبر عن كل بند كنسبة من أساس: إجمالي الإيرادات لقائمة الدخل، وإجمالي الأصول للميزانية. يقيّم البنية الداخلية للمنشأة ويتيح مقارنة الأداء بالمنافسين أو بالمعايير."}]},
  {h:{en:"Trend (horizontal) analysis",ar:"تحليل الاتجاهات (الأفقي)"},p:[
   {en:"Compares the change in a specific line item from one year to another: percent change = dollar change ÷ base-year amount × 100, where dollar change = analysis-year amount − base-year amount.",ar:"يقارن التغير في بند محدد من سنة لأخرى: نسبة التغير = التغير بالدولار ÷ مبلغ سنة الأساس × 100، حيث التغير بالدولار = مبلغ سنة التحليل − مبلغ سنة الأساس."}]},
  {co:"simple",c:{en:"Common-size turns every number into a slice of a 100-piece pie, so a small company and a giant can be compared fairly. Trend simply watches one slice grow or shrink year after year.",ar:"المقاس المشترك يحوّل كل رقم إلى شريحة من فطيرة من 100 قطعة، فيصبح مقارنة شركة صغيرة بعملاقة عادلة. والاتجاه يراقب شريحة واحدة تكبر أو تصغر سنة بعد سنة."}}],
 concepts:[{n:{en:"Vertical vs horizontal lenses",ar:"العدستان الرأسية والأفقية"},d:{en:"Common-size shows structure inside one year; trend shows movement across years.",ar:"المقاس المشترك يظهر البنية داخل سنة واحدة؛ والاتجاه يظهر الحركة عبر السنين."},w:{en:"Together they answer 'what is inside?' and 'where is it going?'",ar:"معًا يجيبان عن «ما الداخل؟» و«إلى أين يتجه؟»."}}],
 terms:[{t:{en:"Common-size analysis",ar:"تحليل المقاس المشترك"},d:{en:"Expressing each line item as a percentage of total revenues (income statement) or total assets (balance sheet).",ar:"التعبير عن كل بند كنسبة من إجمالي الإيرادات (الدخل) أو إجمالي الأصول (الميزانية)."},s:{en:"Shrinking every number to a slice of a 100% pie.",ar:"تصغير كل رقم إلى شريحة من فطيرة 100%."}},
  {t:{en:"Trend analysis",ar:"تحليل الاتجاهات"},d:{en:"Comparing the change of a line item from a base year to an analysis year in percent.",ar:"مقارنة تغير بند من سنة أساس إلى سنة تحليل بالنسبة المئوية."},s:{en:"Watching one number grow or shrink over time.",ar:"مراقبة رقم واحد يكبر أو يصغر مع الزمن."}}],
 formulas:["cs_pct","trend_pct"],
 examples:[{ti:{en:"Common-size computations",ar:"حسابات المقاس المشترك"},
  g:[{en:"COGS 98,432; total revenues 218,739. Total equity 344,373; total assets 365,389.",ar:"تكلفة المبيعات 98,432؛ إجمالي الإيرادات 218,739. إجمالي الحقوق 344,373؛ إجمالي الأصول 365,389."}],
  rq:{en:"Express COGS and equity as common-size percentages.",ar:"عبّر عن تكلفة المبيعات والحقوق كنسب مقاس مشترك."},f:"cs_pct",
  st:[{en:"COGS% = 98,432 / 218,739 × 100",ar:"نسبة تكلفة المبيعات = 98,432 ÷ 218,739 × 100"},{en:"Equity/TA = 344,373 / 365,389 × 100",ar:"الحقوق/الأصول = 344,373 ÷ 365,389 × 100"}],
  an:{en:"COGS = 45% of revenues · Equity = 94.2% of assets",ar:"تكلفة المبيعات = 45% من الإيرادات · الحقوق = 94.2% من الأصول"},
  ip:{en:"45% of every revenue dollar is consumed by COGS; the firm is financed almost entirely by equity.",ar:"45% من كل دولار إيرادات تلتهمه تكلفة المبيعات؛ والمنشأة ممولة تقريبًا بالكامل بحقوق الملكية."}},
  {ti:{en:"Trend computations",ar:"حسابات الاتجاهات"},
  g:[{en:"Cash 224,399 → 261,248. Net income 15 → 25 (million). Retained earnings 65 → 67 (million).",ar:"النقد 224,399 ← 261,248. صافي الدخل 15 ← 25 (مليون). الأرباح المحتجزة 65 ← 67 (مليون)."}],
  rq:{en:"Compute the percent change of each item.",ar:"احسب نسبة التغير لكل بند."},f:"trend_pct",
  st:[{en:"Cash: (261,248 − 224,399)/224,399 = 16.4%",ar:"النقد: (261,248 − 224,399)÷224,399 = 16.4%"},{en:"NI: (25 − 15)/15 = 66.6% · RE: (67 − 65)/65 = 3.07%",ar:"صافي الدخل: (25 − 15)÷15 = 66.6% · المحتجزة: (67 − 65)÷65 = 3.07%"}],
  an:{en:"Cash +16.4% · Net income +66.6% · Retained earnings +3.07%",ar:"النقد +16.4% · صافي الدخل +66.6% · المحتجزة +3.07%"},
  ip:{en:"Gross profit and net income up substantially (gross profit +17.1%, net income +26.5% in the course case) — a favorable profit trend.",ar:"مجمل الربح وصافي الدخل مرتفعان بقوة (+17.1% و+26.5% في حالة المقرر) — اتجاه ربحي مواتٍ."}}],
 mistakes:[{en:"Using the analysis year as denominator — the base year is always the denominator.",ar:"استخدام سنة التحليل مقامًا — سنة الأساس هي المقام دائمًا."},{en:"Mixing bases: income-statement items use total revenues, balance-sheet items use total assets.",ar:"خلط الأسس: بنود الدخل تستخدم إجمالي الإيرادات وبنود الميزانية تستخدم إجمالي الأصول."}],
 dist:[],map:[],
 sum:{ideas:[{en:"Common-size % = item ÷ base × 100 (revenues or assets).",ar:"نسبة المقاس المشترك = البند ÷ الأساس × 100 (الإيرادات أو الأصول)."},{en:"Trend % = (analysis year − base year) ÷ base year × 100.",ar:"نسبة الاتجاه = (سنة التحليل − سنة الأساس) ÷ سنة الأساس × 100."}],
  terms:[{en:"Common-size",ar:"المقاس المشترك"},{en:"Trend analysis",ar:"تحليل الاتجاهات"}],f:["cs_pct","trend_pct"],
  rem:[{en:"Base year in the denominator — always.",ar:"سنة الأساس في المقام — دائمًا."}],
  exam:[{en:"Both formulas are one-line computation questions.",ar:"كلتا المعادلتين سؤال حساب من سطر واحد."}]}},
{id:"l8",ch:"c4",mins:18,title:{en:"Ratio Analysis",ar:"تحليل النسب"},
 desc:{en:"The complete ratio toolkit — liquidity, efficiency, solvency, profitability — applied to the ABC Co. case.",ar:"عدة النسب الكاملة — السيولة والكفاءة والملاءة والربحية — مطبقة على حالة شركة ABC."},
 obj:{en:["Compute liquidity, efficiency, solvency and profitability ratios","Interpret each ratio against its rule of thumb","Apply the full toolkit to a complete case"],
      ar:["حساب نسب السيولة والكفاءة والملاءة والربحية","تفسير كل نسبة مقابل قاعدتها الإرشادية","تطبيق العدة الكاملة على حالة متكاملة"]},
 blocks:[
  {h:{en:"Liquidity — can we pay tomorrow's bills?",ar:"السيولة — هل نسدد فواتير الغد؟"},p:[
   {en:"Current ratio = current assets ÷ current liabilities. Quick (acid-test) ratio = (cash + short-term investments + accounts receivable) ÷ current liabilities — it excludes inventory. Cash ratio = cash or cash equivalents ÷ current liabilities. A value of 1.0 or more means the company has enough assets to cover short-term liabilities (without selling inventory, for the quick ratio).",ar:"نسبة التداول = الأصول المتداولة ÷ الخصوم المتداولة. النسبة السريعة = (النقد + الاستثمارات القصيرة + المدينون) ÷ الخصوم المتداولة — تستبعد المخزون. النسبة النقدية = النقد وما يعادله ÷ الخصوم المتداولة. قيمة 1.0 فأكثر تعني كفاية الأصول لتغطية الخصوم القصيرة (دون بيع المخزون في السريعة)."}]},
  {h:{en:"Efficiency — how well do we run things?",ar:"الكفاءة — كم نحسن التشغيل؟"},p:[
   {en:"A/R turnover = net credit sales ÷ average net A/R (higher = efficient collection). Inventory turnover = COGS ÷ average inventory (higher = efficient inventory management).",ar:"دوران المدينين = صافي المبيعات الآجلة ÷ متوسط صافي المدينين (الأعلى = تحصيل كفء). دوران المخزون = تكلفة المبيعات ÷ متوسط المخزون (الأعلى = إدارة مخزون كفء)."}]},
  {h:{en:"Solvency — can we survive the long run?",ar:"الملاءة — هل ننجو على المدى الطويل؟"},p:[
   {en:"Debt to assets = total debt ÷ total assets. Times interest earned = EBIT ÷ interest expense — an indication of the ability to meet interest payments as they come due.",ar:"الدين إلى الأصول = إجمالي الدين ÷ إجمالي الأصول. مرات تغطية الفوائد = EBIT ÷ مصروف الفوائد — مؤشر على القدرة على سداد الفوائد عند استحقاقها."}]},
  {co:"note",c:{en:"Transparency note on the slides' printed answers: the bold 244% does not follow the stated profit-margin formula (245,000/2,000,000 = 12.25%); the bold 95.4% equals debt ÷ equity (630,000/660,000) while the stated debt-to-assets formula gives 48.8%; TIE = 8 times (800% if written as a percent); and the slides' cash-ratio row repeats the quick-ratio numbers — per its formula the cash ratio is 100,000/180,000 = 0.56.",ar:"ملاحظة شفافية على الإجابات المطبوعة في الشرائح: النسبة العريضة 244% لا تتبع معادلة هامش الربح المذكورة (245,000/2,000,000 = 12.25%)؛ والنسبة العريضة 95.4% تساوي الدين ÷ الحقوق (630,000/660,000) بينما تعطي معادلة الدين/الأصول المذكورة 48.8%؛ وتغطية الفوائد = 8 مرات (800% إن كُتبت نسبًا)؛ وصفّ النسبة النقدية في الشرائح يكرر أرقام النسبة السريعة — وحسب معادلتها تكون النسبة النقدية 100,000/180,000 = 0.56."}},
  {h:{en:"Profitability — what does each dollar earn?",ar:"الربحية — ماذا يكسب كل دولار؟"},p:[
   {en:"Profit margin = net income ÷ net sales (each sales dollar's net income). Asset turnover = net sales ÷ average total assets. ROA = net income ÷ average total assets (each dollar invested in assets). ROE = net income ÷ average equity (each dollar of equity). EPS = net income ÷ weighted average shares. P/E = market price per share ÷ EPS.",ar:"هامش الربح = صافي الدخل ÷ صافي المبيعات (دخل كل دولار مبيعات). دوران الأصول = صافي المبيعات ÷ متوسط إجمالي الأصول. ROA = صافي الدخل ÷ متوسط إجمالي الأصول (كل دولار مستثمر في الأصول). ROE = صافي الدخل ÷ متوسط الحقوق (كل دولار حقوق). EPS = صافي الدخل ÷ المتوسط المرجح للأسهم. P/E = سعر السوق للسهم ÷ EPS."}]},
  {co:"simple",c:{en:"Ratios are the firm's medical check-up: liquidity = can it pay this month's bills? solvency = will it survive the years? efficiency = does it waste anything? profitability = what does each dollar earn?",ar:"النسب فحص طبي للمنشأة: السيولة = هل تسدد فواتير هذا الشهر؟ الملاءة = هل تنجو عبر السنين؟ الكفاءة = هل تهدر شيئًا؟ الربحية = ماذا يكسب كل دولار؟"}}],
 concepts:[{n:{en:"Liquidity vs solvency",ar:"السيولة مقابل الملاءة"},d:{en:"Liquidity = surviving the next twelve months; solvency = surviving the long run.",ar:"السيولة = النجاة في الاثني عشر شهرًا القادمة؛ الملاءة = النجاة على المدى الطويل."},w:{en:"A firm can be liquid but insolvent, or solvent but illiquid — the two ratio groups catch different diseases.",ar:"قد تكون المنشأة سائلة لكن غير مليئة، أو مليئة لكن غير سائلة — مجموعتا النسب تكشفان مرضين مختلفين."}}],
 terms:[{t:{en:"Quick ratio",ar:"النسبة السريعة"},d:{en:"(Cash + short-term investments + A/R) ÷ current liabilities.",ar:"(النقد + الاستثمارات القصيرة + المدينون) ÷ الخصوم المتداولة."},s:{en:"Can we pay now without selling stock from the warehouse?",ar:"هل نسدد الآن دون بيع مخزون المستودع؟"}},
  {t:{en:"Times interest earned",ar:"مرات تغطية الفوائد"},d:{en:"EBIT ÷ interest expense.",ar:"EBIT ÷ مصروف الفوائد."},s:{en:"How many times over could profit cover the interest bill?",ar:"كم مرة يغطي الربح فاتورة الفوائد؟"}},
  {t:{en:"Return on equity (ROE)",ar:"العائد على الحقوق"},d:{en:"Net income ÷ average shareholders' equity.",ar:"صافي الدخل ÷ متوسط حقوق المساهمين."},s:{en:"What each owner's dollar earned this year.",ar:"ما كسبه كل دولار من أموال الملاك هذا العام."}}],
 formulas:["current","quick","cash_ratio","ar_turn","inv_turn","debt_assets","tie","pm","at","roa","roe","pe"],
 examples:[{ti:{en:"ABC Co. — the full ratio set",ar:"شركة ABC — مجموعة النسب كاملة"},
  g:[{en:"2024: cash 100,000; A/R 180,000; inventory 160,000; CA 440,000; total assets 1,290,000 (2023: 950,000); CL 180,000; LT debt 450,000; equity 660,000 (2023: 500,000). Sales 2,000,000; COGS 1,200,000; EBIT 400,000; interest 50,000; NI 245,000. Shares 250,000; market price $5.",ar:"2024: نقد 100,000؛ مدينون 180,000؛ مخزون 160,000؛ متداولة 440,000؛ إجمالي الأصول 1,290,000 (2023: 950,000)؛ خصوم متداولة 180,000؛ دين طويل 450,000؛ حقوق 660,000 (2023: 500,000). المبيعات 2,000,000؛ تكلفة المبيعات 1,200,000؛ EBIT 400,000؛ فوائد 50,000؛ صافي الدخل 245,000. الأسهم 250,000 وسعر السوق 5$."}],
  rq:{en:"Compute the liquidity, solvency and profitability ratios.",ar:"احسب نسب السيولة والملاءة والربحية."},f:"current",
  st:[{en:"Current = 440,000/180,000 = 2.44 · Quick = (100,000+180,000)/180,000 = 1.56 · Cash = 100,000/180,000 = 0.56",ar:"التداول = 440,000÷180,000 = 2.44 · السريعة = (100,000+180,000)÷180,000 = 1.56 · النقدية = 100,000÷180,000 = 0.56"},
      {en:"Debt/Assets = (180,000+450,000)/1,290,000 = 48.8% · TIE = 400,000/50,000 = 8×",ar:"الدين/الأصول = (180,000+450,000)÷1,290,000 = 48.8% · تغطية الفوائد = 400,000÷50,000 = 8×"},
      {en:"Margin = 245,000/2,000,000 = 12.25% · Turnover = 2,000,000/1,120,000 = 1.78 · ROA = 245,000/1,120,000 = 21.87% · ROE = 245,000/580,000 = 42.24%",ar:"الهامش = 245,000÷2,000,000 = 12.25% · الدوران = 2,000,000÷1,120,000 = 1.78 · ROA = 245,000÷1,120,000 = 21.87% · ROE = 245,000÷580,000 = 42.24%"},
      {en:"EPS = 245,000/250,000 = 0.98 · P/E = 5/0.98 = 5.1",ar:"EPS = 245,000÷250,000 = 0.98 · P/E = 5÷0.98 = 5.1"}],
  an:{en:"Current 2.44 · Quick 1.56 · Cash 0.56 · Debt/Assets 48.8% · TIE 8× · Margin 12.25% · AT 1.78 · ROA 21.87% · ROE 42.24% · EPS $0.98 · P/E 5.1",ar:"التداول 2.44 · السريعة 1.56 · النقدية 0.56 · الدين/الأصول 48.8% · التغطية 8× · الهامش 12.25% · الدوران 1.78 · ROA 21.87% · ROE 42.24% · EPS 0.98$ · P/E 5.1"},
  ip:{en:"Strong liquidity (both ratios above 1), moderate leverage, and every equity dollar earns 42 cents — an attractive profile for an outside investor.",ar:"سيولة قوية (النسبتان فوق 1)، رافعة معتدلة، وكل دولار حقوق يكسب 42 سنتًا — ملف جذاب لمستثمر خارجي."}}],
 mistakes:[{en:"Using ending balances where the formula says average (ROA, ROE, turnover ratios).",ar:"استخدام الأرصدة الختامية بينما تشترط المعادلة المتوسط (ROA وROE ونسب الدوران)."},{en:"Including inventory in the quick ratio — it must be excluded.",ar:"إدراج المخزون في النسبة السريعة — يجب استبعاده."},{en:"Reading P/E upside-down: it is market price ÷ EPS, not EPS ÷ price.",ar:"قراءة P/E مقلوبة: سعر السوق ÷ EPS وليس EPS ÷ السعر."}],
 dist:[{ti:{en:"Current vs Quick ratio",ar:"نسبة التداول مقابل السريعة"},c1:{en:"Current",ar:"التداول"},c2:{en:"Quick",ar:"السريعة"},
  rows:[[{en:"Includes inventory & all CA",ar:"تشمل المخزون وكل المتداولة"},{en:"Only cash, ST investments, A/R",ar:"نقد واستثمارات قصيرة ومدينون فقط"}],

  note:{en:"A big gap between the two signals inventory-heavy current assets.",ar:"الفجوة الكبيرة بينهما تشير إلى أصول متداولة مثقلة بالمخزون."}}],

{id:"l9",ch:"c5",mins:12,title:{en:"Common & Preferred Stock",ar:"الأسهم العادية والممتازة"},
 desc:{en:"Equity vs debt, the anatomy of common shares, going public, and the hybrid nature of preferred stock.",ar:"الملكية مقابل الدين، تشريح السهم العادي، والطرح العام، والطبيعة الهجينة للسهم الممتاز."},
 obj:{en:["Contrast debt and equity on rights, claims, maturity and tax","Describe common-stock classes and par value","Explain the IPO process and the investment banker's role","List the features of preferred stock"],

 blocks:[
  {h:{en:"Common stock: the residual claimants",ar:"السهم العادي: أصحاب المطالب المتبقية"},p:[
   {en:"Common stockholders receive what is left from assets and income after all other claims are satisfied — so they expect high compensation through dividends and capital gains. Ownership can be privately, closely or publicly held. Shares may carry par value or be without par, and the company distinguishes authorized, issued, outstanding and treasury shares.",ar:"يحصل حاملو الأسهم العادية على ما يتبقى من الأصول والدخل بعد استيفاء كل المطالب الأخرى — لذا يتوقعون تعويضًا مرتفعًا عبر التوزيعات والأرباح الرأسمالية. الملكية قد تكون خاصة أو مغلقة أو عامة. وقد تحمل الأسهم قيمة اسمية أو تكون بلا قيمة اسمية، وتميز الشركة بين الأسهم المصرح بها والمصدرة والقائمة وأسهم الخزانة."}]},
  {h:{en:"Going public",ar:"الطرح العام"},p:[
   {en:"Firms grow from founders and venture capital, through private-equity and angel investors, to an IPO. To go public the firm must obtain current shareholders' approval and hire an investment bank to underwrite the offering: the banker buys the issue at an agreed-on price and bears the risk of reselling it to the public at a profit, while promoting and selling the shares.",ar:"تنمو المنشآت من المؤسسين ورأس المال الجريء، عبر الاستثمار الخاص والمستثمرين الملائكة، إلى الطرح العام الأولي. للطرح العام يجب الحصول على موافقة المساهمين الحاليين وتعيين بنك استثمار لتغطية الاكتتاب: يشتري البنك الإصدار بسعر متفق عليه ويتحمل مخاطر إعادة بيعه للجمهور بربح، مع الترويج للأسهم وبيعها."}]},
  {h:{en:"Preferred stock: the hybrid",ar:"السهم الممتاز: الهجين"},p:[
   {en:"Preferred stock pays fixed dividends, has a prior claim on earnings and assets in liquidation, and its dividends are cumulative (arrears accumulate) and paid before common dividends. It shares characteristics of both common stock and bonds.",ar:"السهم الممتاز يدفع توزيعات ثابتة، وله أولوية مطالب على الأرباح والأصول عند التصفية، وتوزيعاته تراكمية (المتأخرات تتراكم) وتُدفع قبل توزيعات الأسهم العادية. ويشترك في خصائص السهم العادي والسندات."}]},
  {co:"simple",c:{en:"In liquidation the queue is: taxman and lenders first, preferred shareholders next, common shareholders last — last in line demands the biggest prize, which is why common stock is the riskiest and potentially richest seat.",ar:"طابور التصفية: أولًا مصلحة الضرائب والمقرضون، ثم المساهمون المفضلون، وأخيرًا العاديون — من يقف آخر الطابور يطالب بالجائزة الأكبر، ولهذا السهم العادي أخطر المقاعد وأكثرها غنى محتملًا."}}],
 concepts:[{n:{en:"Residual claim",ar:"المطالبة المتبقية"},d:{en:"Common shareholders are paid only after every other claim; they absorb what remains.",ar:"لا يُدفع للمساهمين العاديين إلا بعد كل المطالب؛ فهم يستوعبون ما يتبقى."},w:{en:"It is the root of equity's higher expected return.",ar:"هو جذر العائد المتوقع الأعلى للملكية."}}],
 terms:[{t:{en:"Par value",ar:"القيمة الاسمية"},d:{en:"The stated face value of a share.",ar:"القيمة الوجهية المذكورة للسهم."},s:{en:"The price tag printed on the share certificate.",ar:"السعر المطبوع على شهادة السهم."}},
  {t:{en:"Treasury stock",ar:"أسهم الخزانة"},d:{en:"Issued shares the company bought back; issued minus treasury equals outstanding.",ar:"أسهم مصدرة اشترتها الشركة مرة أخرى؛ المصدرة ناقص الخزانة تساوي القائمة."},s:{en:"Shares that came home to the company.",ar:"أسهم عادت أدراجها إلى الشركة."}},
  {t:{en:"Cumulative dividends",ar:"التوزيعات التراكمية"},d:{en:"Unpaid preferred dividends accumulate in arrears and must be cleared before common dividends.",ar:"التوزيعات الممتازة غير المدفوعة تتراكم كمتأخرات ويجب سدادها قبل توزيعات الأسهم العادية."},s:{en:"Skipped preferred payments are never forgiven — only postponed.",ar:"دفعات الممتاز المُسقَطة لا تُلغى أبدًا — فقط تؤجل."}},
  {t:{en:"Underwriting",ar:"تغطية الاكتتاب"},d:{en:"The investment banker purchases the security issue from the issuer at an agreed price and bears the risk of reselling it to the public.",ar:"يشتري بنك الاستثمار الإصدار من المصدر بسعر متفق عليه ويتحمل مخاطر إعادة بيعه للجمهور."},s:{en:"The bank buys the whole batch and sells it piece by piece.",ar:"البنك يشتري الدفعة كلها ويبيعها قطعًا."}}],

{id:"l10",ch:"c5",mins:15,title:{en:"Stock Valuation Models",ar:"نماذج تقييم الأسهم"},
 desc:{en:"Expected return from dividends and growth, the zero-growth perpetuity, and the constant-growth (Gordon) model.",ar:"العائد المتوقع من التوزيعات والنمو، نموذج صفر النمو، ونموذج النمو الثابت (غوردون)."},
 obj:{en:["Compute expected return as dividend yield plus growth","Value a stock with the zero-growth model","Value a stock with the constant-growth model","Judge over- and under-valuation against market price"],
      ar:["حساب العائد المتوقع مجموعًا عائد التوزيع والنمو","تقييم سهم بنموذج صفر النمو","تقييم سهم بنموذج النمو الثابت","الحكم على الإفراط أو الانخفاض في التقييم مقابل سعر السوق"]},
 blocks:[
  {h:{en:"Where stock returns come from",ar:"من أين يأتي عائد الأسهم"},p:[
   {en:"A stock's return derives from dividends and capital gains, the gain resulting from appreciation of the market price due to growth in the firm's earnings. Mathematically: E(r) = D/P + g.",ar:"ينشأ عائد السهم من التوزيعات والأرباح الرأسمالية الناتجة عن ارتفاع سعر السوق بسبب نمو أرباح المنشأة. رياضيًا: E(r) = D/P + g."}]},
  {h:{en:"Zero-growth model (ZGM)",ar:"نموذج صفر النمو (ZGM)"},p:[
   {en:"The ZGM assumes the stock pays the same dividend every year forever — a perpetuity: P0 = D1 ÷ rs.",ar:"يفترض نموذج صفر النمو أن السهم يدفع التوزيع نفسه كل سنة للأبد — دخل دائم: P0 = D1 ÷ rs."}]},
  {h:{en:"Constant-growth model (Gordon)",ar:"نموذج النمو الثابت (غوردون)"},p:[
   {en:"When dividends grow at a constant rate g forever: P0 = D1 ÷ (rs − g), with D1 = D0 × (1 + g). The model only works when rs &gt; g.",ar:"حين تنمو التوزيعات بمعدل ثابت g للأبد: P0 = D1 ÷ (rs − g)، مع D1 = D0 × (1 + g). ولا يعمل النموذج إلا إذا كان rs &gt; g."}]},
  {co:"simple",c:{en:"A stock is worth the present value of every dividend it will ever pay. If dividends never grow, that infinite list collapses to D/rs. If they grow steadily, the same logic gives D1/(rs − g) — growth makes tomorrow's dividends bigger, so the stock is worth more today.",ar:"قيمة السهم هي القيمة الحالية لكل التوزيعات التي سيدفعها يومًا. إن لم تنمُ التوزيعات أبدًا تنكمش القائمة اللانهائية إلى D/rs. وإن نمت بثبات تعطي المنطقية نفسها D1/(rs − g) — النمو يكبّر توزيعات الغد فيرتفع سعر السهم اليوم."}},
  {co:"note",c:{en:"Decision rule: if your model value exceeds the market price the stock is undervalued (buy); if it is below, the stock is overvalued (sell/avoid). Investors buy when they feel a stock is undervalued and sell when they believe it overvalued — that trading drives prices to equilibrium.",ar:"قاعدة القرار: إذا تجاوزت قيمة نموذجك سعر السوق فالسهم مقوّم بأقل من قيمته (اشترِ)؛ وإن قلت فهو مقوّم بأعلى من قيمته (بِع/تجنّب). المستثمرون يشترون عند شعورهم بانخفاض التقييم ويبيعون عند اعتقادهم ارتفاعه — وتلك التداولات توصل الأسعار للتوازن."}}],
 concepts:[{n:{en:"Dividend discounting",ar:"خصم التوزيعات"},d:{en:"Stock value = present value of the expected future dividend stream.",ar:"قيمة السهم = القيمة الحالية لسلسلـة التوزيعات المستقبلية المتوقعة."},w:{en:"The same PV logic powers bond valuation in Chapter 7 — one family of ideas.",ar:"منطق القيمة الحالية نفسه يشغّل تقييم السندات في الفصل السابع — عائلة أفكار واحدة."}}],
 terms:[{t:{en:"Dividend yield",ar:"عائد التوزيع"},d:{en:"D ÷ P: the dividend return component of a stock's expected return.",ar:"D ÷ P: مكوّن عائد التوزيع في العائد المتوقع للسهم."},s:{en:"Cash paid back per dollar of share price.",ar:"النقد المرتد لكل دولار من سعر السهم."}},
  {t:{en:"Capital gain",ar:"الربح الرأسمالي"},d:{en:"The increase in the stock's market price, driven by earnings growth.",ar:"الزيادة في سعر السوق للسهم بدفع من نمو الأرباح."},s:{en:"Selling dearer than you bought.",ar:"أن تبيع أغلى مما اشتريت."}},
  {t:{en:"Required return (rs)",ar:"العائد المطلوب (rs)"},d:{en:"The return investors demand to hold the stock; the discount rate of the valuation models.",ar:"العائد الذي يطلبه المستثمرون لحمل السهم؛ وهو معدل الخصم في نماذج التقييم."},s:{en:"The price of patience and risk for this stock.",ar:"ثمن الصبر والمخاطرة في هذا السهم."}}],
 formulas:["er_stock","zgm","cgm"],
